<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llutid+ | Nivel Pro</title>

    <script>
        // --- LÓGICA DE BLOQUEO POR 30 DÍAS ---
        const REDIRECT_KEY = 'llutid_welcome_hidden';
        const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000; // Milisegundos en 30 días

        function checkAccess() {
            const savedData = localStorage.getItem(REDIRECT_KEY);
            if (savedData) {
                const registrationDate = parseInt(savedData);
                const now = new Date().getTime();
                
                // Si han pasado menos de 30 días, saltar a login.html
                if (now - registrationDate < THIRTY_DAYS) {
                    window.location.replace('login.html');
                } else {
                    // Si ya pasaron los 30 días, borramos para que vea la bienvenida de nuevo
                    localStorage.removeItem(REDIRECT_KEY);
                }
            }
        }

        // Función para activar el bloqueo de 30 días
        function setAccessBlock() {
            const now = new Date().getTime();
            localStorage.setItem(REDIRECT_KEY, now.toString());
        }

        // Ejecutar comprobación antes de mostrar nada
        checkAccess();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f1014;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            height: 80vh;
            width: 100%;
            display: flex;
            align-items: flex-end;
            padding-bottom: 2.5rem;
            overflow: hidden;
        }

        .brand-header {
            position: absolute;
            top: 25px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .hero-gradient {
            background: linear-gradient(to top, #0f1014 8%, rgba(15, 16, 20, 0) 45%, rgba(15, 16, 20, 0.7) 100%);
        }

        .app-card {
            background: #1c1d24;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .btn-primary {
            background: #007bff;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            border-radius: 12px;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .plan-steps-container { display: none; }
        .plan-steps-container.active { display: block; animation: slideUp 0.4s ease; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-content { display: none; }
        .step-content.active { display: block; }

        input {
            background: #2a2b33 !important;
            border: 1px solid #3f404a !important;
            color: white !important;
            height: 52px;
            border-radius: 12px;
            width: 100%;
            padding: 0 1rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="antialiased">

    <header class="hero-section">
        <div class="brand-header">
            <div class="text-2xl font-extrabold tracking-tighter">
                <span class="text-blue-500">llutid</span><span class="text-white">+</span>
            </div>
            <button id="nav-login-btn" class="text-sm font-bold bg-white/10 backdrop-blur-md px-5 py-2 rounded-full border border-white/20">
                Entrar
            </button>
        </div>

        <div id="hero-background-images" class="absolute inset-0 w-full h-full"></div>
        <div class="absolute inset-0 hero-gradient"></div>
        
        <div class="relative z-10 px-6 w-full text-left">
            <h1 class="text-5xl font-extrabold mb-3 tracking-tight leading-[1.1]">Dale play al<br>nivel pro.</h1>
            <p class="text-gray-300 text-sm mb-6 max-w-[280px]">Tu contenido favorito, sin anuncios y en la mejor calidad.</p>
            
            <button id="scrollToPlansBtn" class="w-full btn-primary py-4 text-lg font-bold">
                Iniciar Experiencia
            </button>
        </div>
    </header>

    <main class="px-6 relative z-20">
        <section class="mt-8 mb-10">
            <h2 class="text-lg font-bold mb-4">Tendencias ahora</h2>
            <div class="flex overflow-x-auto gap-3 scrollbar-hide">
                <div class="min-w-[150px] h-[220px] rounded-xl overflow-hidden shadow-lg border border-white/5">
                    <img src="https://cinemauniplaza.com.co/wp-content/uploads/2025/10/77fe751f4b3a-bp2_cineco_2-poster_480x670.jpg" class="w-full h-full object-cover">
                </div>
                <div class="min-w-[150px] h-[220px] rounded-xl overflow-hidden shadow-lg border border-white/5">
                    <img src="https://www.aceprensa.com/wp-content/uploads/2019/08/71446-1-683x1024.jpg" class="w-full h-full object-cover">
                </div>
                <div class="min-w-[150px] h-[220px] rounded-xl overflow-hidden shadow-lg border border-white/5">
                    <img src="https://m.media-amazon.com/images/S/pv-target-images/ae5392d746731715a5218c63fa5eabac7de538b0aa325e7744e40a9696a089b5.png" class="w-full h-full object-cover">
                </div>
                <div class="min-w-[150px] h-[220px] rounded-xl overflow-hidden shadow-lg border border-white/5">
                    <img src="https://resizing.flixster.com/mKKmrj6RQLnOy_lZVtiH1kaYKnc=/fit-in/705x460/v2/https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p31204312_v_v9_ab.jpg" class="w-full h-full object-cover">
                </div>
            </div>
        </section>

        <section id="planes-section" class="pb-10">
            <h2 class="text-2xl font-bold mb-6 text-center">Nuestros Planes</h2>
            <div class="space-y-4">
                <div class="app-card p-6 border-l-4 border-gray-600">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-xl font-bold">Plan Gratuito</h3>
                            <p class="text-blue-400 text-[11px] font-semibold uppercase">Código de regalo o cupón</p>
                        </div>
                        <span class="text-xl font-bold text-gray-400">0 COP</span>
                    </div>
                    <button id="free-register-btn" class="w-full btn-primary block text-center py-3 font-bold">Registrarse</button>
                </div>

                <div class="app-card p-6 border-l-4 border-blue-500 plan-card" data-plan="Basico">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold">Plan Básico</h3>
                        <div class="text-right">
                            <span class="text-xl font-bold">$2.500</span>
                            <span class="text-[10px] block text-gray-400 uppercase">Mes</span>
                        </div>
                    </div>
                    <button class="select-plan-btn w-full bg-white/5 py-3 rounded-xl font-bold border border-white/10">Seleccionar</button>
                    <div class="plan-steps-container pt-4" data-plan-target="Basico">
                        <div class="step-content active">
                            <input type="email" class="email-input" placeholder="Correo electrónico">
                            <button class="next-step-btn w-full btn-primary py-3">Siguiente</button>
                        </div>
                        <div class="step-content">
                            <input type="text" class="fullname-input" placeholder="Nombre completo">
                            <button class="send-whatsapp-btn w-full bg-[#25D366] py-3 rounded-xl font-bold">Activar en WhatsApp</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="mt-10 border-t border-white/10 pt-8 pb-12">
            <div class="space-y-5">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-500/10 p-3 rounded-xl"><svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></div>
                    <div><p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Email</p><p class="text-sm font-semibold">llutidoficial@gmail.com</p></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="bg-green-500/10 p-3 rounded-xl"><svg class="w-5 h-5 text-[#25D366]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div>
                    <div><p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">WhatsApp</p><p class="text-sm font-semibold">+57 318 1087834</p></div>
                </div>
            </div>
        </footer>
    </main>

    <script>
        // --- Carrusel de Fondos ---
        const imageUrls = [
            "https://www.cronista.com/resizer/v2/2CLZCBNMPVCEBFPI2X2RBOZPOY.jpg?auth=59c5d4a99d034dbb5ecf0e07eab0c2ff099846721721ef9156699134f18eea3c&height=533&width=800&quality=70&smart=true", 
            "https://blob.elporvenir.mx/images/2020/08/31/streaming-focus-0-0-750-440.jpg"
        ];
        const bgContainer = document.getElementById('hero-background-images');
        const images = imageUrls.map((url, i) => {
            const img = document.createElement('img');
            img.src = url;
            img.className = `absolute inset-0 w-full h-full object-cover transition-opacity duration-[2000ms] ${i===0 ? 'opacity-40' : 'opacity-0'}`;
            bgContainer.appendChild(img);
            return img;
        });

        let currentIdx = 0;
        setInterval(() => {
            images[currentIdx].classList.replace('opacity-40', 'opacity-0');
            currentIdx = (currentIdx + 1) % images.length;
            images[currentIdx].classList.replace('opacity-0', 'opacity-40');
        }, 5000);

        // --- MANEJO DE REDIRECCIÓN Y BLOQUEO ---
        
        // Botón Entrar
        document.getElementById('nav-login-btn').onclick = () => {
            setAccessBlock();
            window.location.replace('login.html');
        };

        // Botón Iniciar Experiencia
        document.getElementById('scrollToPlansBtn').onclick = () => {
            setAccessBlock();
            window.location.replace('registro.html');
        };

        // Botón Registrarse (Gratis)
        document.getElementById('free-register-btn').onclick = () => {
            setAccessBlock();
            window.location.replace('registro.html');
        };

        // Lógica de Pasos Plan Básico
        const state = { email: '', name: '' };
        document.querySelector('.select-plan-btn').onclick = (e) => {
            e.target.style.display = 'none';
            document.querySelector('[data-plan-target="Basico"]').classList.add('active');
        };

        document.querySelector('.next-step-btn').onclick = () => {
            state.email = document.querySelector('.email-input').value;
            if(!state.email) return alert("Ingresa tu correo");
            document.querySelectorAll('.step-content')[0].classList.remove('active');
            document.querySelectorAll('.step-content')[1].classList.add('active');
        };

        document.querySelector('.send-whatsapp-btn').onclick = () => {
            state.name = document.querySelector('.fullname-input').value;
            if(!state.name) return alert("Ingresa tu nombre");
            
            // También bloqueamos aquí porque ya interactuó
            setAccessBlock();

            const msg = `¡Hola! Me interesa el Plan Básico.\nEmail: ${state.email}\nNombre: ${state.name}`;
            window.open(`https://wa.me/573181087834?text=${encodeURIComponent(msg)}`, '_blank');
        };
    </script>
</body>
</html>
