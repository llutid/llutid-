<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LLUTID+</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── BOTÓN CHATBOT (esquina superior derecha) ── */
        .chatbot-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 150;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            border: 1.5px solid rgba(255,255,255,0.22);
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
            outline: none;
        }
        .chatbot-btn:hover {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.38);
            transform: scale(1.08);
        }
        .chatbot-btn:active { transform: scale(0.95); }
        .chatbot-pulse {
            position: absolute;
            top: 8px; right: 8px;
            width: 8px; height: 8px;
            background: #007bff;
            border-radius: 50%;
            border: 1.5px solid #0d0d0d;
        }

        /* ── PANEL CHATBOT ── */
        .chatbot-overlay {
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .chatbot-overlay.open { opacity: 1; pointer-events: auto; }

        .chatbot-panel {
            background: #111118;
            border-radius: 22px 22px 0 0;
            height: 84vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .chatbot-overlay.open .chatbot-panel { transform: translateY(0); }

        .chatbot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .chatbot-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chatbot-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #0055bb);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
        }
        .chatbot-title { font-weight: 700; font-size: 0.95rem; }
        .chatbot-subtitle { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
        .chatbot-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
            outline: none;
        }
        .chatbot-close:hover { background: rgba(255,255,255,0.16); }

        .chatbot-panel iframe {
            flex: 1;
            border: none;
            width: 100%;
        }

        /* ── SPINNER DE VERIFICACIÓN ── */
        .checking-screen {
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .checking-screen.hide { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.12);
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .checking-screen p { color: rgba(255,255,255,0.45); font-size: 0.9rem; }

        /* ── BANNER DE ESTADO ── */
        .status-banner {
            display: none;
            text-align: center;
            padding: 11px 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .status-banner.show { display: block; }
        .status-banner.expired  { background: linear-gradient(90deg, #7b4a1e, #9b6025); color: #fff; }
        .status-banner.cancelled { background: linear-gradient(90deg, #1e237b, #252ba0); color: #fff; }

        /* ── GRID DE PORTADAS ── */
        .cover-grid {
            position: relative;
            flex: 1;
            overflow: hidden;
        }
        .grid-inner {
            position: absolute;
            inset: -20% -10%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            transform: rotate(-12deg) scale(1.25);
            transform-origin: center center;
        }
        .grid-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            pointer-events: none;
        }
        .cover-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                rgba(13,13,13,0.08) 0%,
                rgba(13,13,13,0.50) 52%,
                rgba(13,13,13,1.00) 100%);
            pointer-events: none;
        }

        /* ── PANEL INFERIOR ── */
        .bottom-panel {
            flex-shrink: 0;
            padding: 0 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #0d0d0d;
        }
        .llutid-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            line-height: 1;
        }
        .llutid-logo .word {
            font-weight: 900;
            font-size: clamp(2.6rem, 12vw, 3.4rem);
            letter-spacing: 0.04em;
            color: #fff;
        }
        .llutid-logo .plus {
            font-weight: 900;
            font-size: clamp(2rem, 9vw, 2.6rem);
            color: #007bff;
            margin-left: 3px;
            position: relative;
            top: -4px;
        }
        .headline {
            font-size: clamp(1.3rem, 5.2vw, 1.6rem);
            font-weight: 700;
            line-height: 1.25;
            color: #fff;
            margin-bottom: 8px;
            max-width: 320px;
        }
        .subline {
            font-size: clamp(0.85rem, 3.2vw, 0.95rem);
            color: rgba(255,255,255,0.58);
            margin-bottom: 18px;
        }

        /* ── TARJETA DE INFO (vencido / cancelado) ── */
        .info-card {
            width: 100%;
            max-width: 360px;
            border-radius: 14px;
            padding: 15px 18px;
            margin-bottom: 18px;
            text-align: left;
        }
        .info-card.expired-card {
            background: rgba(224,138,48,0.08);
            border: 1px solid rgba(224,138,48,0.30);
        }
        .info-card.cancelled-card {
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.30);
        }
        .ic-icon-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 8px;
        }
        .ic-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .expired-card  .ic-icon { background: rgba(224,138,48,0.18); }
        .cancelled-card .ic-icon { background: rgba(99,102,241,0.18); }
        .ic-label {
            font-size: 0.88rem;
            font-weight: 700;
        }
        .expired-card  .ic-label { color: #e08a30; }
        .cancelled-card .ic-label { color: #7b7ff0; }
        .ic-body {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.58);
            line-height: 1.55;
            margin-bottom: 6px;
        }
        .ic-meta {
            font-size: 0.76rem;
            color: rgba(255,255,255,0.36);
            font-style: italic;
        }

        /* ── BOTONES ── */
        .btn {
            width: 100%;
            max-width: 360px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: transform 0.15s, background 0.2s, opacity 0.2s;
            margin-bottom: 11px;
            outline: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn:focus  { outline: none; }

        .btn-primary { background: #fff; color: #0d0d0d; }
        .btn-primary:hover { background: #e8e8e8; }

        .btn-secondary {
            background: rgba(255,255,255,0.09);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.16); }

        .btn-expired {
            background: linear-gradient(135deg, #e08a30 0%, #c56e1a 100%);
            color: #fff;
        }
        .btn-expired:hover { opacity: 0.88; }

        .btn-new-account {
            background: rgba(255,255,255,0.09);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .btn-new-account:hover { background: rgba(255,255,255,0.16); }

        .link-login {
            font-size: 0.83rem;
            color: rgba(255,255,255,0.48);
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Barlow', Arial, sans-serif;
            text-decoration: underline;
            margin-bottom: 16px;
            padding: 0;
            outline: none;
        }
        .link-login:hover { color: rgba(255,255,255,0.75); }

        .privacy-link {
            font-size: 0.82rem;
            color: #007bff;
            font-weight: 700;
            text-decoration: none;
            outline: none;
        }
        .privacy-link:hover { color: #4da8ff; }
    </style>
</head>
<body>

<!-- PANTALLA DE VERIFICACIÓN -->
<div class="checking-screen" id="checkingScreen">
    <div class="spinner"></div>
    <p>Verificando...</p>
</div>

<!-- BOTÓN CHATBOT -->
<button class="chatbot-btn" id="chatbotBtn" title="Chat de soporte" aria-label="Abrir chat de soporte">
    ?
    <span class="chatbot-pulse"></span>
</button>

<!-- PANEL CHATBOT (slide-up) -->
<div class="chatbot-overlay" id="chatbotOverlay">
    <div class="chatbot-panel">
        <div class="chatbot-header">
            <div class="chatbot-header-left">
                <div class="chatbot-avatar">L+</div>
                <div>
                    <div class="chatbot-title">Soporte LLUTID+</div>
                    <div class="chatbot-subtitle">Normalmente respondemos de inmediato</div>
                </div>
            </div>
            <button class="chatbot-close" id="chatbotClose" aria-label="Cerrar chat">✕</button>
        </div>
        <iframe id="chatbotFrame" src="" title="Chat de soporte LLUTID+" loading="lazy"></iframe>
    </div>
</div>

<!-- BANNER DE ESTADO -->
<div class="status-banner" id="statusBanner"></div>

<!-- REJILLA DE PORTADAS -->
<div class="cover-grid">
    <div class="grid-inner">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
    </div>
    <div class="cover-fade"></div>
</div>

<!-- PANEL INFERIOR -->
<div class="bottom-panel">
    <div class="llutid-logo">
        <span class="word">LLUTID</span><span class="plus">+</span>
    </div>

    <h1 class="headline" id="mainHeadline">Descubre series y películas emblemáticas</h1>
    <p class="subline" id="mainSubline">Comienza gratis o inicia sesión en tu cuenta</p>

    <!-- Tarjeta de información (vencido / cancelado) -->
    <div class="info-card" id="infoCard" style="display:none;"></div>

    <!-- Botón principal -->
    <button class="btn btn-primary" id="btnMain">Comenzar</button>

    <!-- Botón secundario (solo en primera vez) -->
    <button class="btn btn-secondary" id="btnSecondary">Iniciar sesión</button>

    <!-- Link pequeño (para vencido/cancelado) -->
    <button class="link-login" id="btnLink" style="display:none;">Iniciar sesión</button>

    <a href="#" class="privacy-link">Privacidad y Términos</a>
</div>

<script>
/* ══════════════════════════════════════════════
   CLAVES DE LOCALSTORAGE
   llutid_membership : null | 'active' | 'expired' | 'cancelled'
   llutid_expires_at : ISO string (fecha de vencimiento)
   llutid_session    : 'true' cuando login o registro completó con éxito
══════════════════════════════════════════════ */
const MEMBERSHIP_KEY = 'llutid_membership';
const EXPIRES_KEY    = 'llutid_expires_at';
const SESSION_KEY    = 'llutid_session';       // ← flag de éxito
const CHATBOT_URL    = 'https://llutid.github.io/chat-bot-llutid-/';

/* ── Referencias DOM ── */
const checkScreen  = document.getElementById('checkingScreen');
const statusBanner = document.getElementById('statusBanner');
const infoCard     = document.getElementById('infoCard');
const btnMain      = document.getElementById('btnMain');
const btnSecondary = document.getElementById('btnSecondary');
const btnLink      = document.getElementById('btnLink');

/* ══════════════════════════════════════════════
   CHATBOT
══════════════════════════════════════════════ */
const chatbotBtn     = document.getElementById('chatbotBtn');
const chatbotOverlay = document.getElementById('chatbotOverlay');
const chatbotClose   = document.getElementById('chatbotClose');
const chatbotFrame   = document.getElementById('chatbotFrame');
let chatbotLoaded    = false;

function openChatbot() {
    if (!chatbotLoaded) { chatbotFrame.src = CHATBOT_URL; chatbotLoaded = true; }
    chatbotOverlay.classList.add('open');
}
function closeChatbot() { chatbotOverlay.classList.remove('open'); }

chatbotBtn.addEventListener('click', openChatbot);
chatbotClose.addEventListener('click', closeChatbot);
chatbotOverlay.addEventListener('click', (e) => {
    if (e.target === chatbotOverlay) closeChatbot();
});

/* ══════════════════════════════════════════════
   UTILIDADES DE FECHA
══════════════════════════════════════════════ */
function formatDate(isoStr) {
    if (!isoStr) return null;
    try {
        return new Date(isoStr).toLocaleDateString('es-CO', {
            day: 'numeric', month: 'long', year: 'numeric'
        });
    } catch(e) { return null; }
}

function relativeTime(isoStr) {
    if (!isoStr) return null;
    try {
        const diff = Date.now() - new Date(isoStr).getTime();
        const days = Math.round(Math.abs(diff) / 86400000);
        const past = diff > 0;
        if (days === 0) return 'hoy';
        if (days === 1) return past ? 'hace 1 día' : 'en 1 día';
        return past ? `hace ${days} días` : `en ${days} días`;
    } catch(e) { return null; }
}

/* ══════════════════════════════════════════════
   OCULTAR PANTALLA DE VERIFICACIÓN
══════════════════════════════════════════════ */
function hideCheckScreen() {
    checkScreen.classList.add('hide');
    setTimeout(() => checkScreen.style.display = 'none', 420);
}

/* ══════════════════════════════════════════════
   LÓGICA PRINCIPAL
   Orden de comprobación:
   1. ¿Hay sesión activa (flag de éxito)?  → login.html
   2. ¿Membresía activa?                   → login.html
   3. ¿Vencida?                            → pantalla "vencida"
   4. ¿Cancelada?                          → pantalla "cancelada"
   5. Sin dato (primera vez)               → bienvenida normal
══════════════════════════════════════════════ */
function checkMembershipAndRoute() {
    /* ── 1. Flag de sesión exitosa (login.html / registro.html lo activan) ── */
    if (localStorage.getItem(SESSION_KEY) === 'true') {
        window.location.href = 'login.html';
        return;
    }

    let status    = localStorage.getItem(MEMBERSHIP_KEY);
    const expires = localStorage.getItem(EXPIRES_KEY);

    /* ── Verificación automática de vencimiento ── */
    if (status === 'active' && expires && new Date(expires) < new Date()) {
        status = 'expired';
        localStorage.setItem(MEMBERSHIP_KEY, 'expired');
    }

    /* ── 2. Activo: ir a login.html ── */
    if (status === 'active') {
        window.location.href = 'login.html';
        return;
    }

    hideCheckScreen();

    /* ── 3. VENCIDO ── */
    if (status === 'expired') {
        statusBanner.textContent = '⏰  Tu membresía ha vencido — Reactívala para seguir disfrutando LLUTID+';
        statusBanner.classList.add('show', 'expired');

        document.getElementById('mainHeadline').textContent = 'Tu membresía ha vencido';
        document.getElementById('mainSubline').textContent  = 'Renueva tu acceso y vuelve a todo el contenido';

        const fechaFmt = formatDate(expires);
        const cuanto   = relativeTime(expires);

        infoCard.className     = 'info-card expired-card';
        infoCard.style.display = 'block';
        infoCard.innerHTML     = `
            <div class="ic-icon-row">
                <div class="ic-icon">⏰</div>
                <span class="ic-label">Membresía vencida</span>
            </div>
            <div class="ic-body">
                Tu acceso a LLUTID+ ha expirado. Para volver a disfrutar de todo el contenido,
                reactiva tu membresía con un nuevo plan.
            </div>
            ${fechaFmt ? `<div class="ic-meta">Venció el ${fechaFmt}${cuanto ? ' · ' + cuanto : ''}</div>` : ''}
        `;

        btnMain.textContent = 'Reiniciar membresía';
        btnMain.className   = 'btn btn-expired';
        btnMain.onclick     = () => {
            localStorage.setItem(SESSION_KEY, 'true');
            window.location.href = 'registro.html';
        };

        btnSecondary.style.display = 'none';

        btnLink.textContent   = 'Ya tengo cuenta activa — Iniciar sesión';
        btnLink.style.display = 'block';
        btnLink.onclick       = () => {
            localStorage.setItem(SESSION_KEY, 'true');
            window.location.href = 'login.html';
        };
        return;
    }

    /* ── 4. CANCELADO ── */
    if (status === 'cancelled') {
        statusBanner.textContent = '🚫  Tu cuenta fue cancelada — Usa el chat ? si crees que es un error';
        statusBanner.classList.add('show', 'cancelled');

        document.getElementById('mainHeadline').textContent = 'Tu cuenta fue cancelada';
        document.getElementById('mainSubline').textContent  = 'Puedes crear una nueva cuenta cuando quieras';

        infoCard.className     = 'info-card cancelled-card';
        infoCard.style.display = 'block';
        infoCard.innerHTML     = `
            <div class="ic-icon-row">
                <div class="ic-icon">🚫</div>
                <span class="ic-label">Cuenta desactivada</span>
            </div>
            <div class="ic-body">
                Tu acceso a LLUTID+ fue cancelado por el administrador. Si crees que esto
                es un error o necesitas más información, contáctanos a través del chat de soporte.
            </div>
            <div class="ic-meta">Toca el botón <strong style="color:#fff;">?</strong> en la esquina superior derecha para hablar con soporte.</div>
        `;

        btnMain.textContent = 'Crear nueva cuenta';
        btnMain.className   = 'btn btn-new-account';
        btnMain.onclick     = () => {
            localStorage.setItem(SESSION_KEY, 'true');
            window.location.href = 'registro.html';
        };

        btnSecondary.style.display = 'none';

        btnLink.textContent   = 'Iniciar sesión con otra cuenta';
        btnLink.style.display = 'block';
        btnLink.onclick       = () => {
            localStorage.setItem(SESSION_KEY, 'true');
            window.location.href = 'login.html';
        };
        return;
    }

    /* ── 5. PRIMERA VEZ (null) ── */
    btnMain.textContent = 'Comenzar';
    btnMain.className   = 'btn btn-primary';
    btnMain.onclick     = () => {
        localStorage.setItem(SESSION_KEY, 'true');
        window.location.href = 'registro.html';
    };

    btnSecondary.style.display = 'block';
    btnSecondary.textContent   = 'Iniciar sesión';
    btnSecondary.onclick       = () => {
        localStorage.setItem(SESSION_KEY, 'true');
        window.location.href = 'login.html';
    };

    btnLink.style.display = 'none';
}

/* ══════════════════════════════════════════════
   INICIO
══════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', checkMembershipAndRoute);
</script>
</body>
</html>
