<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LLUTID+</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── GRID DE PORTADAS (top) ── */
        .cover-grid {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        /* Mosaico inclinado igual al de HBO Max */
        .grid-inner {
            position: absolute;
            inset: -20% -10%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            transform: rotate(-12deg) scale(1.25);
            transform-origin: center center;
        }

        .grid-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        /* Gradiente oscuro sobre la rejilla */
        .cover-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(13,13,13,0.10) 0%,
                rgba(13,13,13,0.55) 55%,
                rgba(13,13,13,1) 100%
            );
            pointer-events: none;
        }

        /* ── PANEL INFERIOR ── */
        .bottom-panel {
            flex-shrink: 0;
            padding: 0 28px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #0d0d0d;
        }

        /* Logo LLUTID+ */
        .llutid-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            line-height: 1;
        }

        .llutid-logo .word {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(2.8rem, 13vw, 3.6rem);
            letter-spacing: 0.04em;
            color: #ffffff;
        }

        .llutid-logo .plus {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 10vw, 2.8rem);
            color: #007bff;
            margin-left: 3px;
            position: relative;
            top: -4px;
        }

        /* Titular */
        .headline {
            font-size: clamp(1.45rem, 5.5vw, 1.75rem);
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            margin-bottom: 10px;
            max-width: 320px;
        }

        /* Subtítulo */
        .subline {
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            font-weight: 400;
            color: rgba(255,255,255,0.72);
            margin-bottom: 30px;
        }

        /* Botones */
        .btn {
            width: 100%;
            max-width: 360px;
            padding: 16px;
            border-radius: 10px;
            border: none;
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: #ffffff;
            color: #0d0d0d;
            margin-bottom: 14px;
        }
        .btn-primary:hover { background: #e8e8e8; }

        .btn-secondary {
            background: rgba(255,255,255,0.12);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.18);
            margin-bottom: 22px;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.20); }

        /* Link de privacidad */
        .privacy-link {
            font-size: 0.85rem;
            color: #007bff;
            font-weight: 700;
            text-decoration: none;
        }
        .privacy-link:hover { color: #4da8ff; text-decoration: underline; }

        /* ── MODAL LOGIN ── */
        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 80;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: auto; }

        .modal {
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            padding: 28px 24px 44px;
            width: 100%;
            max-width: 480px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .modal-backdrop.open .modal { transform: translateY(0); }

        .modal h2 {
            font-size: 1.3rem; font-weight: 700;
            margin-bottom: 22px; text-align: center;
        }

        .field {
            margin-bottom: 14px;
        }
        .field input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #007bff; }
        .field input::placeholder { color: rgba(255,255,255,0.42); }

        .modal .btn-primary { margin-bottom: 14px; }

        .modal-links {
            display: flex; justify-content: space-between;
            font-size: 0.82rem;
        }
        .modal-links a {
            color: #007bff; text-decoration: none; font-weight: 700;
        }
        .modal-links a:hover { color: #4da8ff; }

        .close-bar {
            width: 42px; height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            margin: 0 auto 22px;
            cursor: pointer;
        }

        /* ── POPUPS ── */
        .popup {
            position: fixed; left: 50%; top: 50%;
            transform: translate(-50%,-50%) scale(0.92);
            padding: 18px 26px; border-radius: 14px;
            z-index: 90; color: #fff; font-weight: 700;
            text-align: center; opacity: 0; pointer-events: none;
            transition: all 0.25s ease; font-family: 'Barlow', Arial, sans-serif;
        }
        .popup.show { opacity: 1; transform: translate(-50%,-50%) scale(1); pointer-events: auto; }
        .popup.success { background: rgba(0,160,80,0.95); }
        .popup.error   { background: rgba(200,20,20,0.95); }
        .popup p { margin-top: 8px; font-size: 0.88rem; font-weight: 700; }
    </style>
</head>
<body>

<!-- REJILLA DE PORTADAS -->
<div class="cover-grid">
    <div class="grid-inner">
        <!-- 12 pósters: mezcla de series/películas de libre uso o dominio público -->
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
        <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
        <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
        <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">
    </div>
    <div class="cover-fade"></div>
</div>

<!-- PANEL INFERIOR -->
<div class="bottom-panel">
    <!-- Logo -->
    <div class="llutid-logo">
        <span class="word">LLUTID</span><span class="plus">+</span>
    </div>

    <h1 class="headline">Descubre series y películas emblemáticas</h1>
    <p class="subline">Iniciar sesión o comenzar con LLUTID+</p>

    <button class="btn btn-primary" id="btnComenzar">Comenzar</button>
    <button class="btn btn-secondary" id="btnIniciar">Iniciar sesión</button>

    <a href="#" class="privacy-link">Privacidad y Términos</a>
</div>

<!-- MODAL LOGIN -->
<div class="modal-backdrop" id="modal">
    <div class="modal">
        <div class="close-bar" id="closeBar"></div>
        <h2>Inicia sesión</h2>

        <div class="field">
            <input id="correo" type="email" placeholder="Correo electrónico" autocomplete="username">
        </div>
        <div class="field">
            <input id="pin" type="password" placeholder="PIN de acceso (6 dígitos)" maxlength="6" inputmode="numeric" autocomplete="off">
        </div>

        <button class="btn btn-primary" id="loginBtn" style="max-width:100%;">Ingresar</button>

        <div class="modal-links">
            <a href="./registro.html">Regístrate ahora</a>
            <a href="#" id="forgotPin">¿Olvidaste tu PIN?</a>
        </div>
    </div>
</div>

<!-- POPUPS -->
<div class="popup success" id="popOk">
    ✓ Acceso exitoso
    <p id="popOkMsg">Bienvenido a LLUTID+</p>
</div>
<div class="popup error" id="popErr">
    ✕ Acceso denegado
    <p id="popErrMsg"></p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",
    authDomain: "llutid-18d26.firebaseapp.com",
    projectId: "llutid-18d26",
    storageBucket: "llutid-18d26.firebasestorage.app",
    messagingSenderId: "900505351564",
    appId: "1:900505351564:web:e71805939e3488170652a9"
};

let auth = null;
const modal   = document.getElementById('modal');
const popOk   = document.getElementById('popOk');
const popErr  = document.getElementById('popErr');

function openModal()  { modal.classList.add('open'); }
function closeModal() { modal.classList.remove('open'); }

function showOk(msg) {
    document.getElementById('popOkMsg').textContent = msg || '';
    popOk.classList.add('show');
    setTimeout(() => popOk.classList.remove('show'), 3500);
}

function showErr(msg) {
    document.getElementById('popErrMsg').textContent = msg || '';
    popErr.classList.add('show');
    setTimeout(() => popErr.classList.remove('show'), 2500);
}

document.getElementById('btnIniciar').addEventListener('click', openModal);
document.getElementById('btnComenzar').addEventListener('click', () => {
    window.location.href = './registro.html';
});
document.getElementById('closeBar').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

document.addEventListener('DOMContentLoaded', () => {
    try {
        const app = firebase.initializeApp(firebaseConfig);
        auth = app.auth();
    } catch(e) { console.warn('Firebase init:', e); }

    const correoEl = document.getElementById('correo');
    const pinEl    = document.getElementById('pin');

    const savedCorreo = localStorage.getItem('correo');
    const savedPin    = localStorage.getItem('pin');
    if (savedCorreo) correoEl.value = savedCorreo;
    if (savedPin && savedPin.length === 6) {
        pinEl.value = savedPin;
        pinEl.type  = 'text';
        pinEl.addEventListener('focus', () => { pinEl.type = 'password'; pinEl.value = savedPin; }, { once: true });
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        if (!auth) { showErr('Error de conexión. Recarga la página.'); return; }
        const correo = (correoEl.value || '').trim().toLowerCase();
        const pin    = (pinEl.value || '').trim();
        if (!correo || pin.length !== 6) { showErr('Ingresa un correo y un PIN de 6 dígitos'); return; }
        try {
            await auth.signInWithEmailAndPassword(correo, pin);
            localStorage.setItem('correo', correo);
            localStorage.setItem('pin', pin);
            showOk('Bienvenido a LLUTID+');
            setTimeout(() => { window.location.href = 'home.html'; }, 2000);
        } catch (err) {
            localStorage.removeItem('pin');
            pinEl.value = ''; pinEl.type = 'password';
            if (['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(err.code)) {
                showErr('Correo o PIN incorrecto');
            } else if (err.code === 'auth/invalid-email') {
                showErr('Formato de correo inválido');
            } else {
                showErr('Error de acceso. Verifica tu conexión.');
            }
        }
    });

    document.getElementById('forgotPin').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!auth) { showErr('Error de conexión.'); return; }
        const correo = (correoEl.value || '').trim().toLowerCase();
        if (!correo) { showErr('Ingresa tu correo primero'); return; }
        try {
            await auth.sendPasswordResetEmail(correo);
            showOk(`Enviamos instrucciones a ${correo}`);
        } catch (err) {
            if (err.code === 'auth/user-not-found') showErr('No existe usuario con ese correo.');
            else if (err.code === 'auth/invalid-email') showErr('Formato de correo inválido.');
            else showErr('Error al enviar. Verifica tu conexión.');
        }
    });

    [correoEl, pinEl].forEach(el => {
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    });
});
</script>
</body>
</html>
