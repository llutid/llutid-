<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LLUTID+ Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Barlow+Condensed:wght@700&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  * {
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }

  html, body {
    width:100%; height:100%; background:#000;
    overflow:hidden; font-family:'Barlow',sans-serif;
  }

  #player-wrap {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }

  video {
    width:100%; height:100%; object-fit:contain;
    display:block; pointer-events:none;
  }

  /* ── OVERLAY gradiente ── */
  #overlay {
    position:absolute; inset:0;
    background:linear-gradient(to bottom,
      rgba(0,0,0,0.65) 0%, transparent 22%,
      transparent 60%, rgba(0,0,0,0.85) 100%);
    opacity:0; transition:opacity 0.3s;
    pointer-events:none; z-index:10;
  }
  #player-wrap.show-ui #overlay { opacity:1; }

  /* ── TOP BAR ── */
  #top-bar {
    position:absolute; top:0; left:0; right:0;
    padding:14px 20px;
    display:flex; align-items:center;
    z-index:20; opacity:0; transform:translateY(-12px);
    transition:opacity 0.3s, transform 0.3s; pointer-events:none;
  }
  #player-wrap.show-ui #top-bar {
    opacity:1; transform:translateY(0); pointer-events:auto;
  }

  #logo {
    display:flex; align-items:center;
    filter:drop-shadow(0 0 10px #0055ffaa);
    cursor:pointer; border-radius:6px;
    padding:4px 8px;
    transition:background 0.2s;
  }
  #logo:hover { background:rgba(0,100,255,0.18); }
  #logo .txt {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(18px,3.5vw,30px); letter-spacing:-0.5px;
    background:linear-gradient(90deg,#1a80ff,#0055dd,#3399ff,#0077ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1;
  }
  #logo .plus {
    font-family:'Barlow',sans-serif; font-weight:900;
    font-size:clamp(14px,2.5vw,22px); color:#ccd6ee;
    -webkit-text-fill-color:#ccd6ee; margin-left:2px; line-height:1;
  }

  /* Movie title in top bar */
  #top-title {
    color:rgba(255,255,255,0.85); font-size:clamp(13px,2vw,16px);
    font-weight:700; margin-left:14px; letter-spacing:0.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:60vw; text-shadow:0 1px 6px rgba(0,0,0,0.7);
  }

  /* ── CENTER PLAY ── */
  #center-play {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:70px; height:70px; border-radius:50%;
    background:rgba(0,80,255,0.16); border:2.5px solid rgba(0,140,255,0.65);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:20; opacity:0;
    transition:opacity 0.3s, transform 0.18s, background 0.2s;
    backdrop-filter:blur(4px);
    box-shadow:0 0 28px #0066ff44, inset 0 0 18px #0066ff18;
  }
  #player-wrap.show-ui #center-play { opacity:1; }
  #center-play:hover { background:rgba(0,100,255,0.3); transform:translate(-50%,-50%) scale(1.12); }
  #center-play svg { width:28px; height:28px; fill:#fff; margin-left:4px; pointer-events:none; }

  /* ── SKIP ZONES ── */
  .skip-zone { position:absolute; top:0; bottom:0; width:35%; z-index:15; cursor:pointer; }
  #skip-left  { left:0; }
  #skip-right { right:0; }

  /* ── BOTTOM CONTROLS ── */
  #controls {
    position:absolute; bottom:0; left:0; right:0;
    padding:10px 18px 14px; z-index:20;
    opacity:0; transform:translateY(12px);
    transition:opacity 0.3s, transform 0.3s; pointer-events:none;
  }
  #player-wrap.show-ui #controls {
    opacity:1; transform:translateY(0); pointer-events:auto;
  }

  /* ── PROGRESS ── */
  #progress-wrap {
    position:relative; height:5px; border-radius:999px;
    background:rgba(255,255,255,0.13); cursor:pointer;
    margin-bottom:10px; transition:height 0.18s; touch-action:none;
  }
  #progress-wrap:hover, #progress-wrap.drag { height:7px; }
  #progress-buf {
    position:absolute; left:0; top:0; bottom:0;
    background:rgba(255,255,255,0.18); border-radius:999px; pointer-events:none;
  }
  #progress-fill {
    position:absolute; left:0; top:0; bottom:0; border-radius:999px; pointer-events:none;
    background:linear-gradient(90deg,
      #0033ff 0%,#0066ff 20%,#0099ff 40%,
      #00bbff 55%,#0099ff 70%,#0066ff 85%,#0044cc 100%);
    background-size:200% 100%;
    animation:blueShift 3s linear infinite;
    box-shadow:0 0 10px #0088ffaa, 0 0 4px #00ccff99;
  }
  @keyframes blueShift { 0%{background-position:0% 0%;} 100%{background-position:200% 0%;} }
  #progress-thumb {
    position:absolute; top:50%; right:-6px;
    width:13px; height:13px; border-radius:50%; background:#fff;
    transform:translateY(-50%) scale(0); box-shadow:0 0 8px #0099ff;
    transition:transform 0.15s; pointer-events:none;
  }
  #progress-wrap:hover #progress-thumb,
  #progress-wrap.drag  #progress-thumb { transform:translateY(-50%) scale(1); }

  #time-tooltip {
    position:absolute; bottom:14px;
    background:rgba(0,0,0,0.8); color:#fff; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:5px; pointer-events:none; opacity:0;
    white-space:nowrap; transform:translateX(-50%);
    border:1px solid rgba(0,120,255,0.35); transition:opacity 0.15s;
  }

  /* ── BUTTONS ROW ── */
  #btn-row { display:flex; align-items:center; gap:3px; }
  .ctrl-btn {
    background:none; border:none; color:#fff;
    width:38px; height:38px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.18s, transform 0.15s; flex-shrink:0;
    touch-action:manipulation;
  }
  .ctrl-btn:hover  { background:rgba(0,120,255,0.22); transform:scale(1.1); }
  .ctrl-btn:active { transform:scale(0.9); }
  .ctrl-btn svg { width:20px; height:20px; fill:#fff; pointer-events:none; }

  #time-display {
    color:rgba(255,255,255,0.82); font-size:12px; font-weight:600;
    letter-spacing:0.3px; margin-left:4px; flex-shrink:0; min-width:90px;
  }
  #spacer { flex:1; }

  #vol-wrap { display:flex; align-items:center; gap:6px; }
  #vol-slider {
    -webkit-appearance:none; width:62px; height:4px;
    border-radius:999px; background:rgba(60,130,255,0.28);
    outline:none; cursor:pointer; flex-shrink:0;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px;
    border-radius:50%; background:#7ab0ff; box-shadow:0 0 5px #0077cc66; cursor:pointer;
  }
  #vol-slider::-moz-range-thumb {
    width:12px; height:12px; border:none; border-radius:50%; background:#7ab0ff;
  }

  #quality-badge {
    background:rgba(0,80,255,0.18); border:1px solid rgba(0,140,255,0.4);
    color:#88bbff; font-size:10px; font-weight:700;
    letter-spacing:1px; padding:3px 7px; border-radius:4px; flex-shrink:0;
  }

  /* ── LOADER ── */
  #loader {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:30; opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  #loader.on { opacity:1; }
  .spinner {
    width:42px; height:42px;
    border:3px solid rgba(255,255,255,0.07);
    border-top-color:#0088ff; border-right-color:#0044cc;
    border-radius:50%; animation:spin 0.7s linear infinite;
    box-shadow:0 0 18px #0066ff55;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── RIPPLE ── */
  .ripple {
    position:absolute; border-radius:50%;
    background:rgba(0,130,255,0.2);
    width:80px; height:80px; margin-left:-40px; margin-top:-40px;
    animation:ripOut 0.55s ease-out forwards;
    pointer-events:none; z-index:14;
  }
  @keyframes ripOut { 0%{transform:scale(0);opacity:1;} 100%{transform:scale(3.5);opacity:0;} }

  /* ── SEEK FLASH ── */
  .seek-flash {
    position:absolute; top:0; bottom:0; width:35%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,rgba(0,100,255,0.15) 0%,transparent 70%);
    pointer-events:none; animation:sfOut 0.45s ease-out forwards; z-index:16;
  }
  .seek-flash.left { left:0; } .seek-flash.right { right:0; }
  @keyframes sfOut { 0%{opacity:1;} 100%{opacity:0;} }
  .seek-flash-inner {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:#fff; font-size:13px; font-weight:700;
    text-shadow:0 0 12px #0088ff; letter-spacing:1px;
  }
  .seek-flash-inner svg { fill:#fff; width:22px; height:22px; }

  /* ── TOAST ── */
  #toast {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.85);
    background:rgba(0,0,0,0.72); border:1px solid rgba(0,140,255,0.45);
    color:#fff; font-size:13px; font-weight:700;
    padding:9px 20px; border-radius:40px; letter-spacing:0.4px;
    opacity:0; pointer-events:none; z-index:40;
    backdrop-filter:blur(8px); box-shadow:0 0 22px #0066ff33;
    transition:opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ── ERROR SCREEN ── */
  #error-screen {
    position:absolute; inset:0; z-index:50;
    display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:#000; color:#fff; text-align:center; padding:30px;
  }
  #error-screen.on { display:flex; }
  #error-screen .err-icon { font-size:48px; }
  #error-screen h2 { font-size:1.4rem; font-weight:700; }
  #error-screen p  { color:rgba(255,255,255,0.55); font-size:0.95rem; max-width:300px; line-height:1.5; }
  #error-screen button {
    margin-top:8px; padding:12px 28px; border-radius:30px;
    background:rgba(0,80,255,0.25); border:1.5px solid rgba(0,140,255,0.5);
    color:#fff; font-size:1rem; font-weight:700; cursor:pointer;
    transition:background 0.2s;
  }
  #error-screen button:hover { background:rgba(0,100,255,0.4); }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:100;
    background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:pointer;
    transition:opacity 0.55s ease, transform 0.55s ease;
  }
  #splash.hide {
    opacity:0; transform:scale(1.03);
    pointer-events:none;
  }

  /* Loading state in splash */
  #splash-loading {
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  #splash-logo {
    display:flex; align-items:center;
    animation:logoIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes logoIn {
    0%   { opacity:0; transform:translateY(-12px); }
    100% { opacity:1; transform:translateY(0); }
  }
  #splash-logo .stxt {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(52px,13vw,96px); letter-spacing:-2px;
    background:linear-gradient(135deg,#1a80ff 0%,#0055dd 40%,#44aaff 80%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  #splash-logo .splus {
    font-family:'Barlow',sans-serif; font-weight:900;
    font-size:clamp(36px,9vw,68px); color:#c8d4ee;
    -webkit-text-fill-color:#c8d4ee; margin-left:4px;
  }

  #splash-spinner {
    width:36px; height:36px;
    border:3px solid rgba(255,255,255,0.08);
    border-top-color:#0088ff; border-right-color:#0044cc;
    border-radius:50%; animation:spin 0.7s linear infinite;
    opacity:0.7;
  }
  #splash-status {
    color:rgba(255,255,255,0.4); font-size:13px; font-weight:600;
    letter-spacing:2px; text-transform:uppercase;
    animation:logoIn 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Ready state: show play button */
  #splash-ready {
    display:none; flex-direction:column; align-items:center; gap:0;
  }
  #splash.ready #splash-loading { display:none; }
  #splash.ready #splash-ready   { display:flex; }

  #splash-ready-logo { display:flex; align-items:center; margin-bottom:44px; }
  #splash-ready-logo .stxt {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(52px,13vw,96px); letter-spacing:-2px;
    background:linear-gradient(135deg,#1a80ff 0%,#0055dd 40%,#44aaff 80%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  #splash-ready-logo .splus {
    font-family:'Barlow',sans-serif; font-weight:900;
    font-size:clamp(36px,9vw,68px); color:#c8d4ee;
    -webkit-text-fill-color:#c8d4ee; margin-left:4px;
  }

  #splash-movie-title {
    color:rgba(255,255,255,0.75); font-size:clamp(14px,3vw,20px);
    font-weight:700; letter-spacing:0.3px;
    max-width:80vw; text-align:center;
    margin-bottom:32px; margin-top:-20px;
    text-shadow:0 1px 10px rgba(0,80,255,0.3);
    animation:logoIn 0.6s 0.1s both;
  }

  #splash-play-btn {
    width:72px; height:72px; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 32px rgba(0,0,0,0.55);
    transition:transform 0.15s, box-shadow 0.15s;
    animation:btnIn 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes btnIn {
    0%   { opacity:0; transform:scale(0.8); }
    100% { opacity:1; transform:scale(1); }
  }
  #splash-play-btn:hover { transform:scale(1.09); box-shadow:0 8px 40px rgba(0,0,0,0.7); }
  #splash-play-btn svg { width:30px; height:30px; fill:#08082a; margin-left:4px; }

  #splash-label {
    margin-top:18px; color:rgba(255,255,255,0.38);
    font-size:clamp(10px,1.8vw,13px);
    font-weight:600; letter-spacing:3px; text-transform:uppercase;
    animation:btnIn 0.7s 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }
</style>
</head>
<body>

<div id="player-wrap">

  <!-- SPLASH -->
  <div id="splash">
    <!-- Loading state -->
    <div id="splash-loading">
      <div id="splash-logo">
        <span class="stxt">LLUTID</span>
        <span class="splus">+</span>
      </div>
      <div id="splash-spinner"></div>
      <div id="splash-status">Cargando…</div>
    </div>
    <!-- Ready state (shown after data loaded) -->
    <div id="splash-ready">
      <div id="splash-ready-logo">
        <span class="stxt">LLUTID</span>
        <span class="splus">+</span>
      </div>
      <div id="splash-movie-title"></div>
      <div id="splash-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div id="splash-label">Reproducir</div>
    </div>
  </div>

  <!-- VIDEO (src se asigna dinámicamente) -->
  <video id="vid" preload="auto" playsinline></video>

  <div id="overlay"></div>
  <div id="loader"><div class="spinner"></div></div>

  <!-- ERROR SCREEN -->
  <div id="error-screen">
    <div class="err-icon">⚠️</div>
    <h2 id="err-title">Error</h2>
    <p  id="err-msg">No se pudo cargar el contenido.</p>
    <button onclick="history.back()">← Volver</button>
  </div>

  <!-- TOP BAR -->
  <div id="top-bar">
    <div id="logo" role="button" tabindex="0" title="Volver">
      <span class="txt">LLUTID</span>
      <span class="plus">+</span>
    </div>
    <span id="top-title"></span>
  </div>

  <!-- CENTER PLAY -->
  <div id="center-play">
    <svg viewBox="0 0 24 24"><path id="center-icon" d="M8 5v14l11-7z"/></svg>
  </div>

  <!-- SKIP ZONES -->
  <div class="skip-zone" id="skip-left"></div>
  <div class="skip-zone" id="skip-right"></div>

  <!-- BOTTOM CONTROLS -->
  <div id="controls">
    <div id="progress-wrap">
      <div id="progress-buf"></div>
      <div id="progress-fill"><div id="progress-thumb"></div></div>
      <div id="time-tooltip">0:00</div>
    </div>
    <div id="btn-row">
      <button class="ctrl-btn" id="btn-play">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-rew">
        <svg viewBox="0 0 24 24">
          <path d="M12.5 3a9 9 0 1 0 6.37 2.63L17.5 7A7 7 0 1 1 12.5 5V3z"/>
          <text x="7.8" y="15.5" font-size="5.5" fill="white" font-family="Barlow,sans-serif" font-weight="700">10</text>
        </svg>
      </button>
      <button class="ctrl-btn" id="btn-fwd">
        <svg viewBox="0 0 24 24">
          <path d="M11.5 3a9 9 0 1 1-6.37 2.63L6.5 7A7 7 0 1 0 11.5 5V3z"/>
          <text x="7.8" y="15.5" font-size="5.5" fill="white" font-family="Barlow,sans-serif" font-weight="700">10</text>
        </svg>
      </button>
      <span id="time-display">0:00 / 0:00</span>
      <div id="spacer"></div>
      <div id="vol-wrap">
        <button class="ctrl-btn" id="btn-mute">
          <svg viewBox="0 0 24 24"><path id="vol-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input type="range" id="vol-slider" min="0" max="1" step="0.02" value="1">
      </div>
      <span id="quality-badge">HD</span>
      <button class="ctrl-btn" id="btn-fs" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path id="fs-icon" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>
</div>

/* ══ SVG paths ══ */
const P_PLAY  = "M8 5v14l11-7z";
const P_PAUSE = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
const P_VOL   = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z";
const P_MUTE  = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";
const FS_ENTER = "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z";
const FS_EXIT  = "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z";

/* ══ Helpers ══ */
['contextmenu','selectstart','dragstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false })
);

function fmt(s) {
  if (!s || isNaN(s) || !isFinite(s)) return '0:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return h ? `${h}:${m.toString().padStart(2,'0')}:${sec}` : `${m}:${sec}`;
}
function showToast(msg, dur=1300) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), dur);
}
function showError(title, msg) {
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent   = msg;
  splash.style.display   = 'none';
  errorScreen.classList.add('on');
}

/* Convierte archive.org/details → direct MP4 */
function toDirectMp4(url) {
  if (!url) return '';
  if (url.includes('archive.org/details/')) {
    const id = url.split('/details/')[1].split('/')[0].split('?')[0];
    return `https://archive.org/download/${id}/${id}.mp4`;
  }
  return url;
}

/* ══ Fullscreen + orientación ══ */
function lockLandscape() {
  try {
    if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
    if (screen.lockOrientation)    screen.lockOrientation('landscape');
  } catch(e) {}
}
function isFS() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
}
function enterFS() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) return req.call(el).then(lockLandscape).catch(lockLandscape);
  lockLandscape(); return Promise.resolve();
}
function exitFS() {
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if (ex) ex.call(document).catch(()=>{});
}
function onFSChange() {
  fsIcon.setAttribute('d', isFS() ? FS_EXIT : FS_ENTER);
  if (isFS()) lockLandscape();
}
document.addEventListener('fullscreenchange',       onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
document.addEventListener('mozfullscreenchange',    onFSChange);

/* ══ Auto-hide UI ══ */
let uiTimer = null;
function showUI(ms=3200) {
  wrap.classList.add('show-ui'); clearTimeout(uiTimer);
  if (!vid.paused) uiTimer = setTimeout(() => wrap.classList.remove('show-ui'), ms);
}
wrap.addEventListener('pointermove', () => showUI(), { passive:true });
wrap.addEventListener('pointerdown', () => showUI(), { passive:true });
vid.addEventListener('pause', () => { clearTimeout(uiTimer); wrap.classList.add('show-ui'); });
vid.addEventListener('play',  () => showUI());

/* ══ Play / Pause ══ */
let playBusy = false;
function syncIcons() {
  const d = vid.paused ? P_PLAY : P_PAUSE;
  playIcon.setAttribute('d', d); centerIcon.setAttribute('d', d);
}
async function togglePlay() {
  if (playBusy) return; playBusy = true;
  try { vid.paused ? await vid.play() : vid.pause(); }
  catch(e){} finally { playBusy = false; }
}
vid.addEventListener('play',  syncIcons);
vid.addEventListener('pause', syncIcons);
centerPlay.addEventListener('pointerup', e => { e.stopPropagation(); togglePlay(); showUI(); });
btnPlay.addEventListener('pointerup',    e => { e.stopPropagation(); togglePlay(); showUI(); });

/* ══ Progress bar ══ */
let isDragging = false;
function getPct(cx) {
  const r = progressWrap.getBoundingClientRect();
  return Math.max(0, Math.min(1, (cx - r.left) / r.width));
}
function applySeek(pct) {
  if (vid.duration && isFinite(vid.duration)) vid.currentTime = pct * vid.duration;
}
progressWrap.addEventListener('pointerdown', e => {
  e.preventDefault(); isDragging = true;
  progressWrap.classList.add('drag');
  progressWrap.setPointerCapture(e.pointerId);
  applySeek(getPct(e.clientX)); showUI(6000);
});
progressWrap.addEventListener('pointermove', e => {
  if (!vid.duration) return;
  const pct = getPct(e.clientX);
  if (isDragging) applySeek(pct);
  const r = progressWrap.getBoundingClientRect();
  timeTooltip.style.left = (e.clientX - r.left) + 'px';
  timeTooltip.textContent = fmt(pct * vid.duration);
  timeTooltip.style.opacity = '1';
});
progressWrap.addEventListener('pointerup', e => {
  isDragging = false; progressWrap.classList.remove('drag'); applySeek(getPct(e.clientX));
});
progressWrap.addEventListener('pointerleave', () => { if (!isDragging) timeTooltip.style.opacity = '0'; });
vid.addEventListener('timeupdate', () => {
  if (!vid.duration || isDragging) return;
  progressFill.style.width = ((vid.currentTime/vid.duration)*100) + '%';
  timeDisplay.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
});
vid.addEventListener('progress', () => {
  if (!vid.duration || !vid.buffered.length) return;
  progressBuf.style.width = ((vid.buffered.end(vid.buffered.length-1)/vid.duration)*100) + '%';
});

/* ══ Seek ±10s ══ */
btnRew.addEventListener('pointerup', e => { e.stopPropagation(); vid.currentTime=Math.max(0,vid.currentTime-10); showToast('⏪ -10s'); showUI(); });
btnFwd.addEventListener('pointerup', e => { e.stopPropagation(); vid.currentTime=Math.min(vid.duration||0,vid.currentTime+10); showToast('⏩ +10s'); showUI(); });

/* ══ Volumen ══ */
function syncVolIcon() { volIcon.setAttribute('d', (vid.muted||vid.volume===0) ? P_MUTE : P_VOL); }
volSlider.addEventListener('input', () => { vid.volume=parseFloat(volSlider.value); vid.muted=vid.volume===0; syncVolIcon(); });
btnMute.addEventListener('pointerup', e => { e.stopPropagation(); vid.muted=!vid.muted; syncVolIcon(); });

/* ══ Doble toque skip ══ */
const tapTimers = { left:null, right:null };
function zoneTap(side, e) {
  e.preventDefault();
  const cx = e.clientX ?? e.changedTouches?.[0]?.clientX ?? 0;
  const cy = e.clientY ?? e.changedTouches?.[0]?.clientY ?? 0;
  addRipple(cx, cy, e.currentTarget);
  if (tapTimers[side]) {
    clearTimeout(tapTimers[side]); tapTimers[side]=null;
    if (side==='left') { vid.currentTime=Math.max(0,vid.currentTime-10); flashSeek('left'); }
    else               { vid.currentTime=Math.min(vid.duration||0,vid.currentTime+10); flashSeek('right'); }
  } else {
    tapTimers[side] = setTimeout(() => { tapTimers[side]=null; togglePlay(); }, 240);
  }
  showUI();
}
document.getElementById('skip-left').addEventListener('pointerup',  e => zoneTap('left',  e));
document.getElementById('skip-right').addEventListener('pointerup', e => zoneTap('right', e));

function flashSeek(side) {
  const el = document.createElement('div');
  el.className = `seek-flash ${side}`;
  const arrow = side==='left' ? '<path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>' : '<path d="M18 6h-2v12h2zm-3.5 6L6 6v12z"/>';
  el.innerHTML = `<div class="seek-flash-inner"><svg viewBox="0 0 24 24">${arrow}</svg>${side==='left'?'-10s':'+10s'}</div>`;
  wrap.appendChild(el); setTimeout(() => el.remove(), 500);
}
function addRipple(x, y, parent) {
  const r = document.createElement('div'); r.className = 'ripple';
  const rect = parent.getBoundingClientRect();
  r.style.left = (x-rect.left)+'px'; r.style.top = (y-rect.top)+'px';
  parent.appendChild(r); setTimeout(() => r.remove(), 650);
}

/* ══ Loader ══ */
vid.addEventListener('waiting', () => loader.classList.add('on'));
vid.addEventListener('playing', () => loader.classList.remove('on'));
vid.addEventListener('canplay', () => loader.classList.remove('on'));

/* ══ Teclado ══ */
document.addEventListener('keydown', e => {
  if (e.code==='Space')      { e.preventDefault(); togglePlay(); }
  if (e.code==='ArrowLeft')  { e.preventDefault(); vid.currentTime=Math.max(0,vid.currentTime-10); showToast('⏪ -10s'); showUI(); }
  if (e.code==='ArrowRight') { e.preventDefault(); vid.currentTime=Math.min(vid.duration||0,vid.currentTime+10); showToast('⏩ +10s'); showUI(); }
  if (e.code==='KeyM')       { vid.muted=!vid.muted; syncVolIcon(); }
  if (e.code==='KeyF')       { isFS() ? exitFS() : enterFS(); }
});

/* ══ Fullscreen button ══ */
btnFs.addEventListener('pointerup', e => { e.stopPropagation(); isFS() ? exitFS() : enterFS(); });

/* ══ Volver atrás ══ */
history.pushState({ player:true }, '');
window.addEventListener('popstate', goBack);
function goBack() {
  exitFS();
  setTimeout(() => { if (history.length > 1) history.back(); else window.close(); }, 180);
}
btnBack.addEventListener('pointerup', e => { e.stopPropagation(); goBack(); });

/* ══════════════════════════════════════════
   FIREBASE LOAD + SPLASH LOGIC
   ══════════════════════════════════════════ */
const params   = new URLSearchParams(location.search);
const movieId  = params.get('id');
/* autoplay=1 means: opened from info page — fullscreen immediately on splash click */
const autoplay = params.get('autoplay') === '1';

vid.pause();

async function loadAndInit() {
  if (!movieId) {
    showError('Sin película', 'No se especificó un ID de película en la URL.');
    return;
  }

  splashStatus.textContent = 'Cargando…';

  let movieData;
  try {
    const snap = await getDoc(doc(db, 'movies', movieId));
    if (!snap.exists()) { showError('No encontrado', 'La película no existe en la base de datos.'); return; }
    movieData = { id: snap.id, ...snap.data() };
  } catch(e) {
    showError('Error de conexión', 'Verifica tu conexión e intenta de nuevo.');
    return;
  }

  /* Resolve video URL */
  const rawUrl = movieData.movieUrl || movieData.movie_url || movieData.url || '';
  if (!rawUrl) {
    showError('Sin URL', 'Esta película no tiene URL de video configurada.');
    return;
  }
  const videoUrl = toDirectMp4(rawUrl);

  /* Show movie title in top bar */
  if (movieData.title) topTitle.textContent = movieData.title;

  /* Preload video src */
  vid.src = videoUrl;
  vid.load();

  /* Transition splash to "ready" state */
  splashMovieTitle.textContent = movieData.title || '';
  splash.classList.add('ready');

  /* ── Splash click: fullscreen → play ── */
  function onSplashClick() {
    enterFS().finally(() => {
      splash.classList.add('hide');
      setTimeout(() => { if (splash.parentNode) splash.remove(); }, 650);
      vid.play().catch(()=>{});
      showUI(3200);
    });
  }

  splash.addEventListener('pointerup', onSplashClick, { once:true });
}

loadAndInit();
</script>
