<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anderson & Veronica 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital@1&family=Josefin+Sans:wght@100;300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f5c842;
    --gold-light: #fde97a;
    --gold-dim: #c49a10;
    --dark: #07060e;
    --text: #f0e6c0;
    --text-dim: #9e8c5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--dark);
    color: var(--text);
    font-family: 'Josefin Sans', sans-serif;
    overflow-x: hidden;
  }

  /* STARFIELD */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:.1; transform:scale(1); }
    50%     { opacity:.9; transform:scale(1.5); }
  }

  /* ORB GLOWS */
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(70px);
    animation: orbPulse var(--d) ease-in-out infinite;
  }
  @keyframes orbPulse {
    0%,100% { opacity:.12; transform:scale(1); }
    50%     { opacity:.22; transform:scale(1.25); }
  }

  /* PETAL RAIN */
  .petal {
    position: fixed; top: -80px; font-size: var(--s);
    animation: fall var(--d) linear infinite; opacity: 0;
    z-index: 1; pointer-events: none;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  @keyframes fall {
    0%   { transform:translateX(0) rotate(0deg); opacity:0; top:-80px; }
    8%   { opacity:1; }
    92%  { opacity:.8; }
    100% { transform:translateX(var(--dx)) rotate(700deg); opacity:0; top:108vh; }
  }

  /* BG FLOWERS */
  .flower-bg {
    position: fixed; font-size: var(--fs); opacity:.05; pointer-events: none;
    z-index: 0; filter:blur(1.5px);
    animation: floatBg var(--d) ease-in-out infinite;
  }
  @keyframes floatBg {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-25px) rotate(15deg); }
  }

  /* PULSE RINGS */
  #rings { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:0; }
  .ring {
    position:absolute; border-radius:50%;
    border:1px solid rgba(245,200,66,.07);
    width:200px; height:200px;
    animation: expand 3.5s ease-out infinite;
  }
  .ring:nth-child(2){ animation-delay:1.2s; }
  .ring:nth-child(3){ animation-delay:2.4s; }
  @keyframes expand {
    0%   { transform:scale(.4); opacity:.6; }
    100% { transform:scale(5);  opacity:0; }
  }

  /* PAGE */
  .page {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 18px 56px;
  }

  /* CROWN */
  .crown {
    font-size: clamp(1.5rem, 7vw, 2.4rem);
    letter-spacing: 5px;
    filter: drop-shadow(0 0 10px var(--gold));
    animation: floatY 3.2s ease-in-out infinite;
    margin-bottom: 14px;
  }
  @keyframes floatY {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-7px); }
  }

  /* NAMES */
  .names {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; line-height: 1.05;
    text-align: center;
    animation: fadeUp 1.4s ease both;
  }
  .name {
    display: block;
    font-size: clamp(3rem, 16vw, 6rem);
    color: var(--gold-light);
    text-shadow: 0 0 28px rgba(245,200,66,.55), 0 0 70px rgba(245,200,66,.2);
  }
  .and-text {
    display: block;
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(.8rem, 4vw, 1.1rem);
    color: var(--gold-dim); letter-spacing: 8px;
    margin: 2px 0;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(28px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* DIVIDER */
  .divider {
    display:flex; align-items:center; gap:10px;
    margin: 16px 0;
    animation: fadeUp 1.4s .2s ease both;
  }
  .divider-line { height:1px; width:clamp(36px,12vw,80px); background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .divider-icon { font-size:1rem; filter:drop-shadow(0 0 6px var(--gold)); }

  /* SUBTITLE */
  .subtitle {
    font-weight:100; font-size:clamp(.55rem,3vw,.75rem);
    letter-spacing:5px; text-transform:uppercase; color:var(--text-dim);
    margin-bottom: 26px;
    animation: fadeUp 1.4s .35s ease both;
  }

  /* CARD */
  .card {
    width: 100%; max-width: 400px;
    background: linear-gradient(135deg,rgba(245,200,66,.05),rgba(245,200,66,.01));
    border: 1px solid rgba(245,200,66,.18);
    border-radius: 4px;
    padding: clamp(22px,5vw,40px) clamp(14px,4vw,32px);
    position: relative;
    animation: fadeUp 1.4s .6s ease both;
  }
  .card::before, .card::after,
  .c2::before, .c2::after {
    content:''; position:absolute;
    width:13px; height:13px;
    border-color:var(--gold); border-style:solid; opacity:.4;
  }
  .card::before { top:7px;   left:7px;   border-width:1px 0 0 1px; }
  .card::after  { top:7px;   right:7px;  border-width:1px 1px 0 0; }
  .c2::before   { bottom:7px;left:7px;   border-width:0 0 1px 1px; }
  .c2::after    { bottom:7px;right:7px;  border-width:0 1px 1px 0; }

  .card-label {
    font-size:clamp(.5rem,2.5vw,.65rem);
    letter-spacing:5px; text-transform:uppercase; color:var(--text-dim);
    text-align:center; margin-bottom:20px;
  }

  /* TIMER GRID */
  .timer {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
    align-items: end;
    justify-items: center;
    column-gap: clamp(2px, 1.5vw, 8px);
  }

  .unit { display:flex; flex-direction:column; align-items:center; width:100%; }

  .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 12vw, 5rem);
    font-weight: 300; line-height: 1;
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(245,200,66,.5), 0 0 45px rgba(245,200,66,.2);
    min-width: 2ch; text-align:center;
  }
  .num.bump { animation: bump .35s ease; }
  @keyframes bump {
    0%  { transform:scale(1); }
    45% { transform:scale(1.2); color:#fff; text-shadow:0 0 25px #fff,0 0 55px var(--gold); }
    100%{ transform:scale(1); }
  }

  .unit-label {
    font-size: clamp(.42rem,2vw,.56rem);
    letter-spacing: 3px; text-transform:uppercase; color:var(--text-dim);
    margin-top:5px;
  }

  .sep {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(1.8rem,8vw,3.8rem);
    color:var(--gold-dim); opacity:.4;
    padding-bottom:14px; line-height:1;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100%{ opacity:.4; }
    50%    { opacity:.1; }
  }

  /* SINCE */
  .since {
    text-align:center; margin-top:18px;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(.7rem,3vw,.88rem); color:var(--text-dim);
  }
  .since span { color:var(--gold); }

  /* POEM */
  .poem {
    margin-top: 28px;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(.9rem,4vw,1.1rem);
    color:var(--text-dim); line-height:2; text-align:center;
    animation: fadeUp 1.4s 1s ease both;
  }
  .poem strong { color:var(--gold); font-style:normal; font-weight:400; }

  /* BOTTOM */
  .bottom {
    margin-top:24px; font-size:clamp(1.3rem,5vw,1.8rem);
    letter-spacing:7px;
    filter:drop-shadow(0 0 10px var(--gold));
    animation:floatY 4s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="stars"></div>
<div class="orb" style="width:320px;height:320px;background:var(--gold);top:-110px;left:-110px;--d:6s;"></div>
<div class="orb" style="width:260px;height:260px;background:#d48a00;bottom:-80px;right:-80px;--d:9s;animation-delay:1s;"></div>
<div id="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
<div id="petals"></div>
<div id="bgf"></div>

<div class="page">

  <div class="crown">🌻 🌼 🌻</div>

  <div class="names">
    <span class="name">Anderson</span>
    <span class="and-text">&amp;</span>
    <span class="name">Veronica</span>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-icon">💛</span>
    <div class="divider-line"></div>
  </div>

  <p class="subtitle">Desde el primer instante</p>

  <div class="card">
    <div class="c2"></div>
    <p class="card-label">Nuestra Historia Inicio Hace</p>

    <div class="timer">
      <div class="unit">
        <span class="num" id="days">00</span>
        <span class="unit-label">días</span>
      </div>
      <div class="sep">·</div>
      <div class="unit">
        <span class="num" id="hours">00</span>
        <span class="unit-label">horas</span>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <span class="num" id="minutes">00</span>
        <span class="unit-label">min</span>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <span class="num" id="seconds">00</span>
        <span class="unit-label">seg</span>
      </div>
    </div>

    <p class="since">Desde el <span id="startDate"></span> a las <span>5:00 PM</span></p>
  </div>

  <p class="poem">
    Cada segundo contigo<br>
    es un universo que <strong>florece</strong>,<br>
    y mi corazón, Veronica,<br>
    solo en ti <strong>pertenece</strong>.
  </p>

  <div class="bottom">🌻🌼🌻🌼🌻</div>

</div>

<script>
  const n = new Date();
  const START = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 17, 0, 0);
  const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('startDate').textContent =
    `${DAYS[START.getDay()]} ${START.getDate()} de ${MONTHS[START.getMonth()]}`;

  const prev = {};
  function pad(v){ return String(Math.max(0,v)).padStart(2,'0'); }
  function tick(){
    const total = Math.floor(Math.max(0, Date.now() - START.getTime()) / 1000);
    const vals = { days: Math.floor(total/86400), hours: Math.floor((total%86400)/3600), minutes: Math.floor((total%3600)/60), seconds: total%60 };
    for(const [id,val] of Object.entries(vals)){
      const str = pad(val), el = document.getElementById(id);
      if(prev[id] !== str){
        el.textContent = str;
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
        prev[id] = str;
      }
    }
  }
  tick(); setInterval(tick, 1000);

  // Stars
  const sf = document.getElementById('stars');
  for(let i=0;i<140;i++){
    const s = document.createElement('div'); s.className='star';
    const sz = Math.random()*2+.4;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    sf.appendChild(s);
  }

  // Petals
  const pe = document.getElementById('petals');
  const PEM = ['🌸','🌼','✨','💛','🌻','⭐','🌟'];
  for(let i=0;i<24;i++){
    const p = document.createElement('div'); p.className='petal';
    p.textContent = PEM[Math.floor(Math.random()*PEM.length)];
    const dur = 7+Math.random()*9, dx=(Math.random()-.5)*160;
    p.style.cssText=`left:${Math.random()*100}%;--s:${.9+Math.random()*1.2}rem;--d:${dur}s;--dx:${dx}px;animation-delay:${Math.random()*dur}s;`;
    pe.appendChild(p);
  }

  // BG flowers
  const bg = document.getElementById('bgf');
  const BFE=['🌻','🌼','🌸','💐'];
  for(let i=0;i<10;i++){
    const f=document.createElement('div'); f.className='flower-bg';
    f.textContent=BFE[Math.floor(Math.random()*BFE.length)];
    f.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--fs:${2+Math.random()*4}rem;--d:${6+Math.random()*7}s;animation-delay:${Math.random()*6}s;`;
    bg.appendChild(f);
  }
</script>
</body>
</html>
