<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llutid+ | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #4169E1; --dark: #0a0a0a; --card: #161618; --border: #2d2d2f; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 1100px; margin: auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .logo { font-family: 'Montserrat'; color: var(--blue); font-size: 1.8rem; }
        .logo span { color: #fff; }

        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr 2fr; 
            gap: 30px; 
        }

        .card-form { 
            background: var(--card); 
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid var(--border);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        h3 { margin-top: 0; color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #000; 
            border: 1px solid var(--border); 
            color: #fff; 
            border-radius: 8px; 
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        textarea { height: 100px; resize: none; }
        input:focus, textarea:focus { border-color: var(--blue); outline: none; }

        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .btn-save { background: var(--blue); color: white; }
        .btn-cancel { background: #333; color: white; margin-top: 10px; display: none; }

        .list-container { 
            background: var(--card); 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #1f1f21; padding: 15px; text-align: left; font-size: 0.75rem; color: #666; }
        td { padding: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }

        .img-preview { width: 45px; height: 65px; object-fit: cover; border-radius: 6px; background: #222; }
        
        .actions { display: flex; gap: 8px; }
        .btn-action { width: auto; padding: 8px 12px; font-size: 0.75rem; }
        .edit { background: #ffbb33; color: #000; }
        .delete { background: #ff4444; color: #fff; }

        @media (max-width: 850px) {
            .main-grid { grid-template-columns: 1fr; }
            .card-form { position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Llutid<span>+</span> Panel</div>
            <div style="font-size: 0.8rem; color: #4169E1;">Dashboard de Estrenos</div>
        </header>

        <div class="main-grid">
            <div class="card-form">
                <h3 id="form-title">Nuevo Estreno</h3>
                <form id="adminForm">
                    <input type="hidden" id="edit-id">
                    
                    <input type="text" id="titulo" placeholder="Título" required>
                    <textarea id="descripcion" placeholder="Descripción para WhatsApp" required></textarea>
                    
                    <div style="display: flex; gap: 10px;">
                        <input type="date" id="fecha" required>
                        <input type="time" id="hora" required>
                    </div>

                    <input type="url" id="imagen" placeholder="URL Imagen (Póster)" required>
                    <input type="url" id="trailer" placeholder="URL Vimeo (Tráiler)">

                    <button type="submit" class="btn-save" id="btn-submit">PUBLICAR</button>
                    <button type="button" id="btn-cancel" class="btn-cancel">CANCELAR</button>
                </form>
            </div>

            <div class="list-container">
                <table>
                    <thead>
                        <tr>
                            <th>PORTADA</th>
                            <th>TÍTULO Y FECHA</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOfpuhunnzCA_NNwJyQJVkSE2SzQbxSYs",
            databaseURL: "https://proximos-d8810-default-rtdb.firebaseio.com",
            projectId: "proximos-d8810",
            appId: "1:216950431757:web:4afa59b1e7daca264f7544"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const form = document.getElementById('adminForm');
        
        // Almacén local para evitar errores de comillas al editar
        let cacheEstrenos = {};

        // Cargar Datos
        onValue(ref(db, 'proximos'), (snapshot) => {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';
            cacheEstrenos = snapshot.val() || {};
            
            Object.keys(cacheEstrenos).reverse().forEach((key) => {
                const p = cacheEstrenos[key];
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.imagen}" class="img-preview"></td>
                        <td>
                            <strong>${p.titulo}</strong><br>
                            <small style="color: #666;">${p.fecha} ${p.hora}</small>
                        </td>
                        <td>
                            <div class="actions">
                                <button class="btn-action edit" onclick="prepararEdicion('${key}')">Editar</button>
                                <button class="btn-action delete" onclick="eliminar('${key}')">Borrar</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        });

        // Guardar/Actualizar
        form.onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                titulo: document.getElementById('titulo').value,
                descripcion: document.getElementById('descripcion').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value,
                imagen: document.getElementById('imagen').value,
                link: document.getElementById('trailer').value || ""
            };

            if (id) {
                update(ref(db, `proximos/${id}`), data).then(() => { 
                    alert("Actualizado"); 
                    resetForm(); 
                });
            } else {
                push(ref(db, 'proximos'), data).then(() => { 
                    alert("Publicado"); 
                    form.reset(); 
                });
            }
        };

        // Borrar
        window.eliminar = (id) => {
            if (confirm("¿Eliminar este lanzamiento?")) remove(ref(db, `proximos/${id}`));
        };

        // Editar (Busca por ID en cacheEstrenos)
        window.prepararEdicion = (id) => {
            const p = cacheEstrenos[id];
            if(!p) return;

            document.getElementById('edit-id').value = id;
            document.getElementById('titulo').value = p.titulo;
            document.getElementById('fecha').value = p.fecha;
            document.getElementById('hora').value = p.hora;
            document.getElementById('imagen').value = p.imagen;
            document.getElementById('trailer').value = p.link || "";
            document.getElementById('descripcion').value = p.descripcion;

            document.getElementById('form-title').innerText = "Editando película";
            document.getElementById('btn-submit').innerText = "GUARDAR CAMBIOS";
            document.getElementById('btn-cancel').style.display = "block";
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        const resetForm = () => {
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = "Nuevo Estreno";
            document.getElementById('btn-submit').innerText = "PUBLICAR";
            document.getElementById('btn-cancel').style.display = "none";
        };

        document.getElementById('btn-cancel').onclick = resetForm;
    </script>
</body>
</html>
