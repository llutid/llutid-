    <style>

        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}

        /* ══════════════════════════════════════
           NUEVA INTRO — CANVAS SHOCKWAVE
        ══════════════════════════════════════ */
        #intro-overlay {
            position: fixed; inset: 0;
            z-index: 75;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        #intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Canvas cubre todo el overlay */
        #cv {
            position: absolute; inset: 0;
            z-index: 2; pointer-events: none;
        }

        /* Wordmark del intro */
        #intro-wordmark {
            position: relative; z-index: 3;
            font-family: 'Barlow', 'Arial Black', sans-serif;
            font-weight: 900;
            font-size: clamp(3rem, 11vw, 6rem);
            color: #007bff;
            letter-spacing: 0.05em;
            line-height: 1;
            clip-path: circle(0% at 50% 50%);
            /* Desplaza el texto a la izquierda ~30% del tamaño del + para que
               el conjunto LLUTID + (canvas) quede visualmente centrado */
            transform: translateX(calc(-1 * clamp(1rem, 3vw, 1.8rem)));
        }

        /* Tagline letra a letra */
        #intro-tag {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 0.12em;
            pointer-events: none;
        }
        #intro-tag span {
            font-family: 'Barlow', sans-serif;
            font-weight: 900;

        .popup-container.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
        .success-popup{background:rgba(0,160,80,0.95);}

        .sr-only{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;}
        #successPopupMessageText{display:block;margin-top:8px;font-weight:800;}

<script>
/* ══════════════════════════════════════════════
   NUEVA INTRO — SHOCKWAVE + FIRMA DEL +
══════════════════════════════════════════════ */
(function() {
    const overlay  = document.getElementById('intro-overlay');
    const cv       = document.getElementById('cv');
    const ctx      = cv.getContext('2d');
    const wordmark = document.getElementById('intro-wordmark');
    const tagEl    = document.getElementById('intro-tag');

    /* Tagline build */
    const TAGLINE = 'Entretenimiento sin límites';
    TAGLINE.split('').forEach(ch => {
        const s = document.createElement('span');
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        tagEl.appendChild(s);
    });

    let W, H, icx, icy, maxR;
    function resize() {
        W = cv.width  = window.innerWidth;
        H = cv.height = window.innerHeight;
        icx = W/2; icy = H/2;
        maxR = Math.sqrt(icx*icx + icy*icy) * 1.1;
        const rect = wordmark.getBoundingClientRect();
        if (rect.bottom) tagEl.style.top = (rect.bottom + 18) + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    const easeOut   = t => 1 - Math.pow(1-t, 3);
    const easeInOut = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

    /* Particles */
    const particles = [];
    function spawnParticles(x, y) {
        for (let i = 0; i < 26; i++) {
            const angle  = Math.random() * Math.PI * 2;
            const speed  = 0.6 + Math.random() * 2.8;
            const isBlue = Math.random() > 0.42;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                size: 1 + Math.random() * 2.2,
                color: isBlue ? '0,123,255' : '255,255,255',
                decay: 0.018 + Math.random() * 0.022
            });
        }
    }

    /* State */
    let startTime    = null;
    const DELAY      = 650;
    const WAVE_DUR   = 1050;
    const waves = [
        { delay:0,   alpha:0.85, width:2,  color:'255,255,255' },
        { delay:55,  alpha:0.30, width:7,  color:'0,123,255'   },
        { delay:130, alpha:0.12, width:16, color:'0,80,200'    },
    ];

    let wordRevealed  = false;
    let plusPhase     = 0;
    let plusHProgress = 0;
    let plusVProgress = 0;
    let glowAlpha     = 0;
    let glowDir       = 1;
    let glowStarted   = false;
    let tagStarted    = false;
    let wordGlow      = 0;
    let lastTs        = 0;

    function getPlusGeo() {
        const rect = wordmark.getBoundingClientRect();
        const size = rect.height * 0.52;
        const half = size / 2;
        return {
            cx: rect.right + half + rect.width * 0.015,
            cy: rect.top + rect.height * 0.5,
            half
        };
    }

    function drawPlus(dt) {
        const p = getPlusGeo();
        const SPEED = 0.0028;
        ctx.lineCap     = 'round';
        ctx.lineWidth   = Math.max(3.5, p.half * 0.38);
        ctx.strokeStyle = '#ffffff';

        if (plusPhase === 1) {
            plusHProgress = Math.min(1, plusHProgress + dt * SPEED);
            ctx.beginPath();
            ctx.moveTo(p.cx - p.half, p.cy);
            ctx.lineTo(p.cx - p.half + p.half * 2 * easeInOut(plusHProgress), p.cy);
            ctx.stroke();
            if (plusHProgress >= 1) plusPhase = 2;
        }

        if (plusPhase >= 2) {
            ctx.beginPath();
            ctx.moveTo(p.cx - p.half, p.cy);
            ctx.lineTo(p.cx + p.half,  p.cy);
            ctx.stroke();
        }

        if (plusPhase === 2) {
            plusVProgress = Math.min(1, plusVProgress + dt * SPEED);
            ctx.beginPath();
            ctx.moveTo(p.cx, p.cy - p.half);
            ctx.lineTo(p.cx, p.cy - p.half + p.half * 2 * easeInOut(plusVProgress));
            ctx.stroke();
            if (plusVProgress >= 1) {
                plusPhase = 3;
                spawnParticles(p.cx, p.cy);
                glowStarted = true;
            }
        }

        if (plusPhase === 3) {
            ctx.beginPath();
            ctx.moveTo(p.cx - p.half, p.cy);
            ctx.lineTo(p.cx + p.half,  p.cy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(p.cx, p.cy - p.half);
            ctx.lineTo(p.cx, p.cy + p.half);
            ctx.stroke();
            if (glowStarted) {
                const g = ctx.createRadialGradient(p.cx, p.cy, 0, p.cx, p.cy, p.half * 2.5);
                g.addColorStop(0, `rgba(255,255,255,${glowAlpha * 0.35})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(p.cx, p.cy, p.half * 2.5, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.04;
            p.alpha -= p.decay;
            if (p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
            ctx.fill();
        }
    }

    function drawWordGlow() {
        const rect = wordmark.getBoundingClientRect();
        if (!rect.width) return;
        const gx = rect.left + rect.width/2;
        const gy = rect.top  + rect.height/2;
        const r  = Math.max(rect.width, rect.height) * 0.8;
        const g  = ctx.createRadialGradient(gx,gy,0, gx,gy,r);
        g.addColorStop(0, `rgba(0,100,255,${wordGlow * 0.18})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(gx, gy, r*1.1, rect.height*0.9, 0, 0, Math.PI*2);
        ctx.fill();
    }

    function revealTagline() {
        if (tagStarted) return;
        tagStarted = true;
        tagEl.querySelectorAll('span').forEach((s, i) => {
            setTimeout(() => {
                s.style.opacity   = '1';
                s.style.transform = 'translateY(0)';
            }, i * 38);
        });
    }

    function introLoop(ts) {
        const dt = lastTs ? ts - lastTs : 16;
        lastTs = ts;
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime - DELAY;

        ctx.clearRect(0, 0, W, H);
        if (elapsed < 0) { requestAnimationFrame(introLoop); return; }

        waves.forEach(wave => {
            const t = (elapsed - wave.delay) / WAVE_DUR;
            if (t < 0 || t > 1.6) return;
            const r     = easeOut(Math.min(t,1)) * maxR;
            const alpha = wave.alpha * Math.max(0, 1 - Math.pow(t/1.2, 2));
            ctx.beginPath();
            ctx.arc(icx, icy, r, 0, Math.PI*2);
            ctx.strokeStyle = `rgba(${wave.color},${alpha})`;
            ctx.lineWidth = wave.width;
            ctx.stroke();

            if (wave.delay === 0 && !wordRevealed) {
                const pct = Math.min(100, (r/maxR)*140);
                wordmark.style.clipPath = `circle(${pct}% at 50% 50%)`;
                if (pct >= 100) { wordRevealed = true; resize(); }
            }
        });

        if (wordRevealed && wordGlow < 1) {
            wordGlow = Math.min(1, wordGlow + dt * 0.001);
            drawWordGlow();
        } else if (wordGlow > 0) {
            drawWordGlow();
        }

        if (elapsed > WAVE_DUR + 250 && plusPhase === 0) plusPhase = 1;
        if (plusPhase > 0) drawPlus(dt);

        if (glowStarted) {
            glowAlpha += dt * 0.003 * glowDir;
            if (glowAlpha >= 1) glowDir = -1;
            if (glowAlpha <= 0) { glowAlpha = 0; glowDir = 1; }
        }

        if (particles.length > 0) drawParticles();
        if (plusPhase === 3 && !tagStarted) revealTagline();

        requestAnimationFrame(introLoop);
    }

    requestAnimationFrame(introLoop);

    /* ── OCULTAR INTRO Y MOSTRAR LOGIN ── */
    setTimeout(() => {
        overlay.classList.add('hidden');
        tagEl.style.transition = 'opacity 1s ease';
        tagEl.style.opacity = '0';
        // Remover del DOM después de la transición
        setTimeout(() => {
            overlay.style.display = 'none';
            cv.style.display = 'none';
            tagEl.style.display = 'none';
        }, 1100);
    }, 5500);

})();

function applyPinMask(pinValue) {
    if (!pinValue || pinValue.length !== 6) return '';
    return '•••••' + pinValue.slice(-1);
}

function showSuccessPopup(msg = "Acceso exitoso"){
    const el = document.getElementById('successPopupMessageText');
    const popup = document.getElementById('successPopup');
    el.textContent = msg;
    popup.classList.add('show');
    popup.setAttribute('aria-hidden','false');
    setTimeout(()=>{ popup.classList.remove('show'); popup.setAttribute('aria-hidden','true'); }, 4000);
}

function showErrorPopup(msg){
    const el = document.getElementById('errorPopupMessage');
    const popup = document.getElementById('errorPopup');
    el.textContent = msg || '';
    popup.classList.add('show'); popup.setAttribute('aria-hidden','false');
    setTimeout(()=>{ popup.classList.remove('show'); popup.setAttribute('aria-hidden','true'); }, 2500);
}

function showImage(index){
    const images = Array.from(document.querySelectorAll('.carousel img'));
    const titleEl = document.getElementById('title');
    if(index === current) return;
    const prev = current >= 0 ? images[current] : null;
    const next = images[index];
    if(prev){ prev.classList.remove('active'); prev.classList.add('leaving'); }
    next.classList.remove('leaving');
    next.style.animation = 'none';
    void next.offsetWidth;
    next.style.animation = '';
    next.classList.add('active');
    if(next.dataset.logoUrl){
        titleEl.innerHTML = `<img src="${next.dataset.logoUrl}" alt="${next.alt || ''}" class="logo-img">`;
        titleEl.classList.add('logo-mode');
    } else {
        titleEl.textContent = next.dataset.title || next.alt || '';
        titleEl.classList.remove('logo-mode');
    }
    document.getElementById('sub').textContent = '';
    document.getElementById('sub').style.display = 'none';
    document.getElementById('rank').textContent = next.dataset.rank || '';
    document.getElementById('rank').style.display = next.dataset.rank ? 'inline-block' : 'none';
    if(prev){ setTimeout(() => { prev.classList.remove('leaving'); prev.style.animation = 'none'; }, 1250); }
    current = index;
}

/* ── Inicializar Firebase y UI cuando el DOM esté listo ── */
document.addEventListener('DOMContentLoaded', () => {

    /* Firebase init — scripts ya cargados arriba */
        const app = firebase.initializeApp(firebaseConfig);
        auth = app.auth();

    /* Referencias a elementos */
    const correoInput      = document.getElementById('correo');
    const pinVisibleInput  = document.getElementById('pinVisible');
    const pinCompletoInput = document.getElementById('pinCompleto');
    const loginButton      = document.getElementById('loginButton');
    const forgotPinLink    = document.getElementById('forgotPinLink');
    const images           = Array.from(document.querySelectorAll('.carousel img'));

    /* Carrusel */
    showImage(0);
    setInterval(()=>{ showImage((current + 1) % images.length); }, ROTATION_MS);

    /* PIN guardado */
    const savedCorreo = localStorage.getItem('correo');
    const savedPin    = localStorage.getItem('pin');
    if(savedCorreo) correoInput.value = savedCorreo;
    if(savedPin && savedPin.length === 6){
        pinCompletoInput.value   = savedPin;
        pinVisibleInput.value    = applyPinMask(savedPin);
        pinVisibleInput.type     = 'text';
        pinVisibleInput.readOnly = true;
        pinVisibleInput.addEventListener('focus', () => {
            pinVisibleInput.readOnly = false;
            pinVisibleInput.value    = savedPin;
            pinVisibleInput.type     = 'password';
        }, { once: true });
    }

    /* LOGIN */
    loginButton.addEventListener('click', async () => {
        if(!auth){ showErrorPopup("Error de conexión. Recarga la página."); return; }
        const correo = (correoInput.value || '').trim().toLowerCase();
        let pin = pinVisibleInput.readOnly ? pinCompletoInput.value : (pinVisibleInput.value || '').trim();
        if(!correo || !pin || pin.length !== 6){ showErrorPopup('Debes ingresar un PIN de 6 dígitos'); return; }
        try {
            await auth.signInWithEmailAndPassword(correo, pin);
            localStorage.setItem('correo', correo);
            localStorage.setItem('pin', pin);
            showSuccessPopup();
            setTimeout(()=>{ window.location.href = 'home.html'; }, 2000);
        } catch (error) {
            console.error("Error de login:", error);
            localStorage.removeItem('pin');
            pinVisibleInput.value    = '';
            pinCompletoInput.value   = '';
            pinVisibleInput.type     = 'password';
            pinVisibleInput.readOnly = false;
            if(['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(error.code)){
                showErrorPopup('Correo o PIN incorrecto');
            } else if(error.code === 'auth/invalid-email'){
                showErrorPopup('Formato de correo inválido');
            } else {
                showErrorPopup('Error de acceso. Por favor, verifica tu conexión.');
            }
        }
    });

    /* OLVIDÉ PIN */
    forgotPinLink.addEventListener('click', async (e) => {
        e.preventDefault();
        if(!auth){ showErrorPopup("Error de conexión. Recarga la página."); return; }
        const correo = (correoInput.value || '').trim().toLowerCase();
        if(!correo){ showErrorPopup('Ingresa tu correo en el campo para restablecer tu PIN'); return; }
        try {
            loginButton.disabled = true;
            forgotPinLink.style.pointerEvents = 'none';
            await auth.sendPasswordResetEmail(correo);
            showSuccessPopup(`Hemos enviado un correo a ${correo} con las instrucciones para crear un nuevo PIN.`);
        } catch (error) {
            if(error.code === 'auth/user-not-found') showErrorPopup('No existe un usuario con ese correo.');
            else if(error.code === 'auth/invalid-email') showErrorPopup('Formato de correo inválido.');
            else showErrorPopup('Error al enviar el correo. Verifica tu conexión.');
        } finally {
            loginButton.disabled = false;
            forgotPinLink.style.pointerEvents = 'auto';
        }
    });

    /* ENTER en inputs */
    [correoInput, pinVisibleInput].forEach(inp => {
        inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') loginButton.click(); });
    });
});
</script>
</body>
</html>
