<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLUTID+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      height: 100vh; overflow: hidden; display: flex;
      flex-direction: column; justify-content: flex-end;
      color: white; background: black;
    }

    /* LOGO */
    .logo {
      position: absolute; top: 15px; left: 20px;
      font-size: 28px; font-weight: bold; letter-spacing: 2px;
      display: flex; align-items: center; z-index: 20;
    }
    .logo .blue { color: #007bff; }
    .logo .plus { color: white; margin-left: 3px; }

    /* HELP ICON */
    .help-btn {
      position: absolute; top: 20px; right: 20px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
      color: white; font-weight: bold; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 20; transition: 0.3s;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }
    .help-btn:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.1);
    }

    /* CARRUSEL */
    .carousel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    .carousel img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity 1s ease-in-out;
    }
    .carousel img.active { opacity: 1; }

    /* INFO DE LA PELÍCULA */
    .movie-info {
      position: absolute; bottom: 35%; left: 50%;
      transform: translateX(-50%); max-width: 90%; text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }
    .movie-rank { background: red; padding: 3px 6px; font-size: 13px;
      font-weight: bold; border-radius: 3px; margin-bottom: 5px; display: inline-block; }
    .movie-title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
    .movie-sub { font-size: 16px; }
    @media (max-width: 600px) {
      .movie-info { bottom: 45%; max-width: 95%; }
      .movie-title { font-size: 20px; } .movie-sub { font-size: 14px; }
    }

    /* OVERLAY LOGIN CURVO */
    .overlay {
      width: 100%; padding: 15px 20px 25px; text-align: center;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(8px);
      clip-path: ellipse(130% 100% at 50% 100%);
    }
    .login-container { max-width: 300px; margin: 0 auto; }
    .login-container h3 { font-size: 16px; margin-bottom: 12px; font-weight: normal; }

    .input-group { margin-bottom: 12px; position: relative; }
    .input-group input {
      width: 100%; padding: 10px 14px; border: none; border-radius: 20px;
      font-size: 14px; background-color: rgba(255,255,255,0.15);
      color: white; text-align: center; transition: 0.3s;
    }
    .input-group input::placeholder {
      color: #f0f0f0; text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .input-group input:focus {
      outline: none; background-color: rgba(255,255,255,0.25);
      box-shadow: 0 0 6px rgba(0,123,255,0.6);
    }

    .login-container button {
      width: 100%; padding: 10px; border: none; border-radius: 20px;
      background: linear-gradient(135deg,#007bff,#00c6ff);
      color: white; font-size: 14px; font-weight: bold; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-container button:hover {
      transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .login-container .suscribirse { margin-top: 10px; font-size: 12px; }
    .login-container .suscribirse a {
      color: #ffffff; text-decoration: none; font-weight: bold; transition: color 0.3s;
    }
    .login-container .suscribirse a:hover { color: #00c6ff; }

    /* INTRO SCREEN */
    .intro-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: black; display: flex; justify-content: center; align-items: center;
      z-index: 1000; transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }
    .intro-screen.hidden { opacity: 0; visibility: hidden; }
    .logo-container {
      font-size: 3.5rem; font-weight: 800; color: white; opacity: 0; letter-spacing: 4px;
      animation: fadeInZoom 2s ease-out forwards, fadeOut 1s ease-in forwards 4s;
      text-shadow: 0 0 10px #00bfff88, 0 0 20px #00bfff44;
    }
    @keyframes fadeInZoom { 0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(1.05); } }

    /* POPUPS */
    .popup-container {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      color: white; padding: 25px 35px; border-radius: 20px;
      font-size: 1.2em; font-weight: bold; text-align: center;
      z-index: 2000; opacity: 0; visibility: hidden; pointer-events: none;
      transition: all 0.4s ease;
    }
    .popup-container.show {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .success-popup { background: rgba(0, 150, 0, 0.9); }
    .error-popup { background: rgba(200, 0, 0, 0.9); }
    .popup-icon {
      width: 50px; height: 50px; margin: 0 auto 10px;
    }
    .popup-message { font-size: 0.7em; margin-top: 5px; opacity: 0.9; }
    svg circle, svg path {
      stroke-dasharray: 150; stroke-dashoffset: 150;
      animation: draw 1s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <!-- INTRO -->
  <div class="intro-screen"><div class="logo-container">LLUTID+</div></div>

  <!-- LOGO -->
  <div class="logo"><span class="blue">LLUTID</span><span class="plus">+</span></div>

  <!-- HELP BUTTON -->
  <div class="help-btn" onclick="window.open('https://llutid.github.io/chat-bot-llutid-/', '_blank')">?</div>

  <!-- CARRUSEL -->
  <div class="carousel">
    <img src="https://supercines.com.ve/storage/image/image-pelicula1749743988.jpg" 
         class="active" data-title="FÓRMULA 1" data-sub="Top 4 en películas hoy" data-rank="TOP 10">

  <!-- INFO DE LA PELÍCULA -->
  <div class="movie-info">
    <div class="movie-rank" id="rank"></div>
    <div class="movie-title" id="title"></div>
    <div class="movie-sub" id="sub"></div>
  </div>

  <!-- OVERLAY LOGIN -->
  <div class="overlay">
    <div class="login-container">
      <h3>Inicia sesión</h3>
      <div class="input-group">
        <input type="email" id="correo" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="pin" placeholder="PIN de acceso (4-6 dígitos)" maxlength="6" inputmode="numeric" required>
      </div>
      <button id="loginButton">Ingresar</button>
      <div class="suscribirse">
        ¿No tienes cuenta? <br>
        <a href="https://api.whatsapp.com/send?phone=+573181087834&text=Hola!%20Quiero%20suscribirme%20a%20Llutid+" target="_blank">
          ¡Suscríbete a Llutid+ ahora!
        </a>
      </div>
    </div>
  </div>

  <!-- POPUPS -->
  <div id="successPopup" class="popup-container success-popup">
    <svg class="popup-icon" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" fill="none" stroke="white" stroke-width="3"/>
      <path fill="none" stroke="white" stroke-width="3" d="M14 27l7 7 17-17"/>
    </svg>
    Acceso Exitoso
  </div>

  <div id="errorPopup" class="popup-container error-popup">
    <svg class="popup-icon" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" fill="none" stroke="white" stroke-width="3"/>
      <path fill="none" stroke="white" stroke-width="3" d="M16 16 36 36 M36 16 16 36"/>
    </svg>
    Acceso Denegado
    <p id="errorPopupMessage" class="popup-message"></p>
  </div>

  <script>
    // Carrusel
    const images = document.querySelectorAll('.carousel img');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const rank = document.getElementById('rank');
    let current = 0;
    function showImage(index) {
      images.forEach((img, i) => img.classList.toggle('active', i === index));
      const img = images[index];
      title.textContent = img.dataset.title || "";
      sub.textContent = img.dataset.sub || "";
      rank.textContent = img.dataset.rank || "";
      rank.style.display = img.dataset.rank ? "inline-block" : "none";
    }
    setInterval(() => { current = (current + 1) % images.length; showImage(current); }, 5000);
    showImage(current);

    // Intro
    const introScreen = document.querySelector('.intro-screen');
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { introScreen.classList.add('hidden'); }, 5000);
    });

    // Correos y PINs válidos (ejemplo)
    const usuariosRegistrados = {

      "rojasstiven016@gmail.com": "2012",
      "jadejimenes939@gmail.com": "8080",
      "Juanestebanhidalgomorales@gmail.com": "1477",
      "laurasofiacruzalonso@gmail.com": "2108",
      "alexanderdrojas12@gmail.com": "2012",
      "jdavidsaiz10@gmail.com": "2011",
      "oscarag2024@gmail.com": "2007",
      "cd_rodriguez89@hotmail.com": "1322",
      "gnbgnmyk": "0607",
      "ythyj6yj787k": "0607",
      "jyj6jkjyuko": "2683"
    };

    // Popups
    const successPopup = document.getElementById('successPopup');
    const errorPopup = document.getElementById('errorPopup');
    const errorPopupMessage = document.getElementById('errorPopupMessage');

    function showSuccessPopup() {
      successPopup.classList.add('show');
      setTimeout(() => successPopup.classList.remove('show'), 2000);
    }
    function showErrorPopup(message) {
      errorPopupMessage.textContent = message;
      errorPopup.classList.add('show');
      setTimeout(() => errorPopup.classList.remove('show'), 2500);
    }

    // Inputs
    const correoInput = document.getElementById("correo");
    const pinInput = document.getElementById("pin");

    // Recuperar datos guardados
    window.addEventListener("DOMContentLoaded", () => {
      const savedCorreo = localStorage.getItem("correo");
      const savedPin = localStorage.getItem("pin");
      if (savedCorreo && savedPin) {
        correoInput.value = savedCorreo;
        pinInput.type = "text";
        pinInput.value = "●".repeat(savedPin.length - 1) + savedPin.slice(-1);
        pinInput.dataset.realPin = savedPin;
      }
    });

    // Al enfocar PIN → permitir edición
    pinInput.addEventListener("focus", () => {
      if (pinInput.dataset.realPin) {
        pinInput.value = "";
        pinInput.type = "password";
        delete pinInput.dataset.realPin;
      }
    });

    // Login
    document.getElementById("loginButton").addEventListener("click", () => {
      const correo = correoInput.value.trim().toLowerCase();
      let pin = pinInput.value.trim();

      if (pinInput.dataset.realPin) pin = pinInput.dataset.realPin;

      if (!correo || !pin) {
        showErrorPopup("Debes ingresar correo y PIN");
        return;
      }
      if (!usuariosRegistrados[correo]) {
        showErrorPopup("El correo no está registrado");
      } else if (usuariosRegistrados[correo] === pin) {
        localStorage.setItem("correo", correo);
        localStorage.setItem("pin", pin);
        showSuccessPopup();
        setTimeout(() => { window.location.href = "home.html"; }, 2200);
      } else {
        showErrorPopup("PIN incorrecto");
      }
    });
  </script>
</body>
</html>
