<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LLUTID+</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
        body{height:100vh;overflow:hidden;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;}
        
        .logo{position:absolute; top:15px; left:20px; z-index:60;font-weight:800; font-size:28px; display:flex; align-items:center;}
        .logo .blue{ color:#007bff; }
        .logo .plus{ margin-left:6px; color:#fff; }
        
        .help-btn{position:absolute; top:18px; right:18px; z-index:60;width:38px; height:38px; border-radius:50%;background:rgba(255,255,255,0.14); backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer; font-weight:800;}

        /* CARRUSEL ULTRA FLUIDO */
        .carousel{position:absolute; inset:0; overflow:hidden; z-index:1; background:#000;}
        .carousel img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; z-index: 1; transform: scale(1);}
        
        /* Imagen Activa: Hace zoom */
        .carousel img.active{
            opacity:1; 
            z-index:30; 
            animation: zoomContinuous 10s linear forwards;
        }
        
        /* Imagen Saliendo: Mantiene el zoom y se desvanece suavemente */
        .carousel img.leaving{
            opacity:0; 
            z-index:20; 
            transform: scale(1.12); /* Se queda grande mientras se va */
            transition: opacity 2s ease-in-out;
        }

        @keyframes zoomContinuous {
            from { transform: scale(1); }
            to { transform: scale(1.12); }
        }

        /* GRADIENTE Y POSICIÓN DE TEXTOS/LOGOS */
        .bg-gradient{position:absolute; left:0; right:0; bottom:0; height:60%; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.9) 100%); z-index:35; pointer-events:none;}
        
        .movie-info{position:absolute; left:50%; transform:translateX(-50%); bottom:34%; text-align:center; z-index:40; pointer-events:none; width:92%;}
        .movie-rank{display:inline-block; background:#0056b3; color:#fff; padding:5px 10px; border-radius:6px; font-weight:800; margin-bottom:10px; font-size:12px;}
        
        .movie-title{font-size:1.8rem; font-weight:900; text-shadow:0 4px 12px rgba(0,0,0,0.8); min-height: 100px; display:flex; align-items:center; justify-content:center;}
        .movie-title img{ max-width:85%; max-height:100px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8)); }

        /* FORMULARIO */
        .overlay{width:100%; padding:20px 18px 30px; position:absolute; left:0; bottom:0; z-index:45; background:rgba(0,0,0,0.4); backdrop-filter: blur(8px); clip-path: ellipse(140% 100% at 50% 100%);}
        .login-container{ max-width:320px; margin:0 auto; }
        
        /* BOTÓN DE GOOGLE CON PERFIL */
        #googleBtn { width:100%; padding:8px; border-radius:25px; border:none; background:#fff; color:#000; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-bottom:12px; transition: 0.3s; overflow: hidden; }
        #googleBtn img { width:28px; height:28px; border-radius:50%; margin-right:10px; object-fit: cover; }
        #googleBtn.selected { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

        .input-group input{width:100%; padding:12px; border-radius:25px; border:none; background:rgba(255,255,255,0.1); color:#fff; text-align:center; margin-bottom:12px; font-size:15px; outline: none;}
        
        #loginButton{width:100%; padding:12px; border-radius:25px; border:none; background:linear-gradient(135deg,#007bff,#00c6ff); color:#fff; font-weight:800; cursor:pointer;}
        
        .footer-links { text-align:center; margin-top:12px; font-size:13px; }
        .footer-links a { color:#bbb; text-decoration:none; display:block; margin: 5px 0; }
        .footer-links .register { color:#00c6ff; font-weight:800; }

        .popup{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:15px 25px; border-radius:10px; z-index:100; opacity:0; visibility:hidden; transition:0.3s; font-weight:bold;}
        .popup.show{ opacity:1; visibility:visible; }
        .success{ background: #00a050; color:#fff; }
        .error{ background: #c81414; color:#fff; }
    </style>
</head>
<body>

    <div class="logo"><span class="blue">LLUTID</span><span class="plus">+</span></div>
    <button class="help-btn" onclick="window.location.href='./registro.html'">?</button>

    <div class="carousel">
        <img src="https://i.postimg.cc/yxTTtjhd/hapy.jpg" alt="M3GAN" data-logo-url="https://i.postimg.cc/dVfjbLC4/AAAAOh-Ut-Va-MWi-DMq-Vw2f-XJZo-QES5X1u-JQj-SHg-H7g-Y85Tf-CU2k00o-H9MW7pab-RVZBc-Bzc7kvp-W1t-Zes-CD2G.png" data-rank="TOP 10" class="active"> 
        <img src="https://images.hive.blog/0x0/https://www.lavanguardia.com/peliculas-series/images/movie/poster/2025/10/w300/ur3H6g9xmrLQX2Ioh9z3P904ZSC.jpg" alt="PRONTO" data-title="¡MUY PRONTO!"> 
        <img src="https://pics.filmaffinity.com/La_monja-562330123-large.jpg" alt="LA MONJA" data-logo-url="https://los40mx00.epimg.net/especiales/depelicula/la-monja/img/02.png"> 
    </div>

    <div class="bg-gradient"></div>

    <div class="movie-info">
        <div class="movie-rank" id="rank">TOP 10</div>
        <div class="movie-title" id="title"></div>
    </div>

    <div class="overlay">
        <div class="login-container">
            <button id="googleBtn" type="button">
                <img id="userPhoto" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="User">
                <span id="googleText">Continuar con Google</span>
            </button>

            <div class="input-group">
                <input id="pinInput" type="password" placeholder="PIN de 6 dígitos" maxlength="6" inputmode="numeric">
            </div>

            <button id="loginButton" type="button">Ingresar</button>
            
            <div class="footer-links">
                <a href="#" id="forgotPin">¿Haz olvidado tu PIN?</a>
                <a href="./registro.html" class="register">Regístrate ahora</a>
            </div>
        </div>
    </div>

    <div id="popSuccess" class="popup success">¡Bienvenido!</div>
    <div id="popError" class="popup error">PIN incorrecto</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",
        authDomain: "llutid-18d26.firebaseapp.com",
        projectId: "llutid-18d26",
        storageBucket: "llutid-18d26.firebasestorage.app",
        messagingSenderId: "900505351564",
        appId: "1:900505351564:web:e71805939e3488170652a9",
        measurementId: "G-VL8X5NWH1S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    let selectedEmail = "";

    // LÓGICA CARRUSEL ULTRA FLUIDO
    const imgs = Array.from(document.querySelectorAll('.carousel img'));
    const titleDiv = document.getElementById('title');
    const rankDiv = document.getElementById('rank');
    let currentIdx = 0;

    function changeSlide() {
        const prevImg = imgs[currentIdx];
        currentIdx = (currentIdx + 1) % imgs.length;
        const nextImg = imgs[currentIdx];

        // 1. Iniciamos la entrada de la siguiente
        nextImg.classList.add('active');

        // 2. La anterior entra en estado 'leaving' (mantiene zoom y baja opacidad)
        prevImg.classList.remove('active');
        prevImg.classList.add('leaving');

        // Actualizar textos al mismo tiempo que el cambio
        if(nextImg.dataset.logoUrl) {
            titleDiv.innerHTML = `<img src="${nextImg.dataset.logoUrl}">`;
        } else {
            titleDiv.textContent = nextImg.dataset.title || nextImg.alt;
        }
        rankDiv.textContent = nextImg.dataset.rank || "";
        rankDiv.style.visibility = nextImg.dataset.rank ? "visible" : "hidden";

        // 3. Limpiar la clase después de que se desvanezca por completo
        setTimeout(() => {
            prevImg.classList.remove('leaving');
        }, 2000); 
    }

    // Inicializar primer slide
    if(imgs[0].dataset.logoUrl) titleDiv.innerHTML = `<img src="${imgs[0].dataset.logoUrl}">`;
    setInterval(changeSlide, 8000);

    // GOOGLE AUTH CON FOTO DE PERFIL
    document.getElementById('googleBtn').addEventListener('click', async () => {
        try {
            const res = await signInWithPopup(auth, googleProvider);
            selectedEmail = res.user.email;
            
            // Actualizar interfaz con foto y correo
            document.getElementById('userPhoto').src = res.user.photoURL;
            document.getElementById('googleText').textContent = selectedEmail;
            document.getElementById('googleBtn').classList.add('selected');
        } catch (e) { alert("Error con Google"); }
    });

    // LOGIN
    document.getElementById('loginButton').addEventListener('click', async () => {
        const pin = document.getElementById('pinInput').value;
        if(!selectedEmail) return alert("Usa el botón de Google");
        if(pin.length !== 6) return alert("PIN de 6 dígitos");

        try {
            await signInWithEmailAndPassword(auth, selectedEmail, pin);
            document.getElementById('popSuccess').classList.add('show');
            setTimeout(() => window.location.href = 'home.html', 1500);
        } catch (e) { 
            document.getElementById('popError').classList.add('show');
            setTimeout(() => document.getElementById('popError').classList.remove('show'), 2500);
        }
    });

    // RECUPERAR
    document.getElementById('forgotPin').addEventListener('click', async (e) => {
        e.preventDefault();
        if(!selectedEmail) return alert("Identifícate primero con Google");
        try {
            await sendPasswordResetEmail(auth, selectedEmail);
            alert("Enviado correo de recuperación a " + selectedEmail);
        } catch (e) { alert("Error al enviar"); }
    });
</script>
</body>
</html>
