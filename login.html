<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LLUTID+</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
        }

        /* ════════════════════════════════════════
           SPLASH SCREEN
        ════════════════════════════════════════ */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a2a3a 0%, #0d0d0d 70%);
            pointer-events: all;
            transition: opacity 0.4s ease;
        }

        #splash-logo-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            line-height: 1;
            transform-origin: center center;
            will-change: transform, opacity;
            animation: splashLogoIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes splashLogoIn {
            from { opacity: 0; transform: scale(0.7) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        #splash-logo-wrap .word {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(5rem, 22vw, 8rem);
            letter-spacing: 0.04em;
            color: #ffffff;
        }

        #splash-logo-wrap #letra-d {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(5rem, 22vw, 8rem);
            letter-spacing: 0.04em;
            color: #ffffff;
        }

        #splash-logo-wrap .plus {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(3.5rem, 16vw, 6rem);
            color: #007bff;
            margin-left: 4px;
            position: relative;
            top: -5px;
        }

        /* ── Spinner HBO-style ── */
        #splash-spinner-wrap {
            margin-top: 60px;
            animation: spinnerFadeIn 0.6s 0.4s both;
            transition: opacity 0.3s ease;
        }
        @keyframes spinnerFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #splash-ring {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ════════════════════════════════════════
           TUNNEL OVERLAY
        ════════════════════════════════════════ */
        #tunnel {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: #0d0d0d;
            clip-path: circle(0% at 50% 50%);
            pointer-events: none;
        }

        /* ════════════════════════════════════════
           LOGIN REVEAL OVERLAY (iris)
        ════════════════════════════════════════ */
        #iris-reveal {
            position: fixed;
            inset: 0;
            z-index: 110;
            background: #0d0d0d;
            clip-path: circle(100% at 50% 50%);
            pointer-events: none;
            transition: clip-path 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #iris-reveal.open {
            clip-path: circle(0% at 50% 50%);
        }

        /* ════════════════════════════════════════
           APP PRINCIPAL
        ════════════════════════════════════════ */
        #app {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #app.visible { opacity: 1; }

        /* ── GRID DE PORTADAS ── */
        .cover-grid {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .grid-inner {
            position: absolute;
            inset: -20% -10%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            transform: rotate(-12deg) scale(1.25);
            transform-origin: center center;
        }

        .grid-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .cover-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(13,13,13,0.10) 0%,
                rgba(13,13,13,0.55) 55%,
                rgba(13,13,13,1) 100%
            );
            pointer-events: none;
        }

        /* ── PANEL INFERIOR ── */
        .bottom-panel {
            flex-shrink: 0;
            padding: 0 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #0d0d0d;
        }

        .llutid-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            line-height: 1;
        }
        .llutid-logo .word {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 10vw, 2.8rem);
            letter-spacing: 0.04em;
            color: #ffffff;
        }
        .llutid-logo .plus {
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(1.7rem, 8vw, 2.2rem);
            color: #007bff;
            margin-left: 3px;
            position: relative;
            top: -3px;
        }

        .headline {
            font-size: clamp(1.15rem, 4.5vw, 1.4rem);
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            margin-bottom: 6px;
            max-width: 320px;
        }
        .subline {
            font-size: clamp(0.82rem, 3vw, 0.92rem);
            font-weight: 400;
            color: rgba(255,255,255,0.62);
            margin-bottom: 18px;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
        }

        .field {
            position: relative;
            margin-bottom: 10px;
        }
        .field input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            padding: 13px 44px 13px 16px;
            color: #fff;
            font-family: 'Barlow', Arial, sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .field input:focus {
            border-color: #007bff;
            background: rgba(0,123,255,0.08);
        }
        .field input::placeholder { color: rgba(255,255,255,0.38); }

        .eye-btn {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: rgba(255,255,255,0.45); font-size: 1.1rem;
            padding: 4px; line-height: 1;
            transition: color 0.15s;
        }
        .eye-btn:hover { color: rgba(255,255,255,0.85); }

        .remember-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 14px; justify-content: flex-start;
        }
        .remember-row input[type=checkbox] {
            width: 16px; height: 16px;
            accent-color: #007bff; cursor: pointer;
        }
        .remember-row label {
            font-size: 0.82rem; color: rgba(255,255,255,0.65); cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-family: 'Barlow', Arial, sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: #ffffff;
            color: #0d0d0d;
            margin-bottom: 10px;
        }
        .btn-primary:hover { background: #dce8ff; }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-blue {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: #fff;
            margin-bottom: 10px;
        }
        .btn-blue:hover { opacity: 0.9; }
        .btn-blue:disabled { opacity: 0.55; cursor: not-allowed; }

        .bottom-links {
            display: flex; justify-content: space-between;
            width: 100%; margin-top: 4px; margin-bottom: 16px;
        }
        .bottom-links a {
            font-size: 0.8rem; color: #007bff; font-weight: 700;
            text-decoration: none;
        }
        .bottom-links a:hover { color: #4da8ff; }

        .privacy-link {
            font-size: 0.82rem; color: rgba(255,255,255,0.4);
            font-weight: 400; text-decoration: none;
        }
        .privacy-link:hover { color: rgba(255,255,255,0.7); }

        /* ════════════════════════════════════════
           BOTÓN CHATBOT — sin efecto de selección
        ════════════════════════════════════════ */
        #chatbot-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 300;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.45);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, transform 0.15s, border-color 0.2s;
            text-decoration: none;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            /* CORRECCIÓN: evitar efecto de selección de texto */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        #chatbot-btn.visible {
            opacity: 1;
            pointer-events: all;
            animation: btnAppear 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes btnAppear {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }
        #chatbot-btn:hover {
            background: rgba(0,123,255,0.18);
            border-color: rgba(0,123,255,0.4);
            color: rgba(255,255,255,0.9);
            transform: scale(1.1);
        }

        /* ════════════════════════════════════════
           POPUPS — diseño mejorado (toast superior)
        ════════════════════════════════════════ */
        .popup {
            position: fixed;
            left: 50%;
            top: 24px;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 18px;
            border-radius: 16px;
            z-index: 400;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: left;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Barlow', Arial, sans-serif;
            min-width: 240px;
            max-width: 320px;
            width: max-content;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        .popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .popup .pop-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            font-weight: 900;
        }
        .popup .pop-body {
            display: flex;
            flex-direction: column;
        }
        .popup .pop-title {
            font-size: 0.88rem;
            font-weight: 700;
            margin: 0;
        }
        .popup p {
            font-size: 0.78rem;
            font-weight: 400;
            opacity: 0.82;
            margin-top: 2px;
            margin-bottom: 0;
        }
        .popup.success {
            background: rgba(0, 140, 75, 0.9);
        }
        .popup.error {
            background: rgba(190, 25, 25, 0.9);
        }

        /* ════════════════════════════════════════
           BANNER DATOS MÓVILES
        ════════════════════════════════════════ */
        #data-warning {
            position: fixed;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 350;
            background: rgba(18, 18, 28, 0.93);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 14px;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 260px;
            max-width: 340px;
            width: max-content;
            transition: bottom 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Barlow', Arial, sans-serif;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }
        #data-warning.show {
            bottom: 28px;
        }
        #data-warning .dw-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        #data-warning .dw-text {
            flex: 1;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.82);
            line-height: 1.4;
        }
        #data-warning .dw-text strong {
            color: #ffc107;
            font-size: 0.82rem;
            font-weight: 700;
            display: block;
            margin-bottom: 1px;
        }
        #data-warning .dw-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 4px;
            flex-shrink: 0;
            transition: color 0.15s;
            line-height: 1;
            user-select: none;
            -webkit-user-select: none;
        }
        #data-warning .dw-close:hover {
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
    <div id="splash-logo-wrap">
        <span class="word">LLUTI</span><span id="letra-d">D</span><span class="plus">+</span>

    <div class="cover-grid">

            <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
            <img src="https://pics.filmaffinity.com/la_casa_de_papel-732216252-large.jpg" alt="">
            <img src="https://www.proimagenescolombia.com/photos/57150_11835__imagen__.jpg" alt="">
            <img src="https://static.wikia.nocookie.net/doblaje/images/4/44/Super_Mario_Galaxy_Primer_Poster.jpg/revision/latest?cb=20260306163503&path-prefix=es" alt="">

        <h1 class="headline">Inicia sesión en LLUTID+</h1>

<!-- BOTÓN CHATBOT -->

   title="Ayuda - Chatbot LLUTID+">?</a>

    <div class="pop-icon">✓</div>

<!-- BANNER CONEXIÓN LENTA / DATOS MÓVILES -->

    <span class="dw-icon">📶</span>
    <div class="dw-text">
        <strong>Conexión de datos móviles</strong>
        Las imágenes pueden tardar en cargar.
    </div>
    <button class="dw-close" onclick="this.parentElement.classList.remove('show')" title="Cerrar">✕</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const splash     = document.getElementById('splash');
    const logoWrap   = document.getElementById('splash-logo-wrap');
    const letraD     = document.getElementById('letra-d');
    const spinner    = document.getElementById('splash-spinner-wrap');
    const tunnel     = document.getElementById('tunnel');
    const irisReveal = document.getElementById('iris-reveal');
    const app        = document.getElementById('app');
    const chatbotBtn = document.getElementById('chatbot-btn');

    function getDCenter() {
        const rect = letraD.getBoundingClientRect();
        const cx = rect.left + rect.width  * 0.5;
        const cy = rect.top  + rect.height * 0.5;
        return {
            x: (cx / window.innerWidth)  * 100,
            y: (cy / window.innerHeight) * 100
        };
    }

    /* Fase 1 → spinner desaparece */
    setTimeout(() => {
        spinner.style.opacity = '0';
        spinner.style.pointerEvents = 'none';
    }, 1800);

    /* Fase 2: logo zoom hacia la D */
    setTimeout(() => {
        const dPos = getDCenter();
        logoWrap.style.transformOrigin = `${dPos.x}% ${dPos.y}%`;
        logoWrap.style.transition = [
            'transform 0.9s cubic-bezier(0.55, 0.06, 0.68, 0.19)',
            'opacity 0.2s ease 0.75s'
        ].join(', ');
        logoWrap.style.transform = 'scale(30)';
        logoWrap.style.opacity   = '0';

        /* Fase 3: túnel negro */
        setTimeout(() => {
            const dPos2 = getDCenter();
            tunnel.style.clipPath  = `circle(0% at ${dPos2.x}% ${dPos2.y}%)`;
            tunnel.style.transition = 'clip-path 0.6s cubic-bezier(0.55, 0.06, 0.68, 0.19)';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    tunnel.style.clipPath = `circle(160% at ${dPos2.x}% ${dPos2.y}%)`;
                });
            });

            /* Fase 4: app visible + iris */
            setTimeout(() => {
                app.style.opacity = '1';
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        irisReveal.classList.add('open');
                    });
                });

                /* Fase 5: ocultar splash, mostrar botón */
                setTimeout(() => {
                    splash.style.opacity       = '0';
                    splash.style.pointerEvents = 'none';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        tunnel.style.display = 'none';
                        chatbotBtn.classList.add('visible');
                    }, 400);

                    /* Detección de conexión lenta o datos móviles */
                    if ('connection' in navigator) {
                        const conn = navigator.connection;
                        const isSlow = conn.saveData ||
                            ['slow-2g', '2g', '3g'].includes(conn.effectiveType) ||
                            (conn.downlink !== undefined && conn.downlink < 1.5);
                        if (isSlow) {
                            setTimeout(() => {
                                document.getElementById('data-warning').classList.add('show');
                            }, 600);
                        }
                    }

                }, 1000);
            }, 600);
        }, 900);
    }, 2000);

    /* ════════════════════════════════════════
       FIREBASE + LOGIN
    ════════════════════════════════════════ */
    const firebaseConfig = {
        apiKey: "AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",
        authDomain: "llutid-18d26.firebaseapp.com",
        projectId: "llutid-18d26",
        storageBucket: "llutid-18d26.firebasestorage.app",
        messagingSenderId: "900505351564",
        appId: "1:900505351564:web:e71805939e3488170652a9"
    };

    let auth = null;

    function showOk(msg) {
        const el = document.getElementById('popOk');
        document.getElementById('popOkMsg').textContent = msg || '';
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3500);
    }
    function showErr(msg) {
        const el = document.getElementById('popErr');
        document.getElementById('popErrMsg').textContent = msg || '';
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2800);
    }

    try {
        const firebaseApp = firebase.initializeApp(firebaseConfig);
        auth = firebaseApp.auth();
    } catch(e) { console.warn('Firebase init:', e); }

    const correoEl   = document.getElementById('correo');
    const pinEl      = document.getElementById('pin');
    const rememberEl = document.getElementById('remember');
    const eyeBtn     = document.getElementById('eyeBtn');
    const loginBtn   = document.getElementById('loginBtn');

    const savedCorreo = localStorage.getItem('llutid_correo');
    const savedPin    = localStorage.getItem('llutid_pin');
    if (savedCorreo) { correoEl.value = savedCorreo; rememberEl.checked = true; }
    if (savedPin && savedPin.length === 6) { pinEl.value = savedPin; }

    let pinVisible = false;
    eyeBtn.addEventListener('click', () => {
        pinVisible = !pinVisible;
        pinEl.type         = pinVisible ? 'text' : 'password';
        eyeBtn.textContent = pinVisible ? '🙈' : '👁';
    });

    loginBtn.addEventListener('click', async () => {
        if (!auth) { showErr('Error de conexión. Recarga la página.'); return; }
        const correo = (correoEl.value || '').trim().toLowerCase();
        const pin    = (pinEl.value || '').trim();
        if (!correo) { showErr('Ingresa tu correo electrónico'); return; }
        if (pin.length !== 6) { showErr('El PIN debe tener exactamente 6 dígitos'); return; }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Ingresando...';

        try {
            await auth.signInWithEmailAndPassword(correo, pin);

            if (rememberEl.checked) {
                localStorage.setItem('llutid_correo', correo);
                localStorage.setItem('llutid_pin', pin);
            } else {
                localStorage.removeItem('llutid_correo');
                localStorage.removeItem('llutid_pin');
            }

            showOk('¡Bienvenido a LLUTID+!');
            setTimeout(() => { window.location.href = 'home.html'; }, 2000);
        } catch (err) {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Ingresar';
            if (!rememberEl.checked) { localStorage.removeItem('llutid_pin'); }
            if (['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(err.code)) {
                showErr('Correo o PIN incorrecto');
            } else if (err.code === 'auth/invalid-email') {
                showErr('Formato de correo inválido');
            } else {
                showErr('Error de acceso. Verifica tu conexión.');
            }
        }
    });

    document.getElementById('forgotPin').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!auth) { showErr('Error de conexión.'); return; }
        const correo = (correoEl.value || '').trim().toLowerCase();
        if (!correo) { showErr('Ingresa tu correo primero'); return; }
        try {
            await auth.sendPasswordResetEmail(correo);
            showOk(`Instrucciones enviadas a ${correo}`);
        } catch (err) {
            if (err.code === 'auth/user-not-found') showErr('No existe usuario con ese correo.');
            else if (err.code === 'auth/invalid-email') showErr('Formato de correo inválido.');
            else showErr('Error al enviar. Verifica tu conexión.');
        }
    });

    [correoEl, pinEl].forEach(el => {
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
    });
});
</script>
</body>
</html>
