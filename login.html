<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Llutid+</title>
  <style>
    /* Importar fuente para un mejor diseño (opcional, si no la tienes ya en tu proyecto) */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative; /* Importante para el botón flotante */
    }

    /* Animación de la pantalla de bienvenida */
    .intro-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #000000, #0a0a0a);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .logo-container {
      font-size: 4rem;
      font-weight: 800;
      color: white;
      opacity: 0;
      letter-spacing: 4px;
      animation: fadeInZoom 2s ease-out forwards, fadeOut 1s ease-in forwards 4s;
      text-shadow: 0 0 10px #00bfff88, 0 0 20px #00bfff44;
      font-family: 'Montserrat', sans-serif;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(1.05);
      }
    }

    /* Estilo del formulario de login */
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      display: none; /* Ocultar el formulario inicialmente */
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    h1 span:first-child {
      color: #2196f3;
    }

    h1 span:last-child {
      color: #ffffff;
    }

    /* Estilos para todos los inputs, incluyendo el de PIN */
    input {
      width: 100%;
      padding: 12px 20px;
      margin: 12px 0;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      background-color: #1e1e1e;
      color: white;
      text-align: center;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.6);
    }

    /* Estilos para botones, incluyendo los nuevos de PIN */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px; /* Ajustado para que esté siempre debajo del PIN */
      border: none;
      border-radius: 30px;
      background-color: #2196f3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0bc36a;
    }
    
    .mensaje {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 30px;
      font-size: 16px;
    }

    #error { background-color: #f44336; }

    /* Mensajes de alerta para el PIN */
    #pinAlert {
        background-color: #f44336;
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 14px;
        margin-top: 10px;
        margin-bottom: 5px; /* Reducir margen para que no ocupe tanto espacio */
        display: none; /* Oculto por defecto */
    }

    .suscribirse {
      margin-top: 30px;
      font-size: 14px;
    }

    .suscribirse a {
      color: #2196f3;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-top: 8px;
      transition: color 0.3s;
    }

    .suscribirse a:hover {
      color: #0bc36a;
    }

    /* Animación fadeIn para el formulario */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Estilos para el botón de soporte flotante */
    .support-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: none;
    }

    .support-button a {
      display: block;
      width: 60px;
      height: 60px;
      background-color: #2196f3;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .support-button a:hover {
      background-color: #0bc36a;
      transform: scale(1.05);
    }

    .support-button img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      /* Filtro de brillo y contraste para un efecto "blanqueado" */
      filter: brightness(1.5) contrast(1.2); 
    }

    /* Clases para controlar la visibilidad de las secciones del PIN */
    .hidden {
      display: none;
    }

    /* Estilo para el display del PIN oculto con icono de lápiz */
    #pinDisplayContainer {
        position: relative; /* Para posicionar el icono de lápiz */
        width: 100%;
        margin: 12px 0; /* Igual que los inputs */
        display: flex; /* Para centrar el texto y posicionar el icono */
        justify-content: center; /* Centra el texto horizontalmente */
        align-items: center; /* Centra verticalmente el texto y el icono */
        padding: 8px 20px; /* Reducido para que sea menos "gordo" */
        background-color: #1e1e1e; /* Fondo oscuro como los inputs */
        border-radius: 30px; /* Bordes redondeados */
        cursor: pointer; /* Indica que es clicable */
        transition: all 0.3s ease;
    }

    #pinDisplayContainer:hover {
        box-shadow: 0 0 8px rgba(33, 150, 243, 0.6);
    }

    #pinDisplay {
        font-size: 20px; /* Tamaño de fuente ligeramente reducido */
        font-weight: bold;
        color: #ffffff; /* Color blanco para que contraste con el fondo */
        letter-spacing: 2px; /* Espacio entre los caracteres para simular asteriscos */
        flex-grow: 1; /* Permite que el texto ocupe el espacio disponible */
        line-height: normal; /* Asegura que el texto no tenga un espaciado excesivo */
    }

    .edit-pin-icon {
        position: absolute;
        right: 15px; /* Ajusta la posición del icono */
        color: #2196f3; /* Color del lápiz */
        font-size: 18px; /* Tamaño del lápiz, ligeramente más pequeño */
        cursor: pointer;
        transition: color 0.3s ease;
    }

    .edit-pin-icon:hover {
        color: #0bc36a; /* Color al pasar el ratón */
    }

    /* --- ESTILOS PARA EL MENSAJE DE ÉXITO FLOTANTE (¡ESPECTACULAR!) --- */
    .success-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(45deg, #00c6ff, #0072ff); 
        color: white;
        padding: 40px 60px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 198, 255, 0.7);
        font-family: 'Poppins', sans-serif;
        font-size: 2.8em;
        font-weight: 600;
        text-align: center;
        z-index: 2000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        letter-spacing: 1px;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3);

        display: flex; /* Para centrar el contenido interno */
        flex-direction: column; /* Para apilar el icono y el texto */
        align-items: center;
        justify-content: center;
        gap: 20px; /* Espacio entre el icono y el texto */
    }

    /* Contenedor del icono de éxito */
    .success-icon-container {
        width: 100px;
        height: 100px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Estilo del círculo */
    .success-circle {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 8px solid #fff; /* Borde blanco para el círculo */
        border-top-color: transparent; /* Para la animación de dibujo */
        transform: rotate(-45deg); /* Ajuste inicial para la animación */
        animation: drawCircle 0.8s ease-out forwards; /* Animación de dibujo */
    }

    /* Estilo del chulo (checkmark) */
    .success-checkmark {
        position: absolute;
        width: 50px;
        height: 25px;
        border: 8px solid #fff; /* Borde blanco para el chulo */
        border-top: none;
        border-right: none;
        transform: rotate(-45deg) scale(0); /* Inicialmente oculto y rotado */
        animation: drawCheckmark 0.5s ease-out 0.8s forwards; /* Animación de dibujo con delay */
        opacity: 0; /* Inicialmente invisible */
    }

    /* Animación para el dibujo del círculo */
    @keyframes drawCircle {
        0% {
            stroke-dasharray: 0 300; /* No visible */
            transform: rotate(-45deg);
        }
        100% {
            stroke-dasharray: 300 300; /* Completamente visible */
            transform: rotate(315deg); /* Rotación completa */
        }
    }

    /* Animación para el dibujo del chulo */
    @keyframes drawCheckmark {
        0% {
            stroke-dasharray: 0 50;
            transform: rotate(-45deg) scale(0);
            opacity: 0;
        }
        100% {
            stroke-dasharray: 50 50;
            transform: rotate(-45deg) scale(1);
            opacity: 1;
        }
    }

    /* Animaciones mejoradas para el popup completo (fade in/out y escala) */
    @keyframes fadeInScaleUp {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes fadeOutScaleDown {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); visibility: hidden;}
    }

  </style>
</head>
<body>

  <div class="intro-screen">
    <div class="logo-container">LLUTID+</div>
  </div>

  <div class="container" id="mainContainer">
    <h1><span>Llutid</span><span>+</span></h1>

    <input type="email" id="correo" placeholder="Correo electrónico" />

    <div id="setPinSection">
        <input type="password" id="pinInput" placeholder="PIN (4-6 dígitos)" maxlength="6" inputmode="numeric" />
        <div id="pinAlert" class="alert-message"></div>
    </div>

    <div id="viewPinSection" class="hidden">
        <div id="pinDisplayContainer" onclick="editPin()">
            <div id="pinDisplay"></div>
            <span class="edit-pin-icon">✎</span> 
        </div>
    </div>
    
    <button onclick="handlePinAction()">Ingresar</button>

    <div id="loginMessages">
        <div id="error" class="mensaje">Correo o PIN incorrecto.</div>
    </div>

    <div class="suscribirse">
      ¿No tienes cuenta? <br />
      <a href="https://api.whatsapp.com/send?phone=+573181087834&text=%C2%A1Hola!%20%F0%9F%91%8B%20Estoy%20emocionado/a%20por%20unirme%20a%20Llutid+%20%F0%9F%8E%AC%20y%20comenzar%20a%20disfrutar%20de%20todo%20su%20contenido%20exclusivo.%20%C2%BFPodr%C3%ADan%20ayudarme%20con%20los%20pasos%20para%20iniciar%20mi%20suscripci%C3%B3n%20%F0%9F%92%B3%20y%20completar%20el%20proceso%20de%20pago?%20%C2%AAEspero%20con%20ansias%20ser%20parte%20de%C2%A0la%C2%A0experiencia%20Llutid+!%20%E2%9C%A8" target="_blank">
        ¡Suscríbete a Llutid+ ahora!
      </a>
    </div>
  </div>

  <div class="support-button" id="supportButton">
    <a href="https://llutid.github.io/chat-bot-llutid-/" target="_blank" title="Soporte al Cliente">
      <img src="https://i.postimg.cc/R0KPQjLX/logotipo-soporte-al-cliente-llutid-1.png" alt="Soporte al Cliente" class="support-icon">
    </a>
  </div>

  <div id="successPopup" class="success-popup hidden">
    <div class="success-icon-container">
      <div class="success-circle"></div>
      <div class="success-checkmark"></div>
    </div>
    <span>¡Acceso Exitoso!</span>
  </div>

  <script>
    // Referencias a elementos HTML
    const mainContainer = document.getElementById('mainContainer');
    const introScreen = document.querySelector('.intro-screen');
    const supportButton = document.getElementById('supportButton');
    const correoInput = document.getElementById('correo');
    const pinInput = document.getElementById('pinInput');
    const pinDisplay = document.getElementById('pinDisplay');
    const pinDisplayContainer = document.getElementById('pinDisplayContainer');
    const setPinSection = document.getElementById('setPinSection');
    const viewPinSection = document.getElementById('viewPinSection');
    const pinAlert = document.getElementById('pinAlert');
    const errorMsg = document.getElementById('error');
    const loginMessages = document.getElementById('loginMessages');
    const successPopup = document.getElementById('successPopup'); // Nuevo elemento para el popup de éxito

    // Usuarios registrados (ejemplo, esto idealmente vendría de un servidor)
    const usuariosRegistrados = {
        "llutidoficial@gmail.com": "1057",
        "luzmarinamartinez1805@gmail.com": "0607",
        "torresqnderson0987@gmail.com": "0607",
        "martinidia30@gmail.com": "2683",
        "pipedxhidalgo@gmail.com": "0607",
        "ruizruizdannaelizabeth@gmail.com": "0607",
        "ximenapm2603@gmail.com": "0607",
        "Andresmedina2508@gmail.com": "4445",
        "jeferssonstivenf@gmail.com": "1057",
        "duvan263009@gmail.com": "1581",
        "pipereyes090@gmail.com": "1601",
        "rgshigm@gmail.com": "2930",
        "juan.m.bustos.d@gmail.com": "6352",
        "rojasstiven016@gmail.com": "2012",
        "hfhfhvihv": "nfernhferhf",
        "jhghgehiuh": "jgkrjgijg",
        "hfkjewhfhgfj": "rjgoirjhg",
        "rfhrigu": "jfi3jhf984",
        "jf43qhf9843": "vfnkmnv",
    };

    // --- Lógica de la pantalla de introducción y carga inicial ---
    setTimeout(() => {
        introScreen.style.display = 'none';
        mainContainer.style.display = 'block';
        mainContainer.style.animation = 'fadeIn 1s ease-in-out';
        supportButton.style.display = 'block';

        const storedCorreo = localStorage.getItem('correo');
        const storedPin = localStorage.getItem('userPin');

        if (storedCorreo) {
            correoInput.value = storedCorreo;
        }

        if (storedPin) {
            displayPartiallyHiddenPin(storedPin);
            setPinSection.classList.add('hidden'); // Oculta el campo de input del PIN
            viewPinSection.classList.remove('hidden'); // Muestra el display del PIN con el lápiz
            pinInput.value = storedPin; // **Importante:** Carga el PIN completo en el input oculto para su uso posterior
        } else {
            setPinSection.classList.remove('hidden'); // Muestra el campo de input del PIN
            viewPinSection.classList.add('hidden'); // Oculta el display del PIN
        }
    }, 5500);

    // --- Funciones para la gestión del PIN ---

    /**
     * Muestra el PIN de forma parcial (ej. "••••5").
     * @param {string} pin - El PIN completo a mostrar.
     */
    function displayPartiallyHiddenPin(pin) {
        if (pin && pin.length > 0) {
            const hiddenPart = '•'.repeat(pin.length - 1); // Genera puntos para la parte oculta
            const lastDigit = pin.slice(-1); // Obtiene el último dígito
            pinDisplay.textContent = hiddenPart + lastDigit; // Actualiza el texto en el display
        } else {
            pinDisplay.textContent = 'No hay PIN guardado.';
        }
    }

    /**
     * Maneja la acción del botón "Ingresar".
     * Si no hay PIN guardado, lo guarda. Luego intenta verificar el login.
     */
    function handlePinAction() {
        const correo = correoInput.value.trim().toLowerCase();
        let pinParaVerificar = '';

        // Si la sección de establecer PIN está visible (significa que el usuario está ingresando un PIN nuevo)
        if (!setPinSection.classList.contains('hidden')) {
            const enteredPin = pinInput.value.trim();
            // Validación del PIN al guardarlo por primera vez
            if (enteredPin.length < 4 || enteredPin.length > 6 || !/^\d+$/.test(enteredPin) || !correo) { // Agregada validación de correo
                pinAlert.textContent = 'Por favor, introduce un correo y un PIN de 4 a 6 dígitos numéricos.';
                pinAlert.classList.remove('hidden');
                return; // Detener la función si el PIN o el correo es inválido
            }
            localStorage.setItem('userPin', enteredPin); // Guarda el nuevo PIN
            localStorage.setItem('correo', correo); // Guarda el correo también
            pinInput.value = enteredPin; // Asegura que pinInput tenga el valor para la verificación
            pinParaVerificar = enteredPin;
        } else {
            // Si la sección de ver PIN está visible (significa que el PIN ya está guardado)
            // Usamos el PIN que ya se precargó en pinInput al cargar la página
            pinParaVerificar = pinInput.value; 
            // Si el correo no está ingresado, muestra error
            if (!correo) {
                pinAlert.textContent = 'Por favor, introduce tu correo electrónico.';
                pinAlert.classList.remove('hidden');
                return;
            }
        }
        
        // Limpiar mensajes anteriores de alerta de PIN y login
        hideMessages();
        pinAlert.classList.add('hidden');

        // Ahora, verificar el login con el PIN adecuado
        verificarLogin(correo, pinParaVerificar);
    }

    /**
     * Prepara la interfaz para que el usuario pueda editar (establecer uno nuevo) el PIN.
     * Se llama al hacer clic en el contenedor del PIN oculto o el icono de lápiz.
     */
    function editPin() {
        localStorage.removeItem('userPin'); // Elimina el PIN actual de localStorage
        pinInput.value = ''; // Limpia el campo de entrada
        
        setPinSection.classList.remove('hidden'); // Muestra la sección de establecer/ingresar PIN
        viewPinSection.classList.add('hidden'); // Oculta la sección de ver/editar PIN
        pinInput.focus(); // Enfoca el input para que el usuario pueda escribir un nuevo PIN
        hideMessages(); // Oculta mensajes de éxito/error de login
        pinAlert.classList.add('hidden'); // Oculta cualquier mensaje de alerta de PIN
    }

    // --- Lógica original de verificación de login ---

    function verificarLogin(correo, pinAComparar) {
        hideMessages(); // Oculta mensajes anteriores

        // Verificar si el correo existe y si el PIN proporcionado coincide
        if (usuariosRegistrados[correo] && usuariosRegistrados[correo] === pinAComparar) {
            showSuccessPopup(); // Muestra el nuevo popup de éxito
            setTimeout(() => {
                window.location.href = 'home.html'; // Redirige a home.html después de la animación del popup
            }, 2500); // Dar tiempo para que el popup se vea un poco
        } else {
            errorMsg.style.display = 'block'; // Mantiene el mensaje de error normal
        }
    }

    // Función para mostrar el popup de éxito con la nueva animación
    function showSuccessPopup() {
        successPopup.classList.remove('hidden');
        successPopup.style.opacity = 0; // Reinicia la opacidad para la animación
        successPopup.style.visibility = 'visible'; // Hace visible el elemento
        successPopup.style.animation = 'fadeInScaleUp 0.6s ease-out forwards, fadeOutScaleDown 0.6s ease-in forwards 3s'; // Aplica las animaciones generales del popup

        // Reinicia las animaciones de círculo y chulo para que se reproduzcan cada vez
        const circle = successPopup.querySelector('.success-circle');
        const checkmark = successPopup.querySelector('.success-checkmark');

        // Forzar reinicio de animación
        circle.style.animation = 'none';
        checkmark.style.animation = 'none';
        void circle.offsetWidth; // Trigger reflow
        void checkmark.offsetWidth; // Trigger reflow
        circle.style.animation = 'drawCircle 0.8s ease-out forwards';
        checkmark.style.animation = 'drawCheckmark 0.5s ease-out 0.8s forwards';
    }

    // Función auxiliar para ocultar mensajes de éxito/error
    function hideMessages() {
        errorMsg.style.display = 'none';
        successPopup.classList.add('hidden'); // Asegura que el popup esté oculto
        successPopup.style.animation = 'none'; // Detiene cualquier animación en curso del popup
    }

  </script>
</body>
</html>
