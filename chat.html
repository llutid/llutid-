<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llutid+ | TV en vivo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none; -webkit-user-select:none; }

html,body {
  height:100%; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:#000; color:#fff; -webkit-font-smoothing:antialiased;
}

.top-fixed { position:fixed; top:0; left:0; right:0; z-index:100; background:#000; }
.scroll-area { position:fixed; left:0; right:0; bottom:75px; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#000; }

/* ─ HEADER ─ */
.header { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.1); position:relative; }
.logo { font-size:32px; font-weight:900; text-align:center; letter-spacing:-1px; }
.logo-llutid { background:linear-gradient(135deg,#2962FF 0%,#1E88E5 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.logo-plus { color:#fff; font-weight:900; font-size:36px; }

/* ─ BALL BUTTON — imagen circular con fondo blanco ─ */
.ball-btn {
  position:absolute; right:20px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; padding:4px;
  display:none;
}
.ball-btn.visible { display:block; }
.ball-wrap { position:relative; display:inline-block; }
.ball-circle {
  width:42px; height:42px; border-radius:50%;
  background:#fff; border:2px solid #e0e0e0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.ball-circle img {
  width:34px; height:34px; object-fit:contain;
}
.ball-circle-default {
  width:34px; height:34px;
}
.ball-notif {
  position:absolute; top:-3px; right:-3px;
  width:11px; height:11px; background:#e53935; border-radius:50%;
  border:2px solid #000;
  animation:notifPulse 1.5s infinite;
}
@keyframes notifPulse {
  0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.8);}
  50%{box-shadow:0 0 0 6px rgba(229,57,53,0);}
}

/* ─ MATCH PICKER ─ */
.match-picker {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:none; align-items:flex-end; justify-content:center; z-index:300;
  backdrop-filter:blur(6px);
}
.match-picker.open { display:flex; }
.match-sheet {
  background:#111; border:1px solid rgba(255,255,255,.12);
  border-radius:20px 20px 0 0; padding:24px; width:100%;
  animation:slideUp .25s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.match-sheet h3 { font-size:16px; font-weight:800; margin-bottom:16px; text-align:center; }
.match-option {
  background:#0d0d0d; border:1px solid rgba(255,255,255,.08);
  border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer;
  transition:background .2s;
}
.match-option:hover { background:#161616; }
.match-option .mo-label { font-size:15px; font-weight:700; }
.match-option .mo-ch { font-size:12px; color:#555; margin-top:4px; }
.match-cancel { width:100%; background:rgba(255,255,255,.05); border:none; border-radius:12px;
  padding:14px; color:#888; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }

/* ─ BALL ANIMATION ─ */
@keyframes ballFly {
  0%{transform:scale(1) translateY(0); opacity:1;}
  100%{transform:scale(0.3) translateY(200px); opacity:0;}
}
.ball-flying { animation:ballFly .5s ease forwards; }

/* ─ CURRENT CHANNEL ─ */
.current-channel {
  padding:10px 20px; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.channel-info { display:flex; align-items:center; gap:8px; }
.live-badge { background:#e53935; color:#fff; padding:3px 8px; border-radius:4px; font-size:10px; font-weight:900; letter-spacing:1px; }

/* ─ PLAYER ─ */
.video-container { position:relative; width:100%; padding-bottom:56.25%; background:#000; }
.video-container video { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
.placeholder { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
.placeholder-icon { font-size:48px; opacity:.2; margin-bottom:10px; }
.placeholder-text { font-size:13px; color:#555; }
.loading-spinner {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:44px; height:44px;
  border:3px solid rgba(255,255,255,.1); border-top:3px solid #fff;
  border-radius:50%; animation:spin .9s linear infinite;
}
@keyframes spin { 0%{transform:translate(-50%,-50%) rotate(0)} 100%{transform:translate(-50%,-50%) rotate(360deg)} }

/* ─ FILTERS ─ */
.filters {
  display:flex; gap:8px; padding:10px 16px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.filters::-webkit-scrollbar { display:none; }
.filter-btn {
  padding:8px 16px; background:#111; border:1px solid rgba(255,255,255,.1);
  border-radius:20px; color:#888; font-size:12px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:all .25s; flex-shrink:0;
  display:flex; align-items:center; gap:6px;
}
.filter-btn.active { background:#fff; color:#000; border-color:#fff; }
.filter-btn img { width:14px; height:14px; object-fit:contain; }

/* ─ CATEGORY HEADER ─ */
.category-header {
  padding:16px 20px 12px; font-size:17px; font-weight:800; color:#fff;
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex; align-items:center; gap:10px;
}
.cat-logo { width:22px; height:22px; object-fit:contain; }

/* ─ CHANNEL ITEM ─ */
.channel-item {
  display:flex; align-items:center; padding:14px 20px;
  border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; transition:background .15s;
}
.channel-item:hover { background:#0d0d0d; }
.channel-item.active { background:#111; border-left:3px solid #2962FF; }
.channel-number { font-size:15px; font-weight:800; color:#444; min-width:44px; margin-right:12px; }
.channel-item.active .channel-number { color:#fff; }
.channel-icon {
  width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  font-size:26px; margin-right:14px; background:#0d0d0d;
  border-radius:10px; overflow:hidden; flex-shrink:0;
}
.channel-icon img { width:100%; height:100%; object-fit:contain; padding:5px; }
.channel-details { flex:1; min-width:0; }
.channel-name { font-size:15px; font-weight:700; color:#fff; margin-bottom:3px; display:flex; align-items:center; gap:6px; }
.language-badge { background:rgba(255,255,255,.08); color:#666; padding:1px 6px; border-radius:3px; font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; flex-shrink:0; }
.channel-description { font-size:12px; color:#555; }
.channel-arrow { color:#2a2a2a; font-size:18px; margin-left:10px; }
.channel-item.active .channel-arrow { color:#2962FF; }

/* ─ FAVORITE HEART ─ */
.fav-btn {
  width:36px; height:36px; background:none; border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; margin-left:8px; padding:6px; border-radius:50%;
  transition:background .2s; flex-shrink:0; position:relative; z-index:10;
}
.fav-btn:active { background:rgba(229,57,53,.15); }
.fav-btn svg { width:18px; height:18px; pointer-events:none; }
.fav-btn.liked svg { fill:#e53935; stroke:#e53935; }
.fav-btn:not(.liked) svg { fill:none; stroke:#444; }

/* ─ SCHEDULE PILL ─ */
.sched-pill {
  display:inline-block; background:rgba(41,98,255,.15);
  color:#5B8FFF; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:12px; margin-left:6px;
}

/* ─ BOTTOM NAV ─ */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; height:75px;
  background:rgba(10,10,12,.97); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  display:flex; justify-content:space-around; align-items:center;
  border-top:1px solid rgba(255,255,255,.08); z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item {
  display:flex; flex-direction:column; align-items:center;
  color:#666; text-decoration:none; font-size:10px; font-weight:500;
  transition:all .25s; opacity:.7; background:none; border:none; cursor:pointer;
}
.nav-item.active { color:#fff; opacity:1; transform:translateY(-2px); }
.nav-item svg { width:24px; height:24px; margin-bottom:4px; }
.nav-item.active svg { color:#2962FF; filter:drop-shadow(0 0 6px rgba(41,98,255,.5)); }

.list-end { height:16px; }
</style>
</head>
<body>

<div class="top-fixed" id="topFixed">
  <div class="header">
    <div class="logo">
      <span class="logo-llutid">llutid</span><span class="logo-plus">+</span>
    </div>
    <!-- Balón: oculto hasta Firebase -->
    <button class="ball-btn" id="ballBtn" id="ballBtnOuter">
      <div class="ball-wrap" id="ballWrap">
        <div class="ball-circle" id="ballCircle">
          <!-- Imagen dinámica desde Firebase (ballImageUrl) -->
          <svg class="ball-circle-default" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="ballDefaultSvg">
            <circle cx="50" cy="50" r="48" fill="#222" stroke="#333" stroke-width="2"/>
            <polygon points="50,20 62,38 58,58 42,58 38,38" fill="#fff"/>
            <polygon points="20,35 38,38 42,58 26,68 14,52" fill="#fff"/>

            <polygon points="50,82 42,58 58,58 68,74 56,84" fill="#fff"/>

<div class="scroll-area" id="scrollArea">

</div>

<!-- Match picker sheet -->
<div class="match-picker" id="matchPicker">
  <div class="match-sheet">
    <h3>Partido en vivo — ¿Cuál quieres ver?</h3>
    <div id="matchOptions"></div>
    <button class="match-cancel" id="matchCancel">Cancelar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",
  authDomain:"llutid-18d26.firebaseapp.com",
  databaseURL:"https://llutid-18d26-default-rtdb.firebaseio.com",
  projectId:"llutid-18d26",
  storageBucket:"llutid-18d26.firebasestorage.app",
  messagingSenderId:"900505351564",
  appId:"1:900505351564:web:e71805939e3488170652a9",
  measurementId:"G-VL8X5NWH1S"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let userId = null;
let hls = null;
let isDragging = false, touchStartY = 0;
let _channels = [], _categories = [], _likes = {}, _ball = {};
let _activeChannelId = null;
let _currentFilter = 'all';
let _authReady = false;

// ─ Anonymous auth ─
// FIX: Ensure auth completes before likes can be written
async function initAuth() {
  try {
    const cred = await signInAnonymously(auth);
    userId = cred.user.uid;
    _authReady = true;
    loadUserLikes();
  } catch(e) {
    console.warn('Auth anónimo falló:', e);
  }
}
initAuth();

// ─ Load categories ─
onValue(ref(db,'categories'), snap => {
  const data = snap.val()||{};
  _categories = Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||99)-(b.order||99));
  renderFilters();
  renderChannelList();
});

// ─ Load channels ─
onValue(ref(db,'channels'), snap => {
  const data = snap.val()||{};
  _channels = Object.entries(data).map(([id,v])=>({id,...v}))
    .filter(c=>c.visible!==false)
    .sort((a,b)=>(a.num||0)-(b.num||0));
  renderChannelList();
  setTimeout(()=>{
    if(_channels.length && !_activeChannelId){
      playChannel(_channels[0]);
    }
  }, 400);
});

// ─ Load ball ─
onValue(ref(db,'ball'), snap => {
  _ball = snap.val()||{};
  updateBallUI();
});

// ─ Load user likes ─
function loadUserLikes() {
  if(!userId) return;
  onValue(ref(db,'likes'), snap => {
    const data = snap.val()||{};
    _likes = {};
    Object.entries(data).forEach(([chId, users])=>{
      if(users && users[userId]) _likes[chId] = true;
    });
    // Update only heart buttons without re-rendering the whole list
    document.querySelectorAll('.fav-btn').forEach(btn => {
      const chId = btn.dataset.chid;
      if(chId) btn.classList.toggle('liked', !!_likes[chId]);
    });
  });
}

// ─ BALL UI ─
function updateBallUI() {
  const btn = document.getElementById('ballBtn');
  const notif = document.getElementById('ballNotif');
  const ballImg = document.getElementById('ballImg');
  const ballDefaultSvg = document.getElementById('ballDefaultSvg');
  const now = Date.now();

  // Update ball image if URL provided
  const imgUrl = _ball.imageUrl||'';
  if(imgUrl) {
    ballImg.src = imgUrl;
    ballImg.style.display = 'block';
    ballDefaultSvg.style.display = 'none';
  } else {
    ballImg.style.display = 'none';
    ballDefaultSvg.style.display = 'block';
  }

  let active = false;
  if(_ball.status==='on') active = true;
  else if(_ball.status==='scheduled'){
    const s = _ball.start ? new Date(_ball.start).getTime() : 0;
    const e = _ball.end ? new Date(_ball.end).getTime() : Infinity;
    active = (now>=s && now<=e);
  }
  btn.classList.toggle('visible', active);
  notif.style.display = active ? 'block' : 'none';
}

// ─ BALL TAP ─
document.getElementById('ballBtn').addEventListener('click', () => {
  const m1 = _ball.match1||'';
  const m2 = _ball.match2||'';
  if(m1 && m2) {
    const opts = document.getElementById('matchOptions');
    const matches = [
      {label:m1, ch:_ball.ch1||_ball.channel1},
      {label:m2, ch:_ball.ch2}
    ].filter(x=>x.label);
    opts.innerHTML = matches.map(x=>`
      <div class="match-option" data-ch="${x.ch}">
        <div class="mo-label">${x.label}</div>
        <div class="mo-ch">${getChName(x.ch)}</div>
      </div>`).join('');
    opts.querySelectorAll('.match-option').forEach(el=>{
      el.addEventListener('click', ()=>{
        closeMatchPicker();
        animateBallToChannel(el.dataset.ch);
      });
    });
    document.getElementById('matchPicker').classList.add('open');
  } else {
    animateBallToChannel(_ball.ch1||_ball.channel1);
  }
});

document.getElementById('matchCancel').addEventListener('click', closeMatchPicker);

function closeMatchPicker() {
  document.getElementById('matchPicker').classList.remove('open');
}

function getChName(chId) {
  const c = _channels.find(x=>x.id===chId);
  return c ? c.name : '—';
}

function animateBallToChannel(chId) {
  const wrap = document.getElementById('ballWrap');
  wrap.classList.add('ball-flying');
  setTimeout(()=>{
    wrap.classList.remove('ball-flying');
    const el = document.querySelector(`.channel-item[data-chid="${chId}"]`);
    const ch = _channels.find(x=>x.id===chId);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(()=>{ playChannel(ch); },400);
    } else if(ch) {
      playChannel(ch);
    }
  },550);
}

// ─ FILTERS ─
function renderFilters() {
  const bar = document.getElementById('filtersBar');
  bar.innerHTML = `<button class="filter-btn ${_currentFilter==='all'?'active':''}" data-filter="all">Todos</button>`
    + _categories.map(c=>{
        // Solo logo imagen, SIN emoji en el botón
        const icon = c.logo
          ? `<img src="${c.logo}" alt="" onerror="this.style.display='none'">`
          : '';
        return `<button class="filter-btn ${_currentFilter===c.id?'active':''}" data-filter="${c.id}">${icon}${c.name||c.id}</button>`;
      }).join('');

  bar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      _currentFilter = btn.dataset.filter;
      bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderChannelList();
    });
  });
}

// ─ CHANNEL LIST ─
function renderChannelList() {
  const container = document.getElementById('channelList');
  const cats = _currentFilter==='all' ? _categories : _categories.filter(c=>c.id===_currentFilter);
  let html = '';

  for(const cat of cats){
    const chs = _channels.filter(c=>c.category===cat.id);
    if(!chs.length) continue;

    // Solo logo imagen en header, SIN emoji
    const catLogoHtml = cat.logo
      ? `<img src="${cat.logo}" class="cat-logo" onerror="this.style.display='none'">`
      : '';
    html += `<div class="category" data-category="${cat.id}">
      <div class="category-header">${catLogoHtml}${cat.name||cat.id}</div>`;

    for(const c of chs){
      const isActive = c.id===_activeChannelId;
      const isLiked = !!_likes[c.id];
      html += `
        <div class="channel-item${isActive?' active':''}" data-chid="${c.id}">
          <div class="channel-number">${String(c.num||0).padStart(3,'0')}</div>
          <div class="channel-icon">${c.logo?`<img src="${c.logo}" alt="" onerror="this.parentElement.innerHTML='📺'">`:'📺'}</div>
          <div class="channel-details">
            <div class="channel-name">${c.name||'Canal'}${c.lang?` <span class="language-badge">${c.lang}</span>`:''}</div>
            <div class="channel-description" id="desc-${c.id}">${c.desc||''}</div>
          </div>
          <button class="fav-btn${isLiked?' liked':''}" data-chid="${c.id}" aria-label="Favorito">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
          <div class="channel-arrow">›</div>
        </div>`;
    }
    html += '</div>';
  }

  // Sin categoría
  const noCat = _channels.filter(c=>!_categories.find(cat=>cat.id===c.category));
  if(noCat.length && _currentFilter==='all'){
    html += `<div class="category"><div class="category-header">Otros</div>`;
    for(const c of noCat){
      const isActive = c.id===_activeChannelId;
      const isLiked = !!_likes[c.id];
      html += `<div class="channel-item${isActive?' active':''}" data-chid="${c.id}">
        <div class="channel-number">${String(c.num||0).padStart(3,'0')}</div>
        <div class="channel-icon">${c.logo?`<img src="${c.logo}" alt="" onerror="this.parentElement.innerHTML='📺'">`:'📺'}</div>
        <div class="channel-details"><div class="channel-name">${c.name}</div><div class="channel-description" id="desc-${c.id}">${c.desc||''}</div></div>
        <button class="fav-btn${isLiked?' liked':''}" data-chid="${c.id}" aria-label="Favorito">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div class="channel-arrow">›</div>
      </div>`;
    }
    html += '</div>';
  }

  container.innerHTML = html || '<div style="padding:40px;text-align:center;color:#444;font-size:13px;">Sin canales disponibles</div>';

  // ─── Attach events AFTER innerHTML ───
  // Channel tap — play
  container.querySelectorAll('.channel-item').forEach(item => {
    item.addEventListener('click', e => {
      if(isDragging) return;
      // If the click was on the fav button, ignore
      if(e.target.closest('.fav-btn')) return;
      const chId = item.dataset.chid;
      const ch = _channels.find(x=>x.id===chId);
      if(ch) playChannel(ch);
    });
  });

  // FIX: Fav buttons — event delegation avoids onclick-in-module issues
  container.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      e.preventDefault();
      const chId = btn.dataset.chid;
      if(!chId) return;

      // Wait for auth if not ready
      if(!userId) {
        try {
          const cred = await signInAnonymously(auth);
          userId = cred.user.uid;
          _authReady = true;
          loadUserLikes();
        } catch(err) {
          console.error('Auth falló:', err);
          return;
        }
      }

      const favRef = ref(db, `likes/${chId}/${userId}`);

      // Optimistic UI update
      const isNowLiked = !_likes[chId];
      _likes[chId] = isNowLiked || undefined;
      if(!isNowLiked) delete _likes[chId];
      btn.classList.toggle('liked', isNowLiked);

      // Write to Firebase
      try {
        if(isNowLiked) {
          await set(favRef, true);
        } else {
          await remove(favRef);
        }
      } catch(err) {
        // Rollback on error
        _likes[chId] = !isNowLiked || undefined;
        if(!(!isNowLiked)) delete _likes[chId];
        btn.classList.toggle('liked', !isNowLiked);
        console.error('Error guardando favorito:', err);
      }
    });
  });

  loadScheduleDescriptions();
  adjustLayout();
}

// ─ Schedule descriptions ─
function loadScheduleDescriptions() {
  const today = new Date().toISOString().split('T')[0];
  const nowTime = new Date().toTimeString().slice(0,5);
  _channels.forEach(c=>{
    get(ref(db,`schedule/${c.id}/${today}`)).then(snap=>{
      const data = snap.val()||{};
      const items = Object.values(data).filter(i=>i.start<=nowTime&&(!i.end||i.end>=nowTime));
      const el = document.getElementById(`desc-${c.id}`);
      if(el && items.length){
        el.innerHTML = `${items[0].desc||items[0].name||''} <span class="sched-pill">EN VIVO</span>`;
      }
    });
  });
}

// ─ Touch drag detection ─
document.addEventListener('touchstart', e=>{
  touchStartY = e.touches[0].clientY;
  isDragging = false;
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(Math.abs(e.touches[0].clientY-touchStartY)>8) isDragging=true;
}, {passive:true});
document.addEventListener('touchend', ()=>{
  setTimeout(()=>isDragging=false, 100);
}, {passive:true});

// ─ PLAY ─
function playChannel(ch) {
  _activeChannelId = ch.id;
  const playerContainer = document.getElementById('playerContainer');
  const currentChannelDiv = document.getElementById('currentChannel');

  currentChannelDiv.innerHTML = `
    <span class="channel-info">
      ${ch.logo?`<img src="${ch.logo}" style="width:26px;height:26px;object-fit:contain;border-radius:4px;background:#111;" onerror="this.style.display='none'">`:'📺'}
      ${ch.name}
    </span>
    <span class="live-badge">● LIVE</span>`;

  document.querySelectorAll('.channel-item').forEach(i=>{
    i.classList.toggle('active', i.dataset.chid===ch.id);
  });

  playerContainer.innerHTML = '<div class="loading-spinner"></div>';
  setTimeout(adjustLayout, 50);

  setTimeout(()=>{
    playerContainer.innerHTML='';
    const video = document.createElement('video');
    video.controls=true; video.autoplay=true; video.playsInline=true;
    video.style.cssText='width:100%;height:100%;position:absolute;top:0;left:0;background:#000;';
    playerContainer.appendChild(video);

    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=ch.url; video.play().catch(()=>{});
    } else if(window.Hls && Hls.isSupported()){
      if(hls) hls.destroy();
      hls = new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:30});
      hls.loadSource(ch.url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
      hls.on(Hls.Events.ERROR,(_,data)=>{
        if(data.fatal) playerContainer.innerHTML='<div class="placeholder"><div class="placeholder-icon">⚠️</div><div class="placeholder-text">No se pudo cargar el canal</div></div>';
      });
    } else {
      playerContainer.innerHTML='<div class="placeholder"><div class="placeholder-icon">⚠️</div><div class="placeholder-text">Navegador no compatible</div></div>';
    }
    setTimeout(adjustLayout,100);
  },200);
}

function adjustLayout(){
  const h = document.getElementById('topFixed').offsetHeight;
  document.getElementById('scrollArea').style.top = h+'px';
}

window.addEventListener('load', adjustLayout);
window.addEventListener('resize', adjustLayout);
setInterval(loadScheduleDescriptions, 60000);
setInterval(updateBallUI, 60000);
</script>
</body>
