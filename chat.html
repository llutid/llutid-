<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; --online: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; }
        .logo-text { font-size: 24px; font-weight: 800; }
        .logo-llutid { color: var(--azul-rey); }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        .content-scroll { height: calc(100vh - 220px); overflow-y: auto; padding-bottom: 150px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; position: relative; }
        
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .online-dot { width: 12px; height: 12px; background: var(--online); border: 2px solid var(--bg-dark); border-radius: 50%; position: absolute; bottom: 0; right: 0; z-index: 10; }
        .unread-badge { background: var(--accent-blue); color: white; font-size: 10px; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .full-screen { position: fixed; inset: 0; background: #000; z-index: 2500; display: none; flex-direction: column; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; margin-bottom: 2px; }
        .verified-badge { color: #007bff; font-size: 12px; margin-left: 5px; }

        .chat-footer { position: fixed; bottom: 95px; left: 15px; right: 15px; display: flex; gap: 10px; z-index: 2600; }
        .chat-footer input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid #444; padding: 15px; border-radius: 30px; color: white; outline: none; }
        
        .bottom-nav { position: fixed; left: 15px; right: 15px; bottom: 15px; height: 70px; display: flex; justify-content: space-around; align-items: center; background: rgba(15, 15, 17, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; z-index: 4000; }
        .bottom-nav button { background: none; border: none; color: #aeb0b5; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; gap: 4px; cursor: pointer; }
        .btn-active { color: var(--accent-blue) !important; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 25px; width: 90%; max-width: 400px; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; object-fit: cover; border: 2px solid transparent; }
    </style>
</head>
<body>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Mi Perfil</h2>
            <div id="p-avatar" class="avatar" style="width:70px; height:70px; margin: 15px auto;"></div>
            <div id="avatar-picker" style="display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin:15px 0;"></div>
            <input type="text" id="custom-url" placeholder="URL de imagen..." style="width:100%; padding:10px; background:#000; color:white; border:1px solid #333; border-radius:8px;">
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:10px; margin-top:15px; font-weight:bold;">GUARDAR</button>
            <button onclick="auth.signOut()" style="width:100%; margin-top:10px; color:red; background:none; border:none;">Cerrar Sesión</button>
            <button onclick="document.getElementById('profile-modal').style.display='none'" style="width:100%; margin-top:10px; color:gray; background:none; border:none;">Cancelar</button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Nombre de la Comunidad</h3>
            <input type="text" id="new-group-name" style="width:100%; padding:12px; margin:20px 0; border-radius:10px; background:#111; color:white; border:1px solid #333;">
            <button onclick="finishGroupCreation()" style="width:100%; padding:12px; background:var(--azul-rey); color:white; border:none; border-radius:10px; font-weight:bold;">CREAR GRUPO</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="group-creation-bar" style="display:none; background:var(--azul-rey); padding:12px 20px; justify-content:space-between; align-items:center;">
            <span id="selected-count">Seleccionados: 0</span>
            <button onclick="openGroupNameModal()" style="background:white; color:black; border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">CONTINUAR</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span><span style="color:white">+</span></div>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-plus-square" onclick="startGroupMode()" style="font-size:22px;"></i>
                    <i class="fas fa-user-circle" onclick="openProfile()" style="font-size:22px;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="tab-chats" onclick="setTab('chats')">CHATS</div>
                <div class="tab" id="tab-users" onclick="setTab('users')">USUARIOS</div>
            </div>
        </div>

        <div style="padding:10px 20px;"><input type="text" id="main-search" placeholder="Buscar..." onkeyup="filterLists()" style="width:100%; padding:12px; border-radius:10px; background:#111; border:1px solid #333; color:white;"></div>
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="auth-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <div class="logo-text" style="font-size:40px;"><span class="logo-llutid">Llutid</span><span style="color:white">+</span></div>
        <div style="width:80%; margin-top:30px;">
            <input type="text" id="reg-name" placeholder="Nombre" style="width:100%; padding:12px; margin-bottom:10px;">
            <input type="email" id="reg-email" placeholder="Correo" style="width:100%; padding:12px; margin-bottom:10px;">
            <input type="password" id="reg-pin" placeholder="PIN" style="width:100%; padding:12px; margin-bottom:20px;">
            <button onclick="handleAuth()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:10px;">ENTRAR</button>
        </div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="header" style="display:flex; align-items:center; gap:12px;">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <div id="chat-header-avatar" class="avatar" style="width:40px; height:40px; margin-right:0;"></div>
            <div style="flex:1">
                <div id="chat-name-top" style="font-weight:bold; font-size:15px;"></div>
                <div id="chat-status-top" style="font-size:11px; color:var(--online);"></div>
            </div>
        </div>
        <div id="msg-box" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:8px;"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Mensaje..." oninput="updateTyping(true)">
            <button onclick="send()" style="background:var(--azul-rey); width:50px; height:50px; border-radius:50%; border:none; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximos.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [];

        const AVATARS = [
            "https://lafrikileria.com/blog/wp-content/uploads/2023/04/mejores-peliculas-animacion-disney.jpeg",
            "https://i.pinimg.com/236x/ab/93/51/ab9351153c08385a24257ea9f5b33bbc.jpg",
            "https://i.pinimg.com/originals/18/6a/5a/186a5a0a89b7cf476c2f516a873b4355.jpg",
            "https://i.pinimg.com/474x/b3/75/dc/b375dc13bfc16775cdbcce2b8a39fe5f.jpg",
            "https://img.freepik.com/foto-gratis/renderizacion-3d-persona-viendo-pelicula_23-2151169511.jpg?semt=ais_hybrid&w=740&q=80",
            "https://img.freepik.com/fotos-premium/retrato-primer-plano-personaje-masculino-estilizado-dibujos-animados_948873-17113.jpg?semt=ais_hybrid&w=740&q=80",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeP4nwlVmSUrUVmHLW5QOUPUaxXUVIt_kHHA&s",
            "https://i.pinimg.com/originals/96/7c/e9/967ce909c5596137a266e9640eafe9a5.jpg"
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('auth-screen').style.display = 'none';
                        db.ref('users/'+me.uid+'/online').set(true);
                        db.ref('users/'+me.uid+'/online').onDisconnect().set(false);
                        setTab('chats');
                    }
                });
            } else {
                document.getElementById('main-app').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        async function handleAuth() {
            const email = document.getElementById('reg-email').value, pin = document.getElementById('reg-pin').value, name = document.getElementById('reg-name').value;
            try { await auth.signInWithEmailAndPassword(email, pin); } catch {
                const res = await auth.createUserWithEmailAndPassword(email, pin);
                await db.ref('users/' + res.user.uid).set({ uid: res.user.uid, nombre: name, email, avatar: AVATARS[0], online: true });
            }
        }

        function renderList(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    let chats = []; snap.forEach(c => chats.push(c.val()));
                    chats.sort((a,b) => b.time - a.time).forEach(item => {
                        const isLlutid = item.email === 'llutidoficial@gmail.com' || item.id === 'llutid_oficial';
                        const avatarUrl = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : (item.avatar || '');
                        
                        // Listener Online para la lista de chats
                        if(!item.isGroup) {
                            db.ref('users/' + item.id + '/online').on('value', s => {
                                const dot = document.getElementById('online-chat-'+item.id);
                                if(dot) dot.style.display = s.val() ? 'block' : 'none';
                            });
                        }

                        list.innerHTML += `
                            <div class="chat-item list-row" onclick="openChat('${item.id}', '${item.nombre}', ${item.isGroup}, '${avatarUrl}')">
                                <div class="avatar">
                                    ${avatarUrl ? `<img src="${avatarUrl}">` : item.nombre[0]}
                                    <div class="online-dot" id="online-chat-${item.id}" style="display:none"></div>
                                </div>
                                <div style="flex:1">
                                    <b>${item.nombre} ${isLlutid?'<i class="fas fa-check-circle verified-badge"></i>':''}</b>
                                    <br><small id="last-${item.id}" style="color:gray">${item.lastMsg || ''}</small>
                                </div>
                                ${item.unreadCount > 0 ? `<div class="unread-badge">${item.unreadCount}</div>` : ''}
                            </div>`;
                    });
                });
            } else {
                db.ref('users').on('value', snap => {
                    list.innerHTML = '';
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val(), isLlutid = user.email === 'llutidoficial@gmail.com';
                        const isSel = selectedUsers.includes(u.key);
                        const avatarUrl = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : user.avatar;
                        list.innerHTML += `
                            <div class="chat-item list-row" onclick="${isGroupMode ? `toggleSelect('${u.key}')` : `openChat('${user.uid}', '${user.nombre}', false, '${avatarUrl}')`}">
                                <div class="avatar">
                                    ${avatarUrl ? `<img src="${avatarUrl}">` : user.nombre[0]}
                                    ${user.online ? '<div class="online-dot"></div>' : ''}
                                </div>
                                <div style="flex:1"><b>${user.nombre} ${isLlutid?'<i class="fas fa-check-circle verified-badge"></i>':''}</b></div>
                                ${isGroupMode ? `<i class="fas ${isSel?'fa-check-circle':'fa-circle'}" style="color:${isSel?'var(--accent-blue)':'#333'}; font-size:20px;"></i>` : ''}
                            </div>`;
                    });
                });
            }
        }

        function openChat(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-name-top').innerText = nombre;
            document.getElementById('chat-header-avatar').innerHTML = avatar ? `<img src="${avatar}">` : nombre[0];
            
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            db.ref('recent/' + me.uid + '/' + id + '/unreadCount').set(0);

            // Estado online/escribiendo en cabecera
            if(!isGroup) {
                db.ref('users/' + id + '/online').on('value', s => {
                    document.getElementById('chat-status-top').innerText = s.val() ? 'En línea' : 'Desconectado';
                });
            }
            db.ref('typing/' + chatID).on('value', s => {
                let isTyping = false; s.forEach(u => { if(u.key !== me.uid && u.val()) isTyping = true; });
                if(isTyping) document.getElementById('chat-status-top').innerText = 'escribiendo...';
            });

            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box'); box.innerHTML = '';
                snap.forEach(m => {
                    const d = m.val(); const isMe = d.sender === me.uid;
                    box.innerHTML += `<div class="bubble" style="align-self:${isMe?'flex-end':'flex-start'}; background:${isMe?'var(--azul-rey)':'#222'};">${d.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const val = document.getElementById('msg-input').value; if(!val) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            
            db.ref('messages/' + chatID).push({ text: val, sender: me.uid, time: Date.now() });
            
            if(activeChat.isGroup) {
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members || [];
                    members.forEach(m => {
                        db.ref('recent/' + m + '/' + activeChat.id).update({ lastMsg: val, time: Date.now() });
                        if(m !== me.uid) db.ref('recent/' + m + '/' + activeChat.id + '/unreadCount').transaction(c => (c||0)+1);
                    });
                });
            } else {
                // Actualización para que NO desaparezca de chats
                db.ref('recent/' + me.uid + '/' + activeChat.id).update({ id: activeChat.id, nombre: activeChat.nombre, avatar: activeChat.avatar || '', lastMsg: val, time: Date.now(), isGroup: false });
                db.ref('recent/' + activeChat.id + '/' + me.uid).update({ id: me.uid, nombre: me.nombre, avatar: me.avatar || '', lastMsg: val, time: Date.now(), isGroup: false });
                db.ref('recent/' + activeChat.id + '/' + me.uid + '/unreadCount').transaction(c => (c||0)+1);
            }
            document.getElementById('msg-input').value = '';
            updateTyping(false);
        }

        function startGroupMode() { isGroupMode = true; selectedUsers = [me.uid]; document.getElementById('group-creation-bar').style.display = 'flex'; setTab('users'); }
        
        function toggleSelect(uid) {
            if(uid === me.uid) return;
            const i = selectedUsers.indexOf(uid);
            if(i > -1) selectedUsers.splice(i, 1); else selectedUsers.push(uid);
            document.getElementById('selected-count').innerText = "Seleccionados: " + (selectedUsers.length - 1);
            renderList('users');
        }

        function openGroupNameModal() { if(selectedUsers.length < 2) return alert("Selecciona a alguien"); document.getElementById('group-name-modal').style.display = 'flex'; }

        function finishGroupCreation() {
            const name = document.getElementById('new-group-name').value; if(!name) return;
            const gid = 'group_' + Date.now();
            const gData = { id: gid, nombre: name, isGroup: true, members: selectedUsers, lastMsg: 'Comunidad creada', time: Date.now() };
            const updates = {};
            selectedUsers.forEach(u => updates['recent/' + u + '/' + gid] = gData);
            db.ref().update(updates).then(() => {
                document.getElementById('group-name-modal').style.display = 'none';
                isGroupMode = false; setTab('chats');
            });
        }

        function openProfile() {
            const p = document.getElementById('profile-modal'); p.style.display = 'flex';
            document.getElementById('p-avatar').innerHTML = me.avatar ? `<img src="${me.avatar}">` : me.nombre[0];
            const picker = document.getElementById('avatar-picker'); picker.innerHTML = '';
            AVATARS.forEach(url => {
                picker.innerHTML += `<img src="${url}" class="avatar-option" onclick="selectAvatar('${url}')">`;
            });
        }
        function selectAvatar(url) { document.getElementById('custom-url').value = url; document.getElementById('p-avatar').innerHTML = `<img src="${url}">`; }
        async function saveProfile() {
            const url = document.getElementById('custom-url').value; if(!url) return;
            await db.ref('users/' + me.uid).update({ avatar: url });
            document.getElementById('profile-modal').style.display = 'none';
        }

        function updateTyping(s) {
            if(!activeChat) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            db.ref('typing/' + chatID + '/' + me.uid).set(s);
            if(s) { clearTimeout(window.tyT); window.tyT = setTimeout(() => updateTyping(false), 2000); }
        }

        function setTab(t) { 
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            renderList(t);
        }
        function closeChat() { document.getElementById('chat-window').style.display = 'none'; activeChat = null; }
        function filterLists() {
            const q = document.getElementById('main-search').value.toLowerCase();
            document.querySelectorAll('.list-row').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
        }
    </script>
</body>
</html>
