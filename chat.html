<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .logo-llutid { color: var(--azul-rey); }
        .logo-plus { color: #ffffff; }

        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        .content-scroll { height: calc(100vh - 220px); overflow-y: auto; padding-bottom: 150px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; }
        
        /* AVATAR CIRCULAR */
        .avatar { width: 52px; height: 52px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; border: 2px solid transparent; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .bottom-nav {
            position: fixed; left: 15px; right: 15px; bottom: 15px; height: 70px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(15, 15, 17, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; z-index: 4000;
        }
        .bottom-nav button { background: none; border: none; color: #aeb0b5; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; gap: 4px; }
        .btn-active { color: var(--accent-blue) !important; }

        /* MODAL PERFIL DESLIZANTE */
        #profile-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 6000; display: none; align-items: flex-end; }
        .profile-card { background: var(--bg-panel); width: 100%; border-radius: 30px 30px 0 0; padding: 30px 20px; animation: slideUp 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .avatar-option { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; object-fit: cover; }
        .avatar-option.selected { border-color: var(--azul-rey); }

        .full-screen { position: fixed; inset: 0; background: #000; z-index: 2500; display: none; flex-direction: column; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #333; }

        .chat-footer { position: fixed; bottom: 95px; left: 15px; right: 15px; display: flex; gap: 10px; z-index: 2600; }
        .chat-footer input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid #444; padding: 15px; border-radius: 30px; color: white; outline: none; }
        
        #group-creation-bar { display: none; background: var(--azul-rey); padding: 12px 20px; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; margin-bottom: 2px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="profile-modal" onclick="if(event.target === this) toggleProfile(false)">
        <div class="profile-card">
            <div style="width: 50px; height: 5px; background: #333; border-radius: 10px; margin: 0 auto 20px;"></div>
            <h2 id="p-name" style="text-align:center; margin-bottom:5px;">Nombre</h2>
            <p id="p-email" style="text-align:center; color:gray; font-size:14px; margin-bottom:20px;">correo@ejemplo.com</p>
            
            <p style="font-weight:bold; margin-bottom:10px;">Elige un Avatar:</p>
            <div class="avatar-grid" id="avatar-selector"></div>
            
            <p style="font-weight:bold; margin-bottom:10px;">O pega URL de imagen:</p>
            <input type="text" id="custom-avatar-url" placeholder="https://..." style="width:100%; padding:12px; border-radius:10px; background:#111; border:1px solid #333; color:white; margin-bottom:20px;">
            
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:15px; font-weight:bold; margin-bottom:10px;">GUARDAR CAMBIOS</button>
            <button onclick="auth.signOut()" style="width:100%; padding:15px; background:#ff444422; color:#ff4444; border:none; border-radius:15px; font-weight:bold;">CERRAR SESIÓN</button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Nueva Comunidad</h3>
            <input type="text" id="new-group-name" placeholder="Nombre del grupo..." style="width:100%; padding:12px; margin:20px 0; border-radius:10px; background:#111; color:white; border:1px solid #333;">
            <button onclick="finishGroupCreation()" style="width:100%; padding:12px; background:var(--azul-rey); color:white; border:none; border-radius:10px; font-weight:bold;">CREAR</button>
            <button onclick="document.getElementById('group-name-modal').style.display='none'" style="color:gray; background:none; border:none; margin-top:15px;">Cancelar</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="group-creation-bar">
            <span id="selected-count">Seleccionados: 1</span>
            <button onclick="openGroupNameModal()" style="background:white; color:black; border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">LISTO</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span><span class="logo-plus">+</span></div>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-plus-square" onclick="startGroupMode()" style="font-size:22px; cursor:pointer;"></i>
                    <i class="fas fa-user-circle" onclick="toggleProfile(true)" style="font-size:22px; cursor:pointer;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="tab-chats" onclick="setTab('chats')">CHATS</div>
                <div class="tab" id="tab-users" onclick="setTab('users')">USUARIOS</div>
            </div>
        </div>

        <div style="padding:10px 20px;"><input type="text" id="main-search" placeholder="Buscar..." onkeyup="filterLists()" style="width:100%; padding:12px; border-radius:10px; background:#111; border:1px solid #333; color:white;"></div>
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="auth-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <div class="logo-text" style="font-size:40px;"><span class="logo-llutid">Llutid</span><span class="logo-plus">+</span></div>
        <div style="width:80%; margin-top:30px;">
            <input type="text" id="reg-name" placeholder="Nombre de usuario" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:#111; border:1px solid #333; color:white;">
            <input type="email" id="reg-email" placeholder="Correo electrónico" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:#111; border:1px solid #333; color:white;">
            <input type="password" id="reg-pin" placeholder="PIN (mín. 6 caracteres)" style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px; background:#111; border:1px solid #333; color:white;">
            <button onclick="handleAuth()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:10px; font-weight:bold;">ENTRAR / REGISTRAR</button>
        </div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="header" style="display:flex; align-items:center; gap:15px; justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer; padding:5px;"></i>
                <div id="chat-avatar-top" class="avatar" style="width:38px; height:38px; margin:0; font-size:14px;"></div>
                <div id="chat-name-top" style="font-weight:bold; font-size:16px;">Chat</div>
            </div>
            <i class="fas fa-ellipsis-v" id="btn-group-options" style="padding:10px; display:none; cursor:pointer;" onclick="showChatOptions()"></i>
        </div>
        <div id="msg-box" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:5px;"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()" style="background:var(--azul-rey); width:50px; height:50px; border-radius:50%; border:none; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximasenlanzamiento.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [];

        const defaultAvatars = [
            "https://lafrikileria.com/blog/wp-content/uploads/2023/04/mejores-peliculas-animacion-disney.jpeg",
            "https://i.pinimg.com/236x/ab/93/51/ab9351153c08385a24257ea9f5b33bbc.jpg",
            "https://i.pinimg.com/originals/18/6a/5a/186a5a0a89b7cf476c2f516a873b4355.jpg",
            "https://i.pinimg.com/474x/b3/75/dc/b375dc13bfc16775cdbcce2b8a39fe5f.jpg",
            "https://img.freepik.com/foto-gratis/renderizacion-3d-persona-viendo-pelicula_23-2151169511.jpg?semt=ais_hybrid&w=740&q=80",
            "https://img.freepik.com/fotos-premium/retrato-primer-plano-personaje-masculino-estilizado-dibujos-animados_948873-17113.jpg?semt=ais_hybrid&w=740&q=80",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeP4nwlVmSUrUVmHLW5QOUPUaxXUVIt_kHHA&s",
            "https://i.pinimg.com/originals/96/7c/e9/967ce909c5596137a266e9640eafe9a5.jpg"
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('auth-screen').style.display = 'none';
                        setTab('chats');
                        initAvatarSelector();
                    }
                });
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        async function handleAuth() {
            const email = document.getElementById('reg-email').value;
            const pin = document.getElementById('reg-pin').value;
            const name = document.getElementById('reg-name').value || email.split('@')[0];
            if(pin.length < 6) return alert("El PIN debe tener al menos 6 caracteres");
            try { await auth.signInWithEmailAndPassword(email, pin); } 
            catch {
                const res = await auth.createUserWithEmailAndPassword(email, pin);
                await db.ref('users/' + res.user.uid).set({ uid: res.user.uid, nombre: name, email, avatar: '' });
            }
        }

        function setTab(type) {
            if(!isGroupMode) document.getElementById('group-creation-bar').style.display = 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + type).classList.add('active');
            renderList(type);
        }

        function renderList(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            db.ref('recent/' + me.uid).off();
            db.ref('users').off();

            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    let chats = [];
                    snap.forEach(c => chats.push(c.val()));
                    
                    // ORDEN: El último mensaje arriba
                    chats.sort((a, b) => (b.time || 0) - (a.time || 0));

                    chats.forEach(item => {
                        const avatarSrc = item.avatar ? `<img src="${item.avatar}">` : (item.nombre ? item.nombre[0] : '?');
                        list.innerHTML += `
                            <div class="chat-item list-row" onclick="openChat('${item.id}', '${item.nombre}', ${item.isGroup || false}, '${item.avatar || ''}')">
                                <div class="avatar" style="${item.isGroup ? 'background:var(--azul-rey)' : ''}">${avatarSrc}</div>
                                <div style="flex:1">
                                    <b>${item.nombre}</b><br>
                                    <small style="color:gray">${item.lastMsg || 'Sin mensajes'}</small>
                                </div>
                            </div>`;
                    });
                });
            } else {
                db.ref('users').once('value', snap => {
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val();
                        const isSel = selectedUsers.includes(u.key);
                        const avatarSrc = user.avatar ? `<img src="${user.avatar}">` : (user.nombre ? user.nombre[0] : '?');
                        list.innerHTML += `
                            <div class="chat-item list-row user-row" onclick="${isGroupMode ? `toggleSelect('${u.key}')` : `openChat('${u.key}', '${user.nombre}', false, '${user.avatar || ''}')`}">
                                <div class="avatar">${avatarSrc}</div>
                                <div style="flex:1"><b>${user.nombre}</b></div>
                                ${isGroupMode ? `<i class="fas ${isSel ? 'fa-check-circle' : 'fa-circle'}" style="color:${isSel?'var(--accent-blue)':'#333'}; font-size:22px;"></i>` : ''}
                            </div>`;
                    });
                });
            }
        }

        function openChat(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-name-top').innerText = nombre;
            const topAvatar = document.getElementById('chat-avatar-top');
            topAvatar.innerHTML = avatar ? `<img src="${avatar}">` : (nombre ? nombre[0] : '?');
            topAvatar.style.background = isGroup ? 'var(--azul-rey)' : '#333';
            
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('btn-group-options').style.display = isGroup ? 'block' : 'none';
            
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            db.ref('messages/' + chatID).off();
            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box'); box.innerHTML = '';
                snap.forEach(m => {
                    const isMe = m.val().sender === me.uid;
                    box.innerHTML += `<div class="bubble" style="align-self:${isMe?'flex-end':'flex-start'}; background:${isMe? 'var(--azul-rey)':'#222'}; border-bottom-right-radius:${isMe?'2px':'18px'}; border-bottom-left-radius:${isMe?'18px':'2px'};">${m.val().text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const val = document.getElementById('msg-input').value; if(!val) return;
            const now = Date.now();
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            
            db.ref('messages/' + chatID).push({ text: val, sender: me.uid, time: now });
            
            if(activeChat.isGroup) {
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members || [];
                    members.forEach(m => {
                        db.ref('recent/' + m + '/' + activeChat.id).update({ lastMsg: val, time: now });
                    });
                });
            } else {
                db.ref('recent/' + me.uid + '/' + activeChat.id).update({lastMsg: val, time: now, nombre: activeChat.nombre, id: activeChat.id, isGroup: false, avatar: activeChat.avatar || ''});
                db.ref('recent/' + activeChat.id + '/' + me.uid).update({lastMsg: val, time: now, nombre: me.nombre, id: me.uid, isGroup: false, avatar: me.avatar || ''});
            }
            document.getElementById('msg-input').value = '';
        }

        function toggleProfile(show) {
            const modal = document.getElementById('profile-modal');
            if(show) {
                document.getElementById('p-name').innerText = me.nombre;
                document.getElementById('p-email').innerText = me.email;
                document.getElementById('custom-avatar-url').value = me.avatar || '';
                modal.style.display = 'flex';
                initAvatarSelector();
            } else { modal.style.display = 'none'; }
        }

        function initAvatarSelector() {
            const container = document.getElementById('avatar-selector');
            container.innerHTML = '';
            defaultAvatars.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = `avatar-option ${me.avatar === url ? 'selected' : ''}`;
                img.onclick = () => {
                    document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                    img.classList.add('selected');
                    document.getElementById('custom-avatar-url').value = url;
                };
                container.appendChild(img);
            });
        }

        async function saveProfile() {
            const newAvatar = document.getElementById('custom-avatar-url').value;
            await db.ref('users/' + me.uid).update({ avatar: newAvatar });
            alert("¡Perfil actualizado!");
            toggleProfile(false);
        }

        function startGroupMode() { isGroupMode = true; selectedUsers = [me.uid]; document.getElementById('group-creation-bar').style.display = 'flex'; setTab('users'); }

        function toggleSelect(uid) {
            const idx = selectedUsers.indexOf(uid);
            if(idx > -1) { if(uid !== me.uid) selectedUsers.splice(idx, 1); }
            else { selectedUsers.push(uid); }
            document.getElementById('selected-count').innerText = `Seleccionados: ${selectedUsers.length}`;
            renderList('users');
        }

        function openGroupNameModal() { if(selectedUsers.length < 2) return alert("Selecciona al menos 1 usuario"); document.getElementById('group-name-modal').style.display = 'flex'; }

        function finishGroupCreation() {
            const name = document.getElementById('new-group-name').value;
            if(!name) return alert("Nombre obligatorio");
            const gId = 'group_' + Date.now();
            const groupData = { id: gId, nombre: name, isGroup: true, members: selectedUsers, admin: me.uid, time: Date.now(), lastMsg: 'Comunidad creada', avatar: '' };
            const updates = {};
            selectedUsers.forEach(uid => updates['/recent/' + uid + '/' + gId] = groupData);
            db.ref().update(updates).then(() => {
                document.getElementById('group-name-modal').style.display = 'none';
                isGroupMode = false;
                setTab('chats');
            });
        }

        function filterLists() {
            const q = document.getElementById('main-search').value.toLowerCase();
            document.querySelectorAll('.list-row').forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function closeChat() { document.getElementById('chat-window').style.display = 'none'; }

        function showChatOptions() {
            db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', snap => {
                const data = snap.val();
                if(data.admin === me.uid) {
                    if(confirm("Eres Admin. ¿Eliminar grupo para todos?")) {
                        const updates = {};
                        data.members.forEach(m => updates['/recent/' + m + '/' + activeChat.id] = null);
                        db.ref().update(updates).then(closeChat);
                    }
                } else {
                    if(confirm("¿Salir del grupo?")) db.ref('recent/' + me.uid + '/' + activeChat.id).remove().then(closeChat);
                }
            });
        }
    </script>
</body>
</html>
