<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; --online: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        /* HEADER */
        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; }
        .logo-text { font-size: 24px; font-weight: 800; }
        .logo-llutid { color: var(--azul-rey); }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        /* LISTA DE CHATS */
        .content-scroll { height: calc(100vh - 230px); overflow-y: auto; padding-bottom: 80px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; position: relative; }
        
        .avatar { width: 52px; height: 52px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; position: relative; border: 1px solid #222; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .online-dot { width: 13px; height: 13px; background: var(--online); border: 2px solid #000; border-radius: 50%; position: absolute; bottom: 2px; right: 2px; display: none; }

        /* VENTANA DE CHAT */
        .full-screen { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        #msg-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111 1px, transparent 1px); background-size: 20px 20px; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; max-width: 78%; font-size: 14px; line-height: 1.4; color: white; }
        .bubble.me { align-self: flex-end; background: var(--azul-rey); border-bottom-right-radius: 4px; }
        .bubble.other { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 11px; font-weight: bold; color: #00a2ff; display: block; margin-bottom: 3px; }

        /* INPUT DE TEXTO (UBICACIÓN CORREGIDA) */
        .chat-footer { position: absolute; bottom: 85px; left: 10px; right: 10px; display: flex; gap: 10px; background: rgba(15, 20, 25, 0.9); backdrop-filter: blur(10px); padding: 10px; border-radius: 30px; z-index: 3100; border: 1px solid #333; }
        .chat-footer input { flex: 1; background: #1a1a1a; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--azul-rey); width: 45px; height: 45px; border-radius: 50%; border: none; color: white; flex-shrink: 0; cursor: pointer; }

        /* BARRA DE NAVEGACIÓN INFERIOR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; display: flex; background: #0b141a; border-top: 1px solid #222; z-index: 4000; align-items: center; }
        .bottom-nav button { flex: 1; background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 4px; }
        .btn-active { color: var(--accent-blue) !important; }

        /* MODALES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #333; }
        .logo-opt { width: 65px; height: 65px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .logo-opt.selected { border-color: var(--accent-blue); transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="auth-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:30px;">
        <h1 class="logo-text"><span class="logo-llutid">Llutid</span>+</h1>
        <div style="width:100%; max-width: 300px; margin-top:30px;">
            <input type="text" id="reg-name" placeholder="Tu Nombre" style="width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid #333; background:#111; color:white;">
            <input type="email" id="reg-email" placeholder="Correo" style="width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid #333; background:#111; color:white;">
            <input type="password" id="reg-pin" placeholder="PIN" style="width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:1px solid #333; background:#111; color:white;">
            <button onclick="handleAuth()" style="width:100%; padding:16px; background:var(--azul-rey); color:white; border:none; border-radius:12px; font-weight:bold;">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="group-bar" style="display:none; background:var(--azul-rey); padding:15px; justify-content:space-between; align-items:center;">
            <span id="sel-txt" style="font-weight:bold;">Seleccionados: 0</span>
            <button onclick="document.getElementById('group-name-modal').style.display='flex'" style="background:white; color:black; border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">CONTINUAR</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span>+</div>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-users" onclick="startGroupMode()" style="font-size:20px; cursor:pointer;"></i>
                    <i class="fas fa-user-circle" onclick="openProfile()" style="font-size:22px; cursor:pointer;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="t-chats" onclick="setTab('chats')">CHATS</div>
                <div class="tab" id="t-users" onclick="setTab('users')">USUARIOS</div>
            </div>
        </div>
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="header" style="display:flex; align-items:center; gap:12px;">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="padding:10px;"></i>
            <div id="chat-avatar-top" class="avatar" style="width:40px; height:40px; margin:0;"></div>
            <div style="flex:1">
                <div id="chat-name-top" style="font-weight:bold; font-size:16px;"></div>
                <div id="chat-status-top" style="font-size:11px; color:var(--online);">Activo</div>
            </div>
        </div>
        <div id="msg-box"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." oninput="updateTyping(true)">
            <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="text-align:center;">Crear Comunidad</h3>
            <input type="text" id="gn-input" placeholder="Nombre de la comunidad..." style="width:100%; padding:14px; margin:20px 0; border-radius:12px; background:#111; color:white; border:1px solid #333;">
            <p style="font-size:13px; margin-bottom:12px; color:#aaa;">Selecciona un logo:</p>
            <div style="display:flex; justify-content:space-around; margin-bottom:25px;">
                <img src="https://cdn-icons-png.freepik.com/512/6387/6387938.png" class="logo-opt" onclick="selLogo(this)">
                <img src="https://cdn-icons-png.freepik.com/512/8224/8224098.png" class="logo-opt" onclick="selLogo(this)">
                <img src="https://www.clipartmax.com/png/small/51-515668_download-icon-group-chat-icon-png.png" class="logo-opt" onclick="selLogo(this)">
            </div>
            <button onclick="confirmGroup()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:12px; font-weight:bold;">CREAR AHORA</button>
            <button onclick="document.getElementById('group-name-modal').style.display='none'" style="width:100%; margin-top:10px; background:none; border:none; color:gray;">Cancelar</button>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Mi Perfil</h3>
            <div id="avatar-preview" class="avatar" style="width:80px; height:80px; margin:20px auto;"></div>
            <input type="text" id="custom-url" placeholder="URL de tu foto..." style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:10px;">
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:12px; margin-top:20px;">GUARDAR</button>
            <button onclick="auth.signOut()" style="width:100%; margin-top:10px; color:red; background:none; border:none;">Cerrar Sesión</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximos.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [], typingTimeout, selectedLogo = "";

        // AUTH CONTROL
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display='block';
                        document.getElementById('auth-screen').style.display='none';
                        db.ref('users/'+me.uid+'/online').set(true);
                        db.ref('users/'+me.uid+'/online').onDisconnect().set(false);
                        setTab('chats');
                    }
                });
            } else {
                document.getElementById('auth-screen').style.display='flex';
            }
        });

        async function handleAuth() {
            const email = document.getElementById('reg-email').value;
            const pin = document.getElementById('reg-pin').value;
            const name = document.getElementById('reg-name').value;
            if(!email || !pin) return;
            try { await auth.signInWithEmailAndPassword(email, pin); } catch {
                const res = await auth.createUserWithEmailAndPassword(email, pin);
                await db.ref('users/' + res.user.uid).set({ 
                    uid: res.user.uid, nombre: name || 'Usuario', email, 
                    avatar: 'https://cdn-icons-png.flaticon.com/512/149/149071.png', online: true 
                });
            }
        }

        // TABS Y LISTAS
        function setTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.getElementById('t-'+t).classList.add('active');
            renderList(t);
        }

        function renderList(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    let chats = [];
                    snap.forEach(c => chats.push(c.val()));
                    
                    // ORDEN DINÁMICO TIPO WHATSAPP
                    chats.sort((a,b) => b.time - a.time).forEach(chat => {
                        const chatID = chat.isGroup ? chat.id : (me.uid < chat.id ? me.uid + chat.id : chat.id + me.uid);
                        
                        // Listener Escribiendo en la lista
                        db.ref('typing/' + chatID).on('value', s => {
                            let w = false; s.forEach(u => { if(u.key !== me.uid && u.val()) w = true; });
                            const el = document.getElementById('sub-'+chat.id);
                            if(el) el.innerHTML = w ? '<span style="color:var(--online)">Escribiendo...</span>' : chat.lastMsg;
                        });

                        list.innerHTML += `
                            <div class="chat-item" onclick="openChat('${chat.id}', '${chat.nombre}', ${chat.isGroup}, '${chat.avatar}')">
                                <div class="avatar">
                                    <img src="${chat.avatar}">
                                    <div id="dot-${chat.id}" class="online-dot"></div>
                                </div>
                                <div style="flex:1">
                                    <b>${chat.nombre}</b>
                                    <br><small id="sub-${chat.id}" style="color:gray">${chat.lastMsg || ''}</small>
                                </div>
                            </div>`;
                        
                        if(!chat.isGroup) {
                            db.ref('users/'+chat.id+'/online').on('value', s => {
                                const d = document.getElementById('dot-'+chat.id);
                                if(d) d.style.display = s.val() ? 'block' : 'none';
                            });
                        }
                    });
                });
            } else {
                db.ref('users').once('value', snap => {
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val();
                        const isS = selectedUsers.includes(u.key);
                        list.innerHTML += `
                            <div class="chat-item" onclick="${isGroupMode ? `toggleSel('${u.key}')` : `openChat('${u.key}', '${user.nombre}', false, '${user.avatar}')`}">
                                <div class="avatar"><img src="${user.avatar}"></div>
                                <div style="flex:1"><b>${user.nombre}</b></div>
                                ${isGroupMode ? `<i class="fas ${isS?'fa-check-circle':'fa-circle'}" style="color:${isS?'var(--accent-blue)':'#333'}; font-size:20px;"></i>`:''}
                            </div>`;
                    });
                });
            }
        }

        // CHAT ENGINE
        function openChat(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-name-top').innerText = nombre;
            document.getElementById('chat-avatar-top').innerHTML = `<img src="${avatar}">`;
            
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            
            // Estado Escribiendo en cabecera
            db.ref('typing/' + chatID).on('value', s => {
                let w = false; s.forEach(u => { if(u.key !== me.uid && u.val()) w = true; });
                document.getElementById('chat-status-top').innerText = w ? 'escribiendo...' : (isGroup ? 'Comunidad' : 'Activo');
            });

            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box'); box.innerHTML = '';
                snap.forEach(m => {
                    const d = m.val();
                    const isMe = d.sender === me.uid;
                    box.innerHTML += `
                        <div class="bubble ${isMe ? 'me' : 'other'}">
                            ${isGroup && !isMe ? `<span class="sender-name">${d.senderName}</span>` : ''}
                            ${d.text}
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const val = input.value.trim(); if(!val) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            const now = Date.now();

            db.ref('messages/' + chatID).push({ text: val, sender: me.uid, senderName: me.nombre, time: now });

            // ACTUALIZACIÓN MULTI-USUARIO (Para que aparezca en recientes de ambos)
            if(activeChat.isGroup) {
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members || [];
                    members.forEach(mId => {
                        db.ref('recent/' + mId + '/' + activeChat.id).update({ lastMsg: val, time: now });
                    });
                });
            } else {
                db.ref('recent/' + me.uid + '/' + activeChat.id).update({ 
                    id: activeChat.id, nombre: activeChat.nombre, avatar: activeChat.avatar, lastMsg: val, time: now, isGroup: false 
                });
                db.ref('recent/' + activeChat.id + '/' + me.uid).update({ 
                    id: me.uid, nombre: me.nombre, avatar: me.avatar, lastMsg: val, time: now, isGroup: false 
                });
            }
            input.value = '';
            updateTyping(false);
        }

        // FUNCIONES GRUPO
        function startGroupMode() { isGroupMode = true; selectedUsers = [me.uid]; document.getElementById('group-bar').style.display = 'flex'; setTab('users'); }
        function toggleSel(uid) {
            const i = selectedUsers.indexOf(uid);
            if(i > -1) selectedUsers.splice(i, 1); else selectedUsers.push(uid);
            document.getElementById('sel-txt').innerText = "Seleccionados: " + (selectedUsers.length - 1);
            renderList('users');
        }
        function selLogo(img) {
            document.querySelectorAll('.logo-opt').forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');
            selectedLogo = img.src;
        }
        function confirmGroup() {
            const name = document.getElementById('gn-input').value;
            if(!name || !selectedLogo) return alert("Nombre y logo requeridos");
            const gid = 'group_' + Date.now();
            const data = { id: gid, nombre: name, isGroup: true, avatar: selectedLogo, members: selectedUsers, lastMsg: 'Comunidad creada', time: Date.now() };
            let ups = {};
            selectedUsers.forEach(u => { ups['recent/' + u + '/' + gid] = data; });
            db.ref().update(ups).then(() => {
                isGroupMode = false;
                document.getElementById('group-bar').style.display = 'none';
                document.getElementById('group-name-modal').style.display = 'none';
                setTab('chats');
            });
        }

        // UTILIDADES
        function updateTyping(s) {
            if(!activeChat) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            db.ref('typing/' + chatID + '/' + me.uid).set(s);
            if(s) { clearTimeout(typingTimeout); typingTimeout = setTimeout(() => updateTyping(false), 2000); }
        }
        function openProfile() {
            document.getElementById('profile-modal').style.display='flex';
            document.getElementById('avatar-preview').innerHTML = `<img src="${me.avatar}">`;
        }
        function saveProfile() {
            const url = document.getElementById('custom-url').value;
            if(url) db.ref('users/'+me.uid+'/avatar').set(url);
            document.getElementById('profile-modal').style.display='none';
        }
        function closeChat() { document.getElementById('chat-window').style.display = 'none'; activeChat = null; }
    </script>
</body>
</html>
