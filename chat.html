<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; --online: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; }
        .logo-text { font-size: 24px; font-weight: 800; }
        .logo-llutid { color: var(--azul-rey); }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        .content-scroll { height: calc(100vh - 230px); overflow-y: auto; padding-bottom: 20px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; position: relative; }
        
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .online-dot { width: 12px; height: 12px; background: var(--online); border: 2px solid #000; border-radius: 50%; position: absolute; bottom: 0; right: 0; }

        /* VENTANA CHAT */
        .full-screen { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        #msg-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 100px; }
        
        .bubble { padding: 8px 14px; border-radius: 15px; max-width: 80%; font-size: 14px; color: white; position: relative; }
        .bubble.me { align-self: flex-end; background: var(--azul-rey); border-bottom-right-radius: 2px; }
        .bubble.other { align-self: flex-start; background: #222; border-bottom-left-radius: 2px; }
        .sender-name { font-size: 11px; font-weight: bold; color: var(--accent-blue); display: block; margin-bottom: 3px; }

        .chat-footer { position: absolute; bottom: 85px; left: 10px; right: 10px; display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 30px; z-index: 3100; }
        .chat-footer input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--azul-rey); width: 45px; height: 45px; border-radius: 50%; border: none; color: white; flex-shrink: 0; }

        /* BARRA INFERIOR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; display: flex; background: #0b141a; border-top: 1px solid #222; z-index: 4000; align-items: center; }
        .bottom-nav button { flex: 1; background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 4px; }
        .btn-active { color: var(--accent-blue) !important; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .group-logo-option { width: 60px; height: 60px; border-radius: 15px; cursor: pointer; border: 2px solid transparent; }
        .group-logo-option.selected { border-color: var(--accent-blue); }
    </style>
</head>
<body>

    <div id="main-app" style="display:none;">
        <div id="group-bar" style="display:none; background:var(--azul-rey); padding:15px; justify-content:space-between; align-items:center;">
            <span id="sel-txt">Seleccionados: 0</span>
            <button onclick="document.getElementById('group-name-modal').style.display='flex'" style="background:white; border:none; padding:8px 15px; border-radius:15px; font-weight:bold;">CREAR</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span>+</div>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-users" onclick="startGroupMode()" style="font-size:20px;"></i>
                    <i class="fas fa-user-circle" onclick="openProfile()" style="font-size:22px;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="t-chats" onclick="setTab('chats')">CHATS</div>
                <div class="tab" id="t-users" onclick="setTab('users')">USUARIOS</div>
            </div>
        </div>
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="header" style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <div id="chat-avatar-top" class="avatar" style="width:38px; height:38px; margin:0;"></div>
            <div>
                <div id="chat-name-top" style="font-weight:bold; font-size:15px;"></div>
                <div id="chat-status-top" style="font-size:11px; color:var(--online);"></div>
            </div>
        </div>
        <div id="msg-box"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Mensaje..." oninput="updateTypingStatus(true)">
            <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Nueva Comunidad</h3>
            <input type="text" id="gn-input" placeholder="Nombre del grupo..." style="width:100%; padding:12px; margin:15px 0; border-radius:10px; background:#111; color:white; border:1px solid #333;">
            <p style="font-size:12px; margin-bottom:10px;">Elige un logo:</p>
            <div style="display:flex; gap:10px; margin-bottom:20px;" id="group-logos">
                <img src="https://cdn-icons-png.freepik.com/512/6387/6387938.png" class="group-logo-option" onclick="selectGroupLogo(this)">
                <img src="https://cdn-icons-png.freepik.com/512/8224/8224098.png" class="group-logo-option" onclick="selectGroupLogo(this)">
                <img src="https://www.clipartmax.com/png/small/51-515668_download-icon-group-chat-icon-png.png" class="group-logo-option" onclick="selectGroupLogo(this)">
            </div>
            <button onclick="confirmGroup()" style="width:100%; padding:12px; background:var(--azul-rey); color:white; border:none; border-radius:10px; font-weight:bold;">CREAR GRUPO</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximos.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        // Configuración Firebase (Usar la misma del paso anterior)
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [], typingT, selectedGroupLogo = "";

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display='block';
                        db.ref('users/'+me.uid+'/online').set(true);
                        db.ref('users/'+me.uid+'/online').onDisconnect().set(false);
                        setTab('chats');
                    }
                });
            } else { location.reload(); }
        });

        function setTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.getElementById('t-'+t).classList.add('active');
            renderList(t);
        }

        function renderList(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    let chats = [];
                    snap.forEach(c => chats.push(c.val()));
                    
                    // ORDEN TIPO WHATSAPP (Último mensaje arriba)
                    chats.sort((a,b) => b.time - a.time).forEach(chat => {
                        const cid = chat.id;
                        const chatID = chat.isGroup ? cid : (me.uid < cid ? me.uid + cid : cid + me.uid);
                        
                        // Listener para "Escribiendo..." en la lista
                        db.ref('typing/' + chatID).on('value', s => {
                            let writing = false;
                            s.forEach(u => { if(u.key !== me.uid && u.val()) writing = true; });
                            const sub = document.getElementById('sub-'+cid);
                            if(sub) sub.innerHTML = writing ? '<span style="color:var(--online)">Escribiendo...</span>' : chat.lastMsg;
                        });

                        list.innerHTML += `
                            <div class="chat-item" onclick="openChat('${chat.id}', '${chat.nombre}', ${chat.isGroup}, '${chat.avatar}')">
                                <div class="avatar">
                                    <img src="${chat.avatar || 'https://via.placeholder.com/50'}">
                                    <div class="online-dot" id="dot-${chat.id}" style="display:none"></div>
                                </div>
                                <div style="flex:1">
                                    <b>${chat.nombre}</b>
                                    <br><small id="sub-${chat.id}" style="color:gray">${chat.lastMsg || ''}</small>
                                </div>
                            </div>`;
                        
                        if(!chat.isGroup) {
                            db.ref('users/'+chat.id+'/online').on('value', s => {
                                const dot = document.getElementById('dot-'+chat.id);
                                if(dot) dot.style.display = s.val() ? 'block' : 'none';
                            });
                        }
                    });
                });
            } else {
                db.ref('users').once('value', snap => {
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val();
                        list.innerHTML += `<div class="chat-item" onclick="${isGroupMode ? `toggleSelect('${u.key}')` : `openChat('${u.key}', '${user.nombre}', false, '${user.avatar}')`}">
                            <div class="avatar"><img src="${user.avatar}"></div>
                            <div style="flex:1"><b>${user.nombre}</b></div>
                        </div>`;
                    });
                });
            }
        }

        function openChat(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-name-top').innerText = nombre;
            document.getElementById('chat-avatar-top').innerHTML = `<img src="${avatar}">`;
            
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            
            // Listener "Escribiendo" en cabecera
            db.ref('typing/' + chatID).on('value', s => {
                let writing = false;
                s.forEach(u => { if(u.key !== me.uid && u.val()) writing = true; });
                document.getElementById('chat-status-top').innerText = writing ? 'escribiendo...' : (isGroup ? 'Comunidad' : 'Activo');
            });

            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box'); box.innerHTML = '';
                snap.forEach(m => {
                    const d = m.val();
                    const isMe = d.sender === me.uid;
                    box.innerHTML += `
                        <div class="bubble ${isMe ? 'me' : 'other'}">
                            ${isGroup && !isMe ? `<span class="sender-name">${d.senderName}</span>` : ''}
                            ${d.text}
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const val = input.value.trim(); if(!val) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            const now = Date.now();

            db.ref('messages/' + chatID).push({ text: val, sender: me.uid, senderName: me.nombre, time: now });

            if(activeChat.isGroup) {
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members;
                    members.forEach(mId => {
                        db.ref('recent/' + mId + '/' + activeChat.id).update({ lastMsg: val, time: now });
                    });
                });
            } else {
                db.ref('recent/' + me.uid + '/' + activeChat.id).update({ id: activeChat.id, nombre: activeChat.nombre, avatar: activeChat.avatar, lastMsg: val, time: now, isGroup: false });
                db.ref('recent/' + activeChat.id + '/' + me.uid).update({ id: me.uid, nombre: me.nombre, avatar: me.avatar, lastMsg: val, time: now, isGroup: false });
            }
            input.value = '';
            updateTypingStatus(false);
        }

        function selectGroupLogo(img) {
            document.querySelectorAll('.group-logo-option').forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');
            selectedGroupLogo = img.src;
        }

        function confirmGroup() {
            const name = document.getElementById('gn-input').value;
            if(!name || !selectedGroupLogo) return alert("Elige nombre y logo");
            const gid = 'group_' + Date.now();
            const gData = { id: gid, nombre: name, isGroup: true, avatar: selectedGroupLogo, members: selectedUsers, lastMsg: 'Comunidad creada', time: Date.now() };
            
            const updates = {};
            selectedUsers.forEach(uId => { updates['recent/' + uId + '/' + gid] = gData; });
            db.ref().update(updates).then(() => {
                isGroupMode = false;
                document.getElementById('group-bar').style.display = 'none';
                document.getElementById('group-name-modal').style.display = 'none';
                setTab('chats');
            });
        }

        function updateTypingStatus(status) {
            if(!activeChat) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            db.ref('typing/' + chatID + '/' + me.uid).set(status);
            if(status) {
                clearTimeout(typingT);
                typingT = setTimeout(() => updateTypingStatus(false), 2000);
            }
        }

        function startGroupMode() { isGroupMode = true; selectedUsers = [me.uid]; document.getElementById('group-bar').style.display = 'flex'; setTab('users'); }
        function toggleSelect(uid) {
            const i = selectedUsers.indexOf(uid);
            if(i > -1) selectedUsers.splice(i, 1); else selectedUsers.push(uid);
            document.getElementById('sel-txt').innerText = "Seleccionados: " + (selectedUsers.length - 1);
            renderList('users');
        }
        function closeChat() { document.getElementById('chat-window').style.display = 'none'; }
    </script>
</body>
</html>
