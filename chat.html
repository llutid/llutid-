<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; --online: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; }
        .logo-text { font-size: 24px; font-weight: 800; }
        .logo-llutid { color: var(--azul-rey); }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        .content-scroll { height: calc(100vh - 230px); overflow-y: auto; padding-bottom: 20px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; position: relative; }
        
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .online-dot { width: 12px; height: 12px; background: var(--online); border: 2px solid #000; border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        .unread-badge { background: var(--accent-blue); color: white; font-size: 10px; min-width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: auto; }

        /* VENTANA CHAT */
        .full-screen { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        #msg-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 100px; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; color: white; }
        .bubble.me { align-self: flex-end; background: var(--azul-rey); }
        .bubble.other { align-self: flex-start; background: #222; }

        /* LA SOLUCIÓN AL INPUT TAPADO: */
        .chat-footer { 
            position: absolute; 
            bottom: 85px; /* Sube para que no lo tape la barra inferior */
            left: 10px; 
            right: 10px; 
            display: flex; 
            gap: 10px; 
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 30px;
            z-index: 3100;
        }
        .chat-footer input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--azul-rey); width: 45px; height: 45px; border-radius: 50%; border: none; color: white; flex-shrink: 0; }

        /* BARRA INFERIOR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; display: flex; background: #0b141a; border-top: 1px solid #222; z-index: 4000; align-items: center; }
        .bottom-nav button { flex: 1; background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 4px; }
        .btn-active { color: var(--accent-blue) !important; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .verified-badge { color: #007bff; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="auth-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <h1 class="logo-text"><span class="logo-llutid">Llutid</span>+</h1>
        <div style="width:80%; margin-top:20px;">
            <input type="text" id="reg-name" placeholder="Nombre" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none;">
            <input type="email" id="reg-email" placeholder="Correo" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none;">
            <input type="password" id="reg-pin" placeholder="PIN" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none;">
            <button onclick="handleAuth()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:8px; font-weight:bold;">ENTRAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="group-bar" style="display:none; background:var(--azul-rey); padding:15px; justify-content:space-between; align-items:center;">
            <span id="sel-txt">Seleccionados: 0</span>
            <button onclick="document.getElementById('group-name-modal').style.display='flex'" style="background:white; border:none; padding:8px 15px; border-radius:15px; font-weight:bold;">CREAR</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span>+</div>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-users" onclick="startGroupMode()" style="font-size:20px;"></i>
                    <i class="fas fa-user-circle" onclick="openProfile()" style="font-size:22px;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="t-chats" onclick="setTab('chats')">CHATS</div>
                <div class="tab" id="t-users" onclick="setTab('users')">USUARIOS</div>
            </div>
        </div>
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="header" style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <div id="chat-avatar-top" class="avatar" style="width:35px; height:35px; margin:0;"></div>
            <div id="chat-name-top" style="font-weight:bold;"></div>
        </div>
        <div id="msg-box"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Mensaje...">
            <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Nombre del Grupo</h3>
            <input type="text" id="gn-input" style="width:100%; padding:12px; margin:15px 0; border-radius:10px; background:#111; color:white; border:1px solid #333;">
            <button onclick="confirmGroup()" style="width:100%; padding:12px; background:var(--azul-rey); color:white; border:none; border-radius:10px; font-weight:bold;">ACEPTAR</button>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Mi Perfil</h3>
            <div id="avatar-preview" class="avatar" style="width:70px; height:70px; margin:15px auto;"></div>
            <div id="picker" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:15px;"></div>
            <input type="text" id="custom-url" placeholder="Pegar URL propia..." style="width:100%; padding:10px; background:#000; color:white; border:1px solid #333; margin-bottom:10px;">
            <button onclick="saveProfile()" style="width:100%; padding:12px; background:var(--azul-rey); color:white; border:none; border-radius:10px;">GUARDAR</button>
            <button onclick="auth.signOut()" style="width:100%; margin-top:10px; color:red; background:none; border:none;">Cerrar Sesión</button>
            <button onclick="document.getElementById('profile-modal').style.display='none'" style="width:100%; margin-top:10px; color:gray; border:none; background:none;">Cancelar</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximos.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [];

        const AVATARS = [
            "https://lafrikileria.com/blog/wp-content/uploads/2023/04/mejores-peliculas-animacion-disney.jpeg",
            "https://i.pinimg.com/236x/ab/93/51/ab9351153c08385a24257ea9f5b33bbc.jpg",
            "https://i.pinimg.com/originals/18/6a/5a/186a5a0a89b7cf476c2f516a873b4355.jpg",
            "https://i.pinimg.com/474x/b3/75/dc/b375dc13bfc16775cdbcce2b8a39fe5f.jpg",
            "https://img.freepik.com/foto-gratis/renderizacion-3d-persona-viendo-pelicula_23-2151169511.jpg?semt=ais_hybrid&w=740&q=80",
            "https://img.freepik.com/fotos-premium/retrato-primer-plano-personaje-masculino-estilizado-dibujos-animados_948873-17113.jpg?semt=ais_hybrid&w=740&q=80",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeP4nwlVmSUrUVmHLW5QOUPUaxXUVIt_kHHA&s",
            "https://i.pinimg.com/originals/96/7c/e9/967ce909c5596137a266e9640eafe9a5.jpg"
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display='block';
                        document.getElementById('auth-screen').style.display='none';
                        db.ref('users/'+me.uid+'/online').set(true);
                        db.ref('users/'+me.uid+'/online').onDisconnect().set(false);
                        setTab('chats');
                    }
                });
            } else {
                document.getElementById('main-app').style.display='none';
                document.getElementById('auth-screen').style.display='flex';
            }
        });

        async function handleAuth() {
            const email = document.getElementById('reg-email').value;
            const pin = document.getElementById('reg-pin').value;
            const name = document.getElementById('reg-name').value;
            try { await auth.signInWithEmailAndPassword(email, pin); } catch {
                const res = await auth.createUserWithEmailAndPassword(email, pin);
                await db.ref('users/' + res.user.uid).set({ uid: res.user.uid, nombre: name, email, avatar: AVATARS[0] });
            }
        }

        function setTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.getElementById('t-'+t).classList.add('active');
            renderList(t);
        }

        function renderList(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    snap.forEach(c => {
                        const chat = c.val();
                        const isLlutid = chat.id === 'llutid_oficial' || chat.email === 'llutidoficial@gmail.com';
                        const avatarUrl = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : chat.avatar;
                        list.innerHTML += `
                            <div class="chat-item" onclick="openChat('${chat.id}', '${chat.nombre}', ${chat.isGroup}, '${avatarUrl}')">
                                <div class="avatar">${avatarUrl ? `<img src="${avatarUrl}">` : chat.nombre[0]}</div>
                                <div style="flex:1">
                                    <b>${chat.nombre} ${isLlutid ? '<i class="fas fa-check-circle verified-badge"></i>':''}</b>
                                    <br><small style="color:gray">${chat.lastMsg || ''}</small>
                                </div>
                            </div>`;
                    });
                });
            } else {
                db.ref('users').once('value', snap => {
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val();
                        const isLlutid = user.email === 'llutidoficial@gmail.com';
                        const avatarUrl = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : user.avatar;
                        const isSel = selectedUsers.includes(u.key);
                        list.innerHTML += `
                            <div class="chat-item" onclick="${isGroupMode ? `toggleSelect('${u.key}')` : `openChat('${u.key}', '${user.nombre}', false, '${avatarUrl}')`}">
                                <div class="avatar">
                                    ${avatarUrl ? `<img src="${avatarUrl}">` : user.nombre[0]}
                                    ${user.online ? '<div class="online-dot"></div>' : ''}
                                </div>
                                <div style="flex:1"><b>${user.nombre} ${isLlutid ? '<i class="fas fa-check-circle verified-badge"></i>':''}</b></div>
                                ${isGroupMode ? `<i class="fas ${isSel?'fa-check-circle':'fa-circle'}" style="color:${isSel?'var(--accent-blue)':'#333'}; font-size:20px;"></i>`:''}
                            </div>`;
                    });
                });
            }
        }

        function openChat(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-name-top').innerText = nombre;
            document.getElementById('chat-avatar-top').innerHTML = avatar ? `<img src="${avatar}">` : nombre[0];
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            
            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box'); box.innerHTML = '';
                snap.forEach(m => {
                    const d = m.val();
                    box.innerHTML += `<div class="bubble ${d.sender===me.uid?'me':'other'}">${d.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const val = input.value.trim(); if(!val) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            
            // Guardar mensaje
            db.ref('messages/' + chatID).push({ text: val, sender: me.uid, time: Date.now() });

            // ACTUALIZACIÓN DE "RECIENTES" PARA AMBOS (Arregla el bug de desaparición)
            if(activeChat.isGroup) {
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members || [];
                    members.forEach(mId => {
                        db.ref('recent/' + mId + '/' + activeChat.id).update({ lastMsg: val, time: Date.now() });
                    });
                });
            } else {
                // Info para mi lista
                db.ref('recent/' + me.uid + '/' + activeChat.id).update({
                    id: activeChat.id, nombre: activeChat.nombre, avatar: activeChat.avatar || '', lastMsg: val, time: Date.now(), isGroup: false
                });
                // Info para la lista del otro (Esto hace que le aparezca al otro usuario)
                db.ref('recent/' + activeChat.id + '/' + me.uid).update({
                    id: me.uid, nombre: me.nombre, avatar: me.avatar || '', lastMsg: val, time: Date.now(), isGroup: false
                });
            }
            input.value = '';
        }

        // GRUPOS ARREGLADOS
        function startGroupMode() {
            isGroupMode = true;
            selectedUsers = [me.uid];
            document.getElementById('group-bar').style.display = 'flex';
            setTab('users');
        }

        function toggleSelect(uid) {
            const i = selectedUsers.indexOf(uid);
            if(i > -1) selectedUsers.splice(i, 1); else selectedUsers.push(uid);
            document.getElementById('sel-txt').innerText = "Seleccionados: " + (selectedUsers.length - 1);
            renderList('users');
        }

        function confirmGroup() {
            const name = document.getElementById('gn-input').value; if(!name) return;
            const gid = 'group_' + Date.now();
            const gData = { id: gid, nombre: name, isGroup: true, members: selectedUsers, lastMsg: 'Grupo creado', time: Date.now() };
            
            const updates = {};
            selectedUsers.forEach(uId => {
                updates['recent/' + uId + '/' + gid] = gData;
            });

            db.ref().update(updates).then(() => {
                isGroupMode = false;
                document.getElementById('group-bar').style.display = 'none';
                document.getElementById('group-name-modal').style.display = 'none';
                setTab('chats');
            });
        }

        // PERFIL
        function openProfile() {
            document.getElementById('profile-modal').style.display='flex';
            document.getElementById('avatar-preview').innerHTML = me.avatar ? `<img src="${me.avatar}">` : me.nombre[0];
            const p = document.getElementById('picker'); p.innerHTML = '';
            AVATARS.forEach(url => {
                p.innerHTML += `<img src="${url}" style="width:100%; border-radius:50%; cursor:pointer;" onclick="selectAv('${url}')">`;
            });
        }
        function selectAv(url) { 
            document.getElementById('custom-url').value = url; 
            document.getElementById('avatar-preview').innerHTML = `<img src="${url}">`;
        }
        async function saveProfile() {
            const url = document.getElementById('custom-url').value;
            if(url) await db.ref('users/'+me.uid).update({avatar: url});
            document.getElementById('profile-modal').style.display='none';
        }

        function closeChat() { document.getElementById('chat-window').style.display='none'; }
    </script>
</body>
</html>
