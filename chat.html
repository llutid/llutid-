<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+ PRO - Estable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent-blue: #007bff; --azul-rey: #0041C2; --bg-dark: #000000; --bg-panel: #0b141a; --online: #25d366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }

        /* HEADER */
        .header { padding: 20px; background: var(--bg-panel); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo-text { font-size: 24px; font-weight: 800; }
        .logo-llutid { color: var(--azul-rey); }
        .top-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab { color: #aeb0b5; font-weight: 600; cursor: pointer; padding-bottom: 5px; font-size: 14px; }
        .tab.active { color: var(--azul-rey); border-bottom: 2px solid var(--azul-rey); }

        /* LISTAS Y ITEMS */
        .content-scroll { height: calc(100vh - 220px); overflow-y: auto; padding-bottom: 100px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #111; cursor: pointer; position: relative; transition: background 0.2s; }
        .chat-item:active { background: #111; }
        
        .avatar { width: 52px; height: 52px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; position: relative; border: 1px solid #222; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .online-dot { width: 14px; height: 14px; background: var(--online); border: 2px solid var(--bg-dark); border-radius: 50%; position: absolute; bottom: 2px; right: 2px; z-index: 10; }
        .unread-badge { background: var(--accent-blue); color: white; font-size: 11px; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; padding: 0 5px; }

        /* VENTANA DE CHAT */
        .full-screen { position: fixed; inset: 0; background: #000; z-index: 2500; display: none; flex-direction: column; }
        .chat-header { display: flex; align-items: center; padding: 15px; background: var(--bg-panel); border-bottom: 1px solid #222; gap: 12px; }
        #msg-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 6px; background-image: radial-gradient(#111 1px, transparent 1px); background-size: 20px 20px; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; max-width: 75%; font-size: 14px; line-height: 1.4; position: relative; }
        .bubble.me { align-self: flex-end; background: var(--azul-rey); border-bottom-right-radius: 4px; }
        .bubble.other { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .sender-name-tag { font-size: 10px; font-weight: bold; color: #aaa; margin-bottom: 3px; display: block; }

        .verified-badge { color: #007bff; font-size: 13px; margin-left: 4px; }

        /* FOOTER CHAT */
        .chat-footer { padding: 15px; display: flex; gap: 10px; background: var(--bg-dark); }
        .chat-footer input { flex: 1; background: #1a1d21; border: 1px solid #333; padding: 12px 18px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--azul-rey); width: 48px; height: 48px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* BARRA NAVEGACIÓN */
        .bottom-nav { position: fixed; left: 15px; right: 15px; bottom: 15px; height: 70px; display: flex; justify-content: space-around; align-items: center; background: rgba(15, 15, 17, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; z-index: 4000; }
        .bottom-nav button { background: none; border: none; color: #aeb0b5; display: flex; flex-direction: column; align-items: center; font-size: 11px; flex: 1; gap: 4px; cursor: pointer; }
        .btn-active { color: var(--accent-blue) !important; }

        /* MODALES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--bg-panel); padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; border: 1px solid #333; }
        .avatar-option { width: 65px; height: 65px; border-radius: 50%; cursor: pointer; object-fit: cover; border: 2px solid transparent; transition: 0.2s; }
        .avatar-option:hover { border-color: var(--accent-blue); transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="text-align: center;">Configurar Perfil</h2>
            <div id="p-avatar-preview" class="avatar" style="width:80px; height:80px; margin: 20px auto;"></div>
            <div id="avatar-picker" style="display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-bottom: 20px;"></div>
            <input type="text" id="custom-avatar-url" placeholder="O pega una URL de imagen..." style="width:100%; padding:12px; background:#000; color:white; border:1px solid #333; border-radius:12px; margin-bottom: 15px;">
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:12px; font-weight:bold;">GUARDAR CAMBIOS</button>
            <button onclick="auth.signOut()" style="width:100%; margin-top:15px; color:#ff4444; background:none; border:none; font-weight: bold;">Cerrar Sesión</button>
            <button onclick="closeModal('profile-modal')" style="width:100%; margin-top:10px; color:gray; background:none; border:none;">Cancelar</button>
        </div>
    </div>

    <div id="group-name-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="text-align: center;">Nombre de la Comunidad</h3>
            <p style="font-size: 12px; color: gray; text-align: center; margin-top: 5px;">Se creará una comunidad pública.</p>
            <input type="text" id="new-group-name" placeholder="Ej: Amigos Llutid" style="width:100%; padding:15px; margin:20px 0; border-radius:12px; background:#111; color:white; border:1px solid #333; outline: none;">
            <button onclick="finishGroupCreation()" style="width:100%; padding:15px; background:var(--azul-rey); color:white; border:none; border-radius:12px; font-weight:bold;">CREAR AHORA</button>
            <button onclick="closeModal('group-name-modal')" style="width:100%; margin-top:15px; color:gray; background:none; border:none;">Cancelar</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="group-creation-bar" style="display:none; background:var(--azul-rey); padding:15px 20px; justify-content:space-between; align-items:center;">
            <span id="selected-count" style="font-weight: bold;">Seleccionados: 0</span>
            <button onclick="openGroupNaming()" style="background:white; color:black; border:none; padding:10px 25px; border-radius:25px; font-weight:bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">CONTINUAR</button>
        </div>

        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="logo-text"><span class="logo-llutid">Llutid</span><span style="color:white">+</span></div>
                <div style="display:flex; gap:22px;">
                    <i class="fas fa-users-cog" onclick="startGroupMode()" style="font-size:22px; cursor: pointer;"></i>
                    <i class="fas fa-user-circle" onclick="openProfile()" style="font-size:22px; cursor: pointer;"></i>
                </div>
            </div>
            <div class="top-tabs">
                <div class="tab active" id="tab-chats" onclick="changeTab('chats')">CHATS</div>
                <div class="tab" id="tab-users" onclick="changeTab('users')">USUARIOS</div>
            </div>
        </div>

        <div style="padding:15px 20px;"><input type="text" id="main-search" placeholder="Buscar chat o persona..." onkeyup="filterItems()" style="width:100%; padding:14px; border-radius:12px; background:#111; border:1px solid #333; color:white; outline: none;"></div>
        
        <div id="content-list" class="content-scroll"></div>
    </div>

    <div id="auth-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:30px;">
        <div class="logo-text" style="font-size:45px; margin-bottom: 10px;"><span class="logo-llutid">Llutid</span><span style="color:white">+</span></div>
        <p style="color: #666; margin-bottom: 40px;">Tu conexión en tiempo real</p>
        <div style="width:100%; max-width: 320px;">
            <input type="text" id="reg-name" placeholder="Nombre completo" style="width:100%; padding:15px; margin-bottom:12px; border-radius:12px; background:#111; border:1px solid #333; color:white;">
            <input type="email" id="reg-email" placeholder="Correo electrónico" style="width:100%; padding:15px; margin-bottom:12px; border-radius:12px; background:#111; border:1px solid #333; color:white;">
            <input type="password" id="reg-pin" placeholder="PIN de 6 dígitos" style="width:100%; padding:15px; margin-bottom:25px; border-radius:12px; background:#111; border:1px solid #333; color:white;">
            <button onclick="handleAuth()" style="width:100%; padding:16px; background:var(--azul-rey); color:white; border:none; border-radius:12px; font-weight:bold; font-size:16px;">INICIAR SESIÓN / REGISTRO</button>
        </div>
    </div>

    <div id="chat-window" class="full-screen">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="padding:10px; cursor: pointer;"></i>
            <div id="chat-h-avatar" class="avatar" style="width:42px; height:42px; margin-right:0;"></div>
            <div style="flex:1">
                <div id="chat-name-display" style="font-weight:bold; font-size:16px; display: flex; align-items: center;"></div>
                <div id="chat-status-display" style="font-size:11px; color:var(--online);"></div>
            </div>
        </div>
        <div id="msg-box"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMessage()" oninput="handleTypingEvent(true)">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
        <button onclick="location.href='proximos.html'"><i class="fas fa-calendar"></i><span>Próximos</span></button>
        <button class="btn-active" onclick="location.reload()"><i class="fas fa-broadcast-tower"></i><span>En Vivo</span></button>
        <button onclick="location.href='home.html'"><i class="fas fa-search"></i><span>Buscar</span></button>
    </nav>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBgpP_grqWlpqgxYDgrspAt1CqMiIl50eU",
            authDomain: "chat-ll-26334.firebaseapp.com",
            databaseURL: "https://chat-ll-26334-default-rtdb.firebaseio.com",
            projectId: "chat-ll-26334",
            storageBucket: "chat-ll-26334.firebasestorage.app",
            messagingSenderId: "1062883694774",
            appId: "1:1062883694774:web:f6ce82bc42cdf64866ae17"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let me = null, activeChat = null, isGroupMode = false, selectedUsers = [], typingTimeout;

        const AVATARS = [
            "https://lafrikileria.com/blog/wp-content/uploads/2023/04/mejores-peliculas-animacion-disney.jpeg",
            "https://i.pinimg.com/236x/ab/93/51/ab9351153c08385a24257ea9f5b33bbc.jpg",
            "https://i.pinimg.com/originals/18/6a/5a/186a5a0a89b7cf476c2f516a873b4355.jpg",
            "https://i.pinimg.com/474x/b3/75/dc/b375dc13bfc16775cdbcce2b8a39fe5f.jpg",
            "https://img.freepik.com/foto-gratis/renderizacion-3d-persona-viendo-pelicula_23-2151169511.jpg?semt=ais_hybrid&w=740&q=80",
            "https://img.freepik.com/fotos-premium/retrato-primer-plano-personaje-masculino-estilizado-dibujos-animados_948873-17113.jpg?semt=ais_hybrid&w=740&q=80",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeP4nwlVmSUrUVmHLW5QOUPUaxXUVIt_kHHA&s",
            "https://i.pinimg.com/originals/96/7c/e9/967ce909c5596137a266e9640eafe9a5.jpg"
        ];

        // LOGICA DE AUTH Y ESTADO INICIAL
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('auth-screen').style.display = 'none';
                        db.ref('users/' + me.uid).update({ online: true });
                        db.ref('users/' + me.uid + '/online').onDisconnect().set(false);
                        changeTab('chats');
                    }
                });
            } else {
                document.getElementById('main-app').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        async function handleAuth() {
            const email = document.getElementById('reg-email').value;
            const pin = document.getElementById('reg-pin').value;
            const name = document.getElementById('reg-name').value || email.split('@')[0];
            if(!email || !pin) return alert("Completa los datos");
            try { 
                await auth.signInWithEmailAndPassword(email, pin); 
            } catch {
                try {
                    const res = await auth.createUserWithEmailAndPassword(email, pin);
                    await db.ref('users/' + res.user.uid).set({ uid: res.user.uid, nombre: name, email, avatar: AVATARS[0], online: true });
                } catch(e) { alert("Error: " + e.message); }
            }
        }

        // RENDERIZADO DE LISTAS (CHATS Y USUARIOS)
        function renderContent(type) {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            if(type === 'chats') {
                db.ref('recent/' + me.uid).on('value', snap => {
                    list.innerHTML = '';
                    let chats = [];
                    snap.forEach(c => chats.push(c.val()));
                    chats.sort((a,b) => (b.time || 0) - (a.time || 0));

                    chats.forEach(chat => {
                        const isLlutid = chat.email === 'llutidoficial@gmail.com' || chat.id === 'llutid_oficial';
                        const avatarSrc = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : (chat.avatar || '');
                        
                        // Escuchar online para chats 1 a 1
                        if(!chat.isGroup) {
                            db.ref('users/' + chat.id + '/online').on('value', s => {
                                const dot = document.getElementById('dot-list-'+chat.id);
                                if(dot) dot.style.display = s.val() ? 'block' : 'none';
                            });
                        }

                        list.innerHTML += `
                            <div class="chat-item list-row" onclick="openChatRoom('${chat.id}', '${chat.nombre}', ${chat.isGroup}, '${avatarSrc}')">
                                <div class="avatar">
                                    ${avatarSrc ? `<img src="${avatarSrc}">` : chat.nombre[0]}
                                    <div class="online-dot" id="dot-list-${chat.id}" style="display:none"></div>
                                </div>
                                <div style="flex:1">
                                    <div style="display:flex; align-items:center;">
                                        <b>${chat.nombre}</b> ${isLlutid ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}
                                    </div>
                                    <small id="last-msg-${chat.id}" style="color:gray; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 200px;">${chat.lastMsg || 'Sin mensajes'}</small>
                                </div>
                                ${chat.unreadCount > 0 ? `<div class="unread-badge">${chat.unreadCount}</div>` : ''}
                            </div>`;
                        
                        // Listener para "Escribiendo..." en la lista principal
                        const chatID = chat.isGroup ? chat.id : (me.uid < chat.id ? me.uid + chat.id : chat.id + me.uid);
                        db.ref('typing/' + chatID).on('value', s => {
                            let isT = false; s.forEach(u => { if(u.key !== me.uid && u.val()) isT = true; });
                            const el = document.getElementById('last-msg-'+chat.id);
                            if(el) el.innerHTML = isT ? '<span style="color:var(--online)">Escribiendo...</span>' : (chat.lastMsg || '');
                        });
                    });
                });
            } else {
                db.ref('users').once('value', snap => {
                    snap.forEach(u => {
                        if(u.key === me.uid) return;
                        const user = u.val();
                        const isLlutid = user.email === 'llutidoficial@gmail.com';
                        const isSelected = selectedUsers.includes(u.key);
                        const avatarUrl = isLlutid ? "https://thumbs.dreamstime.com/b/dise%C3%B1o-de-icono-usuario-verificado-vector-219719498.jpg" : user.avatar;
                        
                        list.innerHTML += `
                            <div class="chat-item list-row" onclick="${isGroupMode ? `toggleSelection('${u.key}')` : `openChatRoom('${user.uid}', '${user.nombre}', false, '${avatarUrl}')`}">
                                <div class="avatar">
                                    ${avatarUrl ? `<img src="${avatarUrl}">` : user.nombre[0]}
                                    ${user.online ? '<div class="online-dot"></div>' : ''}
                                </div>
                                <div style="flex:1">
                                    <b>${user.nombre}</b> ${isLlutid ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}
                                </div>
                                ${isGroupMode ? `<i class="fas ${isSelected ? 'fa-check-circle' : 'fa-circle'}" style="color:${isSelected ? 'var(--accent-blue)' : '#333'}; font-size:22px;"></i>` : ''}
                            </div>`;
                    });
                });
            }
        }

        // VENTANA DE CHAT LOGICA
        function openChatRoom(id, nombre, isGroup, avatar) {
            activeChat = { id, nombre, isGroup, avatar };
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-name-display').innerHTML = nombre + (nombre.includes('Llutid') ? ' <i class="fas fa-check-circle verified-badge"></i>' : '');
            document.getElementById('chat-h-avatar').innerHTML = avatar ? `<img src="${avatar}">` : nombre[0];
            
            const chatID = isGroup ? id : (me.uid < id ? me.uid + id : id + me.uid);
            
            // Limpiar notificaciones
            db.ref('recent/' + me.uid + '/' + id + '/unreadCount').set(0);

            // Estado de la cabecera
            if(!isGroup) {
                db.ref('users/' + id + '/online').on('value', s => {
                    document.getElementById('chat-status-display').innerText = s.val() ? 'En línea' : 'Desconectado';
                });
            } else {
                document.getElementById('chat-status-display').innerText = 'Comunidad Llutid';
            }

            // Escuchar mensajes
            db.ref('messages/' + chatID).on('value', snap => {
                const box = document.getElementById('msg-box');
                box.innerHTML = '';
                snap.forEach(m => {
                    const data = m.val();
                    const isMe = data.sender === me.uid;
                    box.innerHTML += `
                        <div class="bubble ${isMe ? 'me' : 'other'}">
                            ${isGroup && !isMe ? `<span class="sender-name-tag">${data.senderName}</span>` : ''}
                            ${data.text}
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });

            // Escuchar escribiendo en el chat abierto
            db.ref('typing/' + chatID).on('value', s => {
                let isWriting = false;
                s.forEach(u => { if(u.key !== me.uid && u.val()) isWriting = true; });
                if(isWriting) document.getElementById('chat-status-display').innerText = 'escribiendo...';
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const val = input.value.trim();
            if(!val || !activeChat) return;
            
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            const now = Date.now();
            
            // 1. Guardar mensaje
            db.ref('messages/' + chatID).push({
                text: val,
                sender: me.uid,
                senderName: me.nombre,
                time: now
            });

            // 2. Actualizar lista de chats (Recientes)
            if(activeChat.isGroup) {
                // Para grupos, actualizar a todos los miembros
                db.ref('recent/' + me.uid + '/' + activeChat.id).once('value', s => {
                    const members = s.val().members || [];
                    members.forEach(memberId => {
                        db.ref('recent/' + memberId + '/' + activeChat.id).update({
                            lastMsg: val,
                            time: now
                        });
                        if(memberId !== me.uid) {
                            db.ref('recent/' + memberId + '/' + activeChat.id + '/unreadCount').transaction(c => (c || 0) + 1);
                        }
                    });
                });
            } else {
                // Chat 1 a 1: Actualizar para Mi y para el Otro
                const myRecent = { id: activeChat.id, nombre: activeChat.nombre, avatar: activeChat.avatar || '', lastMsg: val, time: now, isGroup: false };
                const otherRecent = { id: me.uid, nombre: me.nombre, avatar: me.avatar || '', lastMsg: val, time: now, isGroup: false };
                
                db.ref('recent/' + me.uid + '/' + activeChat.id).update(myRecent);
                db.ref('recent/' + activeChat.id + '/' + me.uid).update(otherRecent);
                db.ref('recent/' + activeChat.id + '/' + me.uid + '/unreadCount').transaction(c => (c || 0) + 1);
            }

            input.value = '';
            handleTypingEvent(false);
        }

        // GESTIÓN DE GRUPOS
        function startGroupMode() {
            isGroupMode = true;
            selectedUsers = [me.uid]; // Incluirme siempre
            document.getElementById('group-creation-bar').style.display = 'flex';
            changeTab('users');
        }

        function toggleSelection(uid) {
            if(uid === me.uid) return;
            const idx = selectedUsers.indexOf(uid);
            if(idx > -1) selectedUsers.splice(idx, 1);
            else selectedUsers.push(uid);
            document.getElementById('selected-count').innerText = "Seleccionados: " + (selectedUsers.length - 1);
            renderContent('users');
        }

        function openGroupNaming() {
            if(selectedUsers.length < 2) return alert("Selecciona al menos 1 persona más");
            document.getElementById('group-name-modal').style.display = 'flex';
        }

        function finishGroupCreation() {
            const name = document.getElementById('new-group-name').value;
            if(!name) return alert("Escribe un nombre para el grupo");
            
            const groupId = 'group_' + Date.now();
            const groupObj = {
                id: groupId,
                nombre: name,
                isGroup: true,
                members: selectedUsers,
                lastMsg: 'Comunidad creada',
                time: Date.now(),
                admin: me.uid
            };

            const updates = {};
            selectedUsers.forEach(uId => {
                updates['recent/' + uId + '/' + groupId] = groupObj;
            });

            db.ref().update(updates).then(() => {
                closeModal('group-name-modal');
                isGroupMode = false;
                document.getElementById('group-creation-bar').style.display = 'none';
                changeTab('chats');
            });
        }

        // PERFIL Y CONFIGURACIÓN
        function openProfile() {
            const p = document.getElementById('profile-modal');
            p.style.display = 'flex';
            document.getElementById('p-avatar-preview').innerHTML = me.avatar ? `<img src="${me.avatar}">` : me.nombre[0];
            const picker = document.getElementById('avatar-picker');
            picker.innerHTML = '';
            AVATARS.forEach(url => {
                picker.innerHTML += `<img src="${url}" class="avatar-option" onclick="selectThisAvatar('${url}')">`;
            });
        }

        function selectThisAvatar(url) {
            document.getElementById('custom-avatar-url').value = url;
            document.getElementById('p-avatar-preview').innerHTML = `<img src="${url}">`;
        }

        async function saveProfile() {
            const url = document.getElementById('custom-avatar-url').value;
            if(!url) return;
            await db.ref('users/' + me.uid).update({ avatar: url });
            closeModal('profile-modal');
        }

        // UTILIDADES
        function handleTypingEvent(status) {
            if(!activeChat) return;
            const chatID = activeChat.isGroup ? activeChat.id : (me.uid < activeChat.id ? me.uid + activeChat.id : activeChat.id + me.uid);
            db.ref('typing/' + chatID + '/' + me.uid).set(status);
            if(status) {
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => handleTypingEvent(false), 2500);
            }
        }

        function changeTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            renderContent(t);
        }

        function filterItems() {
            const q = document.getElementById('main-search').value.toLowerCase();
            document.querySelectorAll('.list-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function closeChat() { document.getElementById('chat-window').style.display = 'none'; activeChat = null; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
