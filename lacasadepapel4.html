<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>LLUTID+ | La Casa de Papel T4</title>
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Netflix Sans', 'Roboto', sans-serif;
            background-color: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden;
        }

        /* Intro Original */
        .intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #000, #0a0a0a);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .logo-container-intro {
            font-size: 4rem; font-weight: 800; color: white; opacity: 0;
            animation: fadeInZoom 2s ease-out forwards, fadeOut 1s ease-in forwards 4s;
            font-family: 'Montserrat', sans-serif;
        }
        @keyframes fadeInZoom { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { to { opacity: 0; transform: scale(1.05); } }

        .main-content { display: none; }

        /* Header */
        header {
            padding: 15px 20px; background: rgba(0,0,0,0.9);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header-logo { font-size: 1.5rem; font-weight: 900; color: #1e90ff; text-decoration: none; }
        .header-logo span { color: #fff; }

        /* Trailer */
        .video-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; }
        .video-container iframe { width: 100%; height: 100%; border: none; pointer-events: none; }

        /* Info */
        .info-section { padding: 20px; background: #000; }
        .badges-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .badge-serie { background: #1e90ff; padding: 4px 10px; border-radius: 3px; font-size: 0.75rem; font-weight: 900; }
        .badge-parte { background: #e50914; padding: 4px 10px; border-radius: 3px; font-size: 0.75rem; font-weight: 900; }
        .serie-title { font-size: 2.2rem; font-weight: 900; margin: 0 0 10px 0; }
        .serie-desc { color: #aaa; font-size: 0.95rem; line-height: 1.4; max-width: 800px; margin-bottom: 25px; }

        /* Botón Compartir Netflix Style */
        .share-container { display: flex; justify-content: center; width: 100%; margin-bottom: 30px; }
        .btn-share {
            background: #fff; color: #000; border: none; padding: 14px; width: 95%; 
            border-radius: 5px; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Episodios con Números Gigantes */
        .episodes-section { padding: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: #1e90ff; }
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .episode-card {
            background: #141414; border-radius: 10px; overflow: hidden;
            cursor: pointer; position: relative; border: 1px solid #222; transition: 0.3s;
        }
        .episode-card:hover { border-color: #1e90ff; transform: scale(1.05); }
        .number-bg { height: 110px; display: flex; justify-content: center; align-items: center; background: #0f0f0f; position: relative; overflow: hidden; }
        .big-number { font-family: 'Montserrat', sans-serif; font-size: 5.5rem; font-weight: 900; background: linear-gradient(to bottom, #444, #111); -webkit-background-clip: text; -webkit-text-fill-color: transparent; opacity: 0.6; position: absolute; bottom: -20px; right: 5px; }
        .play-overlay { position: absolute; color: #fff; font-size: 1.8rem; opacity: 0.9; }
        .episode-info { padding: 10px; }
        .ep-label { color: #1e90ff; font-size: 0.7rem; font-weight: 900; }
        .ep-name { font-size: 0.8rem; font-weight: 700; margin-top: 4px; color: #efefef; }

        /* --- PLAYER FULLSCREEN TOTAL --- */
        #player {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999;
        }
        #videoIframe { width: 100%; height: 100%; border: none; }
        .close-btn { 
            position: absolute; top: 30px; left: 30px; z-index: 100000; 
            font-size: 2.5rem; cursor: pointer; color: white;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        @media (max-width: 600px) { .episodes-grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
    </style>
</head>
<body>

    <div class="intro-screen" id="intro">
        <div class="logo-container-intro">LLUTID</div>
    </div>

    <div class="main-content" id="content">
        <header>
            <a href="#" class="header-logo">Llutid<span>+</span></a>
            <i class="fas fa-user-circle fa-lg"></i>
        </header>

        <div class="video-container">
            <iframe id="vimeoTrailer" 
                src="https://player.vimeo.com/video/1153063013?badge=0&autopause=0&autoplay=1&loop=1&muted=0&controls=0&api=1" 
                allow="autoplay; fullscreen"></iframe>
        </div>

        <section class="info-section">
            <div class="badges-container">
                <span class="badge-serie">SERIE</span>
                <span class="badge-parte">PARTE 4</span>
            </div>
            <h1 class="serie-title">La Casa de Papel</h1>
            <p class="serie-desc">El caos se apodera del Banco de España. El Profesor intenta rescatar a Lisboa mientras el equipo lidia con un enemigo interno que pone en riesgo el plan más ambicioso de sus vidas.</p>
            <div class="share-container">
                <button class="btn-share" id="shareBtn"><i class="fas fa-share-alt"></i> Compartir serie</button>
            </div>
        </section>

        <section class="episodes-section">
            <h2 class="section-title">Episodios</h2>
            <div class="episodes-grid" id="grid"></div>
        </section>
    </div>

    <div id="player">
        <i class="fas fa-arrow-left close-btn" id="close"></i>
        <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        const episodes = [
            { n: 1, title: "Game Over", url: "https://drive.google.com/file/d/1S-LTKk4VGl66i6hcw9HXtHPLJ8moNMxh/preview" },
            { n: 2, title: "La boda de Berlín", url: "https://drive.google.com/file/d/1_2Pu86BCTkWxoSkIPClIWv7bEtfr2ySo/preview" },
            { n: 3, title: "Lección de anatomía", url: "https://drive.google.com/file/d/1Q6SCdbiWqTAbKCZZbDz1CDfu4IJWSWTg/preview" },
            { n: 4, title: "Suspiros de España", url: "https://drive.google.com/file/d/1q_02gCecfNE-Jw2tLt_HQ6DCD8CdsUtm/preview" },
            { n: 5, title: "5 minutos antes", url: "https://drive.google.com/file/d/1gryS8ir13vFV4qW4KTGkrqZvDikLHxDI/preview" },
            { n: 6, title: "KO técnico", url: "https://drive.google.com/file/d/1XYJoMQJE9VTw4U16bQWlH-KzVKzbH1uf/preview" },
            { n: 7, title: "Tumbar la carpa", url: "https://drive.google.com/file/d/1lDR-P-K5xwaZIS6GvF90_eLy5sApYvbT/preview" },
            { n: 8, title: "Plan París", url: "https://drive.google.com/file/d/1pOIUNCufD10YRHlwEotTqWgIdGSoaCBD/preview" }
        ];

        const grid = document.getElementById('grid');
        const playerDiv = document.getElementById('player');
        const videoIframe = document.getElementById('videoIframe');
        const trailerIframe = document.getElementById('vimeoTrailer');
        const vimeoPlayer = new Vimeo.Player(trailerIframe);

        episodes.forEach(ep => {
            const card = document.createElement('div');
            card.className = 'episode-card';
            card.innerHTML = `<div class="number-bg"><span class="big-number">${ep.n}</span><i class="fas fa-play play-overlay"></i></div><div class="episode-info"><span class="ep-label">CAPÍTULO ${ep.n}</span><div class="ep-name">${ep.title}</div></div>`;
            
            card.onclick = () => {
                // 1. Pausar Tráiler
                vimeoPlayer.pause();

                // 2. Cargar Video y Mostrar Player
                videoIframe.src = ep.url;
                playerDiv.style.display = 'block';

                // 3. Forzar Pantalla Completa
                if (playerDiv.requestFullscreen) {
                    playerDiv.requestFullscreen();
                } else if (playerDiv.webkitRequestFullscreen) {
                    playerDiv.webkitRequestFullscreen();
                }

                // 4. Forzar Horizontal (si el navegador lo permite)
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            };
            grid.appendChild(card);
        });

        // Botón Cerrar Player
        document.getElementById('close').onclick = () => {
            playerDiv.style.display = 'none';
            videoIframe.src = "";
            
            // Reanudar Tráiler
            vimeoPlayer.play();

            // Salir de Fullscreen
            if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen().catch(() => {}); }
            
            // Liberar orientación
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        };

        // Compartir
        document.getElementById('shareBtn').onclick = () => {
            const shareText = "¡Wow! 😱 Acabo de ver *La Casa de Papel Parte 4* en LLUTID+ y está increíble. ¡Te la recomiendo! \n\n🔗 https://llutid.github.io/serie-lcdp/";
            if (navigator.share) { navigator.share({ title: 'LLUTID+', text: shareText, url: window.location.href }); }
            else { window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank'); }
        };

        // Intro
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }, 5500);
    </script>
</body>
</html>
