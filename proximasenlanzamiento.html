<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llutid+</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #4169E1; --black: #000; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--black); 
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Hero Trailer Estilo Cine */
        .hero { 
            position: relative; 
            width: 100%; 
            height: 80vh; 
            background: #000; 
            display: none;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .hero-video iframe {
            width: 100vh; height: 56.25vh; /* Proporción 16:9 */
            min-width: 100%; min-height: 100%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.5); /* Zoom para llenar pantalla móvil */
        }

        /* Efecto de degradado: Oscuro arriba para el logo, claro/difuminado abajo para info */
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.8) 0%, 
                transparent 40%, 
                rgba(0,0,0,0.5) 70%, 
                var(--black) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px 20px;
        }

        .hero-info h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 2.5rem; 
            margin: 0; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            line-height: 1;
        }

        .hero-info p { 
            font-size: 0.95rem; 
            color: #ddd; 
            margin: 10px 0; 
            line-height: 1.4;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Grid de Estrenos */
        .grid-container { padding: 0 15px; }
        .section-header { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin: 25px 0; 
        }
        .blue-dot { width: 8px; height: 25px; background: var(--blue); border-radius: 20px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        .card { 
            background: #111; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #222;
        }

        .card img { width: 100%; height: 220px; object-fit: cover; }
        
        .card-content { padding: 12px; }
        .card-content strong { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #fff; }
        .card-content span { color: var(--blue); font-size: 0.8rem; font-weight: bold; }

        .btn-wa {
            width: 100%; background: #25D366; color: #fff; border: none;
            padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 10px;
            font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
        }

        /* Barra Inferior */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px; 
            background: rgba(10, 10, 12, 0.98); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 9999;
        }
        .nav-item { color: #888; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #fff; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-item.active svg { color: var(--blue); }

    </style>
</head>
<body onclick="activarAudio()">

    <div class="hero" id="hero">
        <div class="hero-video" id="heroPlayer"></div>
        <div class="hero-overlay">
            <div class="hero-info" id="heroText"></div>
        </div>
    </div>

    <div class="grid-container">
        <div class="section-header">
            <div class="blue-dot"></div>
            <h2 style="font-size: 1.1rem; margin:0;">PRÓXIMOS ESTRENOS</h2>
        </div>
        <div class="grid" id="mainGrid"></div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Home</span>
        </a>
        <a href="proximos.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect></svg>
            <span>Próximos</span>
        </a>
        <a href="chat.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"></path></svg>
            <span>En Vivo</span>
        </a>
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Buscador</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOfpuhunnzCA_NNwJyQJVkSE2SzQbxSYs",
            databaseURL: "https://proximos-d8810-default-rtdb.firebaseio.com",
            projectId: "proximos-d8810",
            appId: "1:216950431757:web:4afa59b1e7daca264f7544"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentVimeoId = "";

        // Activa el audio al primer toque en cualquier parte de la pantalla
        window.activarAudio = () => {
            if(currentVimeoId) {
                const player = document.getElementById('vimeo-iframe');
                if(player) player.src = `https://player.vimeo.com/video/${currentVimeoId}?autoplay=1&loop=1&muted=0`;
            }
        };

        onValue(ref(db, 'proximos'), (snapshot) => {
            const grid = document.getElementById('mainGrid');
            const hero = document.getElementById('hero');
            const heroPlayer = document.getElementById('heroPlayer');
            const heroText = document.getElementById('heroText');
            
            grid.innerHTML = '';
            let estrenos = [];
            snapshot.forEach(child => { 
                let d = child.val(); d.id = child.key; estrenos.push(d); 
            });
            estrenos.reverse();

            // Configurar Hero
            const pVideo = estrenos.find(e => e.link && e.link.includes('vimeo'));
            if(pVideo) {
                hero.style.display = 'block';
                currentVimeoId = pVideo.link.split('/').pop().split('?')[0];
                heroPlayer.innerHTML = `<iframe id="vimeo-iframe" src="https://player.vimeo.com/video/${currentVimeoId}?autoplay=1&loop=1&muted=1&background=1" frameborder="0" allow="autoplay; fullscreen"></iframe>`;
                heroText.innerHTML = `
                    <h1>${pVideo.titulo}</h1>
                    <p>${pVideo.descripcion}</p>
                    <span style="color:var(--blue); font-weight:bold;">${pVideo.fecha} • ${pVideo.hora}</span>
                `;
            }

            // Renderizar Grid
            estrenos.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.imagen}">
                        <div class="card-content">
                            <strong>${p.titulo}</strong>
                            <span>${p.fecha}</span>
                            <button class="btn-wa" onclick="compartir('${p.titulo}', '${p.descripcion}', '${p.fecha}')">
                                COMPARTIR
                            </button>
                        </div>
                    </div>`;
            });
        });

        window.compartir = (t, d, f) => {
            const m = encodeURIComponent(`*¡Lanzamiento en LLUTID+!* 🚀\n\n*${t}*\n📅 ${f}\n📝 ${d}\n\nVer aquí: ${window.location.href}`);
            window.open(`https://api.whatsapp.com/send?text=${m}`, '_blank');
        };
    </script>
</body>
</html>
