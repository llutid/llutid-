<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>LLUTID+</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04040A;--surface:#0C0C16;--surface2:#141425;
  --blue:#3B6EE8;--blue-glow:rgba(59,110,232,0.35);--blue-light:#5E8FFF;
  --white:#F2F2F8;--muted:rgba(242,242,248,0.45);--border:rgba(255,255,255,0.07);
  --card-radius:14px;--font-display:'Bebas Neue',cursive;--font-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);overflow-x:hidden}
body{font-family:var(--font-body);color:var(--white);-webkit-font-smoothing:antialiased}

/* ── LOADING ── */
#loadScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s ease}
#loadScreen.hide{opacity:0;pointer-events:none}
.load-logo{font-family:var(--font-display);font-size:42px;letter-spacing:4px;color:var(--white)}
.load-logo span{color:var(--blue-light)}
.load-bar{width:160px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.load-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-light));border-radius:2px;animation:loadAnim 1.4s ease-in-out infinite}
@keyframes loadAnim{0%{width:0;margin-left:0}50%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}

/* ── HEADER — gradient, clean, no solid bar ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:62px;
  display:flex;align-items:center;padding:0 16px;gap:14px;
  background:linear-gradient(to bottom,rgba(4,4,10,.9) 0%,transparent 100%);
  pointer-events:all;
}
.back-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s,transform .15s;
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{width:20px;height:20px}
.header-logo{font-family:var(--font-display);font-size:22px;letter-spacing:2px;color:var(--white);text-decoration:none}
.header-logo span{color:var(--blue-light)}

/* ── HERO ── */
.movie-hero{position:relative;width:100%;padding-top:62%;background:#000;overflow:hidden}
@media(max-width:480px){.movie-hero{padding-top:82%}}

.hero-skeleton{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(110deg,#0c0c16 30%,#1a1a2e 50%,#0c0c16 70%);
  background-size:300% 100%;animation:sk 1.6s linear infinite;
}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.video-bg{position:absolute;inset:0;z-index:2}
.video-bg iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.video-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* vignettes */
.hero-vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to bottom,rgba(4,4,10,.2) 0%,transparent 30%,transparent 40%,rgba(4,4,10,.7) 68%,rgba(4,4,10,1) 92%)}
.hero-side-vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to right,rgba(4,4,10,.35) 0%,transparent 40%,transparent 60%,rgba(4,4,10,.25) 100%)}

/* mute toggle button */
.hero-mute-btn{
  position:absolute;bottom:72px;right:16px;z-index:5;
  width:36px;height:36px;border-radius:50%;
  background:rgba(4,4,10,.75);border:1.5px solid rgba(255,255,255,.25);
  color:#fff;display:none;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(10px);transition:background .2s,transform .15s;
}
.hero-mute-btn.show{display:flex}
.hero-mute-btn:active{transform:scale(.9)}
.hero-mute-btn svg{width:16px;height:16px}

/* unmute hint pill */
.unmute-hint{
  position:absolute;bottom:72px;left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(4,4,10,.85);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.18);border-radius:50px;
  padding:10px 20px;display:flex;align-items:center;gap:9px;
  font-family:var(--font-body);font-size:13px;font-weight:600;color:rgba(255,255,255,.92);
  cursor:pointer;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.unmute-hint.show{opacity:1;pointer-events:all}
.unmute-hint svg{width:16px;height:16px;flex-shrink:0;color:var(--blue-light)}

/* ── CONTENT ── */
.content{position:relative;z-index:3;padding:0 20px 120px;margin-top:-28px}

.badge-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:4px}
.badge.genre{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}

.movie-title{font-family:var(--font-display);font-size:clamp(28px,8vw,48px);letter-spacing:1px;line-height:1.05;margin-bottom:10px;color:var(--white);text-shadow:0 2px 20px rgba(0,0,0,.8)}

.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.meta-item{font-size:13px;color:var(--muted);font-weight:500}
.meta-sep{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.rating-pill{border:1px solid rgba(255,255,255,.25);padding:2px 8px;border-radius:4px;font-size:12px;color:rgba(255,255,255,.7);font-weight:600}

/* ── BUTTONS ── */
.btn-row{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:12px;font-family:var(--font-body);font-size:16px;font-weight:700;cursor:pointer;border:none;transition:transform .15s,opacity .2s;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn-play{background:#fff;color:#000;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.btn-share{background:rgba(59,110,232,.15);color:var(--blue-light);border:1px solid rgba(59,110,232,.3)}

/* ── DESCRIPTION ── */
.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.description{font-size:15px;line-height:1.65;color:rgba(242,242,248,.8);margin-bottom:26px}

/* ── DETAILS ── */
.details-grid{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--border);margin-bottom:32px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-key{font-size:13px;color:var(--muted);font-weight:500}
.detail-val{font-size:13px;color:var(--white);font-weight:600;text-align:right;max-width:60%}

/* ── RELATED MOVIES ── */
.related-section{margin-bottom:32px}
.related-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.related-title{font-family:var(--font-display);font-size:22px;letter-spacing:1.5px;color:var(--white)}
.cards-row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards-row::-webkit-scrollbar{display:none}
.movie-card{flex-shrink:0;width:116px;height:174px;border-radius:var(--card-radius);overflow:hidden;background:var(--surface2);position:relative;cursor:pointer;transition:transform .22s cubic-bezier(.4,0,.2,1);text-decoration:none;display:block}
.movie-card:active{transform:scale(.93)}
.movie-card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--card-radius)}
.card-shine{position:absolute;inset:0;border-radius:var(--card-radius);background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);pointer-events:none}
.card-label{position:absolute;bottom:0;left:0;right:0;padding:20px 8px 7px;background:linear-gradient(to top,rgba(4,4,10,.88) 0%,transparent 100%);font-size:11px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 0 var(--card-radius) var(--card-radius)}
.card-skel{width:116px;height:174px;border-radius:var(--card-radius);flex-shrink:0;background:linear-gradient(110deg,#0c0c16 30%,#1a1a2e 50%,#0c0c16 70%);background-size:300% 100%;animation:sk 1.6s linear infinite}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadScreen">
  <div class="load-logo">LLUTID<span>+</span></div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
</div>

<div id="mainContent" style="display:none">

  <!-- HEADER -->
  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <a href="home.html" class="header-logo">LLUTID<span>+</span></a>

  <div class="movie-hero" id="movieHero">

    <div class="video-bg" id="videoBg"></div>
    <div class="hero-vignette"></div>
    <div class="hero-side-vignette"></div>

    <!-- Unmute pill — appears after autoplay starts muted -->
    <div class="unmute-hint" id="unmuteHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>

      </svg>
    </button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="badge-row">

      <span class="badge genre" id="genreBadge" style="display:none"></span>

    <h1 class="movie-title" id="movieTitle">Cargando…</h1>

    <div class="meta-row">

      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Compartir en WhatsApp
      </button>
    </div>

    <p class="section-label">Sinopsis</p>

    <p class="section-label">Detalles</p>

    <!-- RELATED MOVIES -->
    <div class="related-section" id="relatedSection" style="display:none">

      </div>

        <div class="card-skel"></div><div class="card-skel"></div><div class="card-skel"></div>
      </div>

  </div>

<!-- Vimeo SDK — must be before module script -->
<script src="https://player.vimeo.com/api/player.js"></script>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment,
         collection, addDoc, query, where, orderBy,
         getDocs, serverTimestamp }               from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }           from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* ── Firebase ── */
const fbConfig  = {apiKey:"AIzaSyAKhAbmWzOH5CXn0QDbwnOlbG49Nr9q8kU",authDomain:"peliculas-88668.firebaseapp.com",projectId:"peliculas-88668",storageBucket:"peliculas-88668.firebasestorage.app",messagingSenderId:"475189564333",appId:"1:475189564333:web:7fe74613ca5082d3890724"};
const fbConfigU = {apiKey:"AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",authDomain:"llutid-18d26.firebaseapp.com",projectId:"llutid-18d26",storageBucket:"llutid-18d26.firebasestorage.app",messagingSenderId:"900505351564",appId:"1:900505351564:web:e71805939e3488170652a9"};
const app  = initializeApp(fbConfig);
const db   = getFirestore(app);
const appU = initializeApp(fbConfigU,"usersM");
const auth = getAuth(appU);

const $       = id => document.getElementById(id);
const movieId = new URLSearchParams(location.search).get('id');

let movieData   = null;
let vimeoPlayer = null;
let nativeVid   = null;
let heroMuted   = true; // always start muted (browser autoplay policy)

/* ── Helpers ── */
function toMp4(url){
  if(!url)return'';
  if(url.includes('archive.org/details/')){
    const id=url.split('/details/')[1].split('/')[0].split('?')[0];
    return`https://archive.org/download/${id}/${id}.mp4`;
  }
  return url;
}
function isVimeo(u){return u&&u.includes('vimeo.com')}
function isYouTube(u){return u&&(u.includes('youtube.com')||u.includes('youtu.be'))}

function sectionLabel(sec){
  const m={terror:'Terror / Suspenso',drama:'Drama',accion:'Acción / Crimen',animada:'Animada / Familiar',comedia:'Comedia',netflix:'Contenido de Netflix',populares:'Populares',destacadas:'Destacadas',top10:'Top 10'};
  return m[sec]||sec||'';
}

/* ── Boot ── */
async function loadMovie(){
  if(!movieId){showError('No se especificó película.');return;}
  try{
    const snap=await getDoc(doc(db,'movies',movieId));
    if(!snap.exists()){showError('Película no encontrada.');return;}
    movieData={id:snap.id,...snap.data()};
    renderMovie(movieData);
    registerView(movieData);
    loadRelated(movieData);
  }catch(e){
    console.error(e);
    showError('Error al cargar. Revisa tu conexión.');
  }
}

/* ── Render ── */
function renderMovie(m){
  document.title=`${m.title||'Película'} | LLUTID+`;

  // badges
  $('typeBadge').textContent=(m.type||'').toLowerCase()==='serie'?'SERIE':'PELÍCULA';
  if(m.genre||m.section){$('genreBadge').textContent=m.genre||sectionLabel(m.section);$('genreBadge').style.display='';}

  // title & meta
  $('movieTitle').textContent=m.title||'Sin título';
  if(m.year){$('metaYear').textContent=m.year;$('sep1').style.display='';}
  if(m.rating){$('metaRating').textContent=m.rating;$('metaRating').style.display='';$('sep2').style.display='';}
  if(m.duration)$('metaDuration').textContent=m.duration;

  // desc & details
  $('movieDesc').textContent=m.description||m.desc||'Sin descripción disponible.';
  $('detailYear').textContent=m.year||'—';
  $('detailGenre').textContent=m.genre||sectionLabel(m.section)||'—';
  $('detailDuration').textContent=m.duration||'—';
  $('detailRating').textContent=m.rating||'—';
  $('detailLang').textContent=m.lang||'Español';

  // trailer
  setupTrailer(m);

  // ── "Ver película" → pause trailer, go to player page ──
  $('playBtn').onclick=()=>{
    pauseTrailer();
    location.href=`player.html?id=${movieId}`;
  };

  $('shareBtn').onclick=()=>shareMovie(m);

  hideLoadScreen();
  $('mainContent').style.display='block';
}

/* ── Trailer setup ── */
function setupTrailer(m){
  const rawUrl=m.trailerUrl||m.trailer||'';
  const bg=$('videoBg');
  const hideSkel=()=>{$('heroSkeleton').style.display='none';};

  if(!rawUrl){
    // fallback: poster image
    if(m.image)bg.innerHTML=`<img src="${m.image}" alt="${m.title||''}">`;
    hideSkel();return;
  }

  if(isVimeo(rawUrl)){
    setupVimeoTrailer(rawUrl,hideSkel);
  }else if(isYouTube(rawUrl)){
    const yt=rawUrl.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
    const ytId=yt?yt[1]:'';
    bg.innerHTML=`<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&controls=0&playlist=${ytId}&rel=0" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
    hideSkel();
    showUnmuteHint(); // YouTube iframes can't be unmuted programmatically
  }else{
    setupNativeTrailer(toMp4(rawUrl),hideSkel,m.image);
  }
}

function setupVimeoTrailer(rawUrl,hideSkel){
  const match=rawUrl.match(/(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)/);
  if(!match){hideSkel();return;}
  const vimeoId=match[1];
  const bg=$('videoBg');

  const iframe=document.createElement('iframe');
  iframe.setAttribute('frameborder','0');
  iframe.setAttribute('allow','autoplay;fullscreen;picture-in-picture');
  // background=1 hides Vimeo chrome; muted=1 required for autoplay
  iframe.src=`https://player.vimeo.com/video/${vimeoId}?autoplay=1&background=1&muted=1&loop=1&title=0&byline=0&portrait=0`;
  bg.appendChild(iframe);

  if(!window.Vimeo){hideSkel();showUnmuteHint();return;}
  try{
    vimeoPlayer=new window.Vimeo.Player(iframe);
    vimeoPlayer.on('loaded',()=>{
      hideSkel();
      $('heroMuteBtn').classList.add('show');
      // Try to unmute — succeeds only if browser allows (user already interacted)
      vimeoPlayer.setVolume(1)
        .then(()=>vimeoPlayer.setMuted(false))
        .then(()=>{heroMuted=false;syncMuteUI();})
        .catch(()=>{heroMuted=true;syncMuteUI();showUnmuteHint();});
    });
    vimeoPlayer.on('error',()=>hideSkel());
  }catch(e){hideSkel();}
}

function setupNativeTrailer(url,hideSkel,fallback){
  const bg=$('videoBg');
  nativeVid=document.createElement('video');
  nativeVid.autoplay=true;
  nativeVid.muted=true;  // required for autoplay
  nativeVid.loop=true;
  nativeVid.playsInline=true;
  nativeVid.src=url;
  nativeVid.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';

  nativeVid.onloadeddata=()=>{
    hideSkel();
    $('heroMuteBtn').classList.add('show');
    // After data loads, try unmuting (browser policy may still block)
    nativeVid.muted=false;
    nativeVid.play()
      .then(()=>{heroMuted=false;syncMuteUI();})
      .catch(()=>{nativeVid.muted=true;heroMuted=true;syncMuteUI();showUnmuteHint();});
  };
  nativeVid.onerror=()=>{
    hideSkel();
    if(fallback)bg.innerHTML=`<img src="${fallback}" alt="">`;
  };
  bg.appendChild(nativeVid);
  nativeVid.play().catch(()=>{});
}

/* pause trailer (called before navigating to player) */
function pauseTrailer(){
  if(vimeoPlayer)vimeoPlayer.pause().catch(()=>{});
  if(nativeVid)nativeVid.pause();
}

function syncMuteUI(){
  $('iconSoundOn').style.display=heroMuted?'none':'';
  $('iconSoundOff').style.display=heroMuted?'':'none';
}

function showUnmuteHint(){
  const h=$('unmuteHint');
  h.classList.add('show');
  setTimeout(()=>h.classList.remove('show'),5500);
}

/* user taps hint → unmute (now there IS a user gesture) */
$('unmuteHint').addEventListener('click',()=>{
  $('unmuteHint').classList.remove('show');
  heroMuted=false;
  if(vimeoPlayer)vimeoPlayer.setMuted(false).then(()=>vimeoPlayer.setVolume(1)).catch(()=>{});
  if(nativeVid){nativeVid.muted=false;nativeVid.play().catch(()=>{});}
  syncMuteUI();
  $('heroMuteBtn').classList.add('show');
});

/* mute/unmute toggle button */
$('heroMuteBtn').addEventListener('click',()=>{
  heroMuted=!heroMuted;
  if(vimeoPlayer)vimeoPlayer.setMuted(heroMuted).catch(()=>{});
  if(nativeVid)nativeVid.muted=heroMuted;
  syncMuteUI();
});

/* ── Related movies by section ── */
async function loadRelated(m){
  const sec=m.section;
  if(!sec)return;
  try{
    const q=query(collection(db,'movies'),where('section','==',sec),orderBy('order'));
    const snap=await getDocs(q);
    const list=[];
    snap.forEach(d=>{if(d.id!==movieId)list.push({id:d.id,...d.data()});});
    if(!list.length)return;

    $('relatedTitle').textContent=`Más de ${sectionLabel(sec)}`;
    $('relatedSection').style.display='block';
    const row=$('relatedRow');
    row.innerHTML='';
    list.slice(0,20).forEach(rm=>{
      const a=document.createElement('a');
      a.href=rm.link||`movie.html?id=${rm.id}`;
      a.className='movie-card';
      a.innerHTML=`<img src="${rm.image||''}" alt="${rm.title||''}" loading="lazy"><div class="card-shine"></div><div class="card-label">${rm.title||''}</div>`;
      row.appendChild(a);
    });
  }catch(e){console.warn('Related error:',e);}
}

/* ── Register view ── */
async function registerView(m){
  try{
    await updateDoc(doc(db,'movies',movieId),{views:increment(1)});
    const today=new Date().toISOString().split('T')[0];
    onAuthStateChanged(auth,async user=>{
      const info=user?{uid:user.uid,email:user.email}:{uid:'anon',email:'anónimo'};
      try{await addDoc(collection(db,'views'),{movieId,movieTitle:m.title,date:today,timestamp:serverTimestamp(),...info});}catch(e){}
    });
  }catch(e){}
}

function hideLoadScreen(){
  const ls=$('loadScreen');ls.classList.add('hide');
  setTimeout(()=>ls.style.display='none',600);
}
function showError(msg){
  hideLoadScreen();
  $('mainContent').style.display='block';
  $('movieTitle').textContent=msg;
  $('movieDesc').textContent='Vuelve al inicio e intenta de nuevo.';
  $('heroSkeleton').style.display='none';
}
