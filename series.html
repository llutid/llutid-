<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LLUTID+ | Serie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Barlow:wght@700;900&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://player.vimeo.com/api/player.js"></script>
<style>
@font-face{font-family:'Netflix Sans';src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Rg.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'Netflix Sans';src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'Netflix Sans';src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bd.woff2') format('woff2');font-weight:800;font-display:swap;}
@font-face{font-family:'Netflix Sans';src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bl.woff2') format('woff2');font-weight:900;font-display:swap;}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;background:#000;color:#fff;overflow-x:hidden;font-family:'Netflix Sans','Roboto',sans-serif;}

/* ── HEADER ── */
header{background:rgba(0,0,0,0.88);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);}
.header-left{display:flex;align-items:center;}
.header-back{color:#fff;font-size:26px;margin-right:14px;cursor:pointer;transition:opacity .2s;}
.header-back:hover{opacity:.7}
.header-logo{font-size:1.7rem;font-weight:800;color:#1e90ff;text-shadow:0 0 8px rgba(30,144,255,0.4);text-decoration:none;}
.header-logo span{color:#fff;}
.header-right i{color:#fff;font-size:22px;margin-left:18px;cursor:pointer;}

/* ── HERO TRAILER ── */
.movie-hero{position:relative;width:100%;padding-top:52%;background:#000;overflow:hidden;}
.hero-skeleton{position:absolute;inset:0;background:linear-gradient(110deg,#0a0a0a 30%,#1c1c1c 50%,#0a0a0a 70%);background-size:300% 100%;animation:skAnim 1.6s linear infinite;transition:opacity .4s;z-index:2;}
.hero-skeleton.hidden{opacity:0;pointer-events:none;}
@keyframes skAnim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.video-background{position:absolute;inset:0;z-index:1;}
.video-background iframe,.video-background video{width:100%;height:100%;border:none;display:block;position:absolute;inset:0;object-fit:cover;}
.video-background img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.movie-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.82) 0%,rgba(0,0,0,0) 38%);z-index:3;pointer-events:none;}
.movie-overlay-content{position:absolute;bottom:14px;left:16px;z-index:4;}
.movie-badge{background:#1e90ff;color:#fff;padding:4px 10px;border-radius:4px;font-size:0.72rem;font-weight:700;display:inline-block;letter-spacing:.5px;}
.badge-temp{background:#e50914;margin-left:6px;}
.hero-mute-btn{position:absolute;bottom:14px;right:14px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.3);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;}
.hero-mute-btn:hover{background:rgba(255,255,255,.2);}
.hero-mute-btn svg{width:15px;height:15px;}

/* ── INFO ── */
.movie-info-below{padding:6px 20px 4px;}
.movie-title-main{font-size:2rem;font-weight:900;margin:0 0 6px;line-height:1.1;}
.movie-info-line{display:flex;align-items:center;flex-wrap:wrap;font-size:.95rem;color:#a3a3a3;margin-bottom:4px;gap:10px;}
.movie-info-line .rating{border:1px solid #a3a3a3;padding:2px 6px;border-radius:3px;font-size:.88rem;}

/* ── ACTIONS ── */
.actions{display:flex;flex-direction:column;gap:10px;padding:12px 20px 14px;}
.btn-play{background:#fff;color:#000;display:flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:8px;font-size:1.05rem;font-weight:700;cursor:pointer;border:none;transition:background .2s,transform .15s;}
.btn-play:active{transform:scale(.97);}
.btn-play i{margin-right:10px;font-size:18px;}
.btn-share{background:#282828;color:#fff;display:flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:8px;font-size:1.05rem;font-weight:700;cursor:pointer;border:none;transition:background .2s,transform .15s;}
.btn-share:active{transform:scale(.97);}
.btn-share i{margin-right:10px;}

/* ── PROGRESS BAR ── */
#info-progress-section{padding:0 20px 14px;}
.info-progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.info-progress-label span{font-size:.7rem;color:#444;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.info-progress-label .resume-time{color:#1e90ff;font-weight:700;font-size:.7rem;}
.info-progress-track{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:999px;position:relative;}
.info-progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#0055ff,#0099ff);transition:width .7s cubic-bezier(.4,0,.2,1);position:relative;}
.info-progress-fill.has-progress::after{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#00aaff;box-shadow:0 0 7px #0088ffcc;}

/* ── DETAILS ── */
.details-section{padding:0 20px;margin-bottom:18px;}
.summary{font-size:.95rem;line-height:1.55;color:#ccc;margin-bottom:16px;}
.info-details{font-size:.9rem;line-height:1.65;color:#a3a3a3;}
.info-details strong{color:#fff;}

/* ── TEMPORADAS TABS ── */
.seasons-section{padding:0 20px 28px;}
.seasons-title{font-size:1.1rem;font-weight:700;color:#1e90ff;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.season-tabs-wrap{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.season-tabs-wrap::-webkit-scrollbar{display:none;}
.season-tab{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.65);padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Netflix Sans',sans-serif;white-space:nowrap;transition:all .2s;flex-shrink:0;}
.season-tab.active{background:#1e90ff;color:#fff;border-color:#1e90ff;box-shadow:0 4px 14px rgba(30,144,255,0.4);}

/* ── EPISODIOS GRID ── */
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;}
.episode-card{background:#141414;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.07);transition:border-color .2s,transform .2s;}
.episode-card:active{transform:scale(.95);}
.episode-card:hover{border-color:#1e90ff;}
.number-bg{height:105px;display:flex;justify-content:center;align-items:center;background:#0f0f0f;position:relative;overflow:hidden;}
.big-number{font-family:'Montserrat',sans-serif;font-size:5rem;font-weight:900;background:linear-gradient(to bottom,#444,#111);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.6;position:absolute;bottom:-18px;right:4px;}
.play-overlay{position:absolute;color:#fff;font-size:1.7rem;opacity:.88;}
.ep-progress-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);}
.ep-progress-fill{height:100%;background:linear-gradient(90deg,#0055ff,#0099ff);border-radius:0;}
.episode-info{padding:9px 11px 10px;}
.ep-label{color:#1e90ff;font-size:.68rem;font-weight:700;letter-spacing:.3px;}
.ep-name{font-size:.78rem;font-weight:600;margin-top:3px;color:#efefef;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── NEXT SEASON BTN ── */
.next-season-wrap{padding:0 20px 32px;}
.btn-next-season{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Netflix Sans',sans-serif;text-decoration:none;transition:background .2s,transform .15s;}
.btn-next-season:active{transform:scale(.97);background:rgba(255,255,255,.14);}

/* ── PLAYER VIEW ── */
#view-player{display:none;position:fixed;inset:0;background:#000;z-index:500;}
*{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#player-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;}
#pvid{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}

#p-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.65) 0%,transparent 22%,transparent 60%,rgba(0,0,0,.85) 100%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;}
#player-wrap.show-ui #p-overlay{opacity:1;}

#p-top{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;z-index:20;opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .3s;pointer-events:none;}
#player-wrap.show-ui #p-top{opacity:1;transform:translateY(0);pointer-events:auto;}
#p-logo{display:flex;align-items:center;filter:drop-shadow(0 0 10px #0055ffaa);cursor:pointer;border-radius:6px;padding:4px 8px;transition:background .2s;}
#p-logo:hover{background:rgba(0,100,255,.18);}
#p-logo .txt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(18px,3.5vw,28px);letter-spacing:-.5px;background:linear-gradient(90deg,#1a80ff,#0055dd,#3399ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
#p-logo .plus{font-family:'Barlow',sans-serif;font-weight:900;font-size:clamp(14px,2.5vw,20px);color:#ccd6ee;-webkit-text-fill-color:#ccd6ee;margin-left:2px;line-height:1;}
#p-top-title{color:rgba(255,255,255,.85);font-size:clamp(12px,1.8vw,15px);font-weight:700;margin-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw;text-shadow:0 1px 6px rgba(0,0,0,.7);}

#p-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(0,80,255,.16);border:2.5px solid rgba(0,140,255,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;opacity:0;transition:opacity .3s,transform .18s,background .2s;backdrop-filter:blur(4px);box-shadow:0 0 28px #0066ff44,inset 0 0 18px #0066ff18;pointer-events:none;}
#player-wrap.show-ui #p-center{opacity:1;pointer-events:auto;}
#p-center:hover{background:rgba(0,100,255,.3);transform:translate(-50%,-50%) scale(1.12);}
#p-center svg{width:26px;height:26px;fill:#fff;margin-left:4px;pointer-events:none;}

.skip-zone{position:absolute;top:0;bottom:0;width:35%;z-index:15;cursor:pointer;}
#skip-left{left:0;}#skip-right{right:0;}

#p-controls{position:absolute;bottom:0;left:0;right:0;padding:10px 18px 14px;z-index:20;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;pointer-events:none;}
#player-wrap.show-ui #p-controls{opacity:1;transform:translateY(0);pointer-events:auto;}

#p-prog-wrap{position:relative;height:5px;border-radius:999px;background:rgba(255,255,255,.13);cursor:pointer;margin-bottom:10px;transition:height .18s;touch-action:none;}
#p-prog-wrap:hover,#p-prog-wrap.drag{height:7px;}
#p-buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);border-radius:999px;pointer-events:none;}
#p-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;pointer-events:none;background:linear-gradient(90deg,#0033ff 0%,#0066ff 20%,#0099ff 40%,#00bbff 55%,#0099ff 70%,#0066ff 85%,#0044cc 100%);background-size:200% 100%;animation:blueShift 3s linear infinite;box-shadow:0 0 10px #0088ffaa;}
@keyframes blueShift{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}
#p-thumb{position:absolute;top:50%;right:-6px;width:13px;height:13px;border-radius:50%;background:#fff;transform:translateY(-50%) scale(0);box-shadow:0 0 8px #0099ff;transition:transform .15s;pointer-events:none;}
#p-prog-wrap:hover #p-thumb,#p-prog-wrap.drag #p-thumb{transform:translateY(-50%) scale(1);}
#p-tip{position:absolute;bottom:14px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;pointer-events:none;opacity:0;white-space:nowrap;transform:translateX(-50%);border:1px solid rgba(0,120,255,.35);transition:opacity .15s;}

#p-btn-row{display:flex;align-items:center;gap:3px;}
.p-btn{background:none;border:none;color:#fff;width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s;flex-shrink:0;touch-action:manipulation;}
.p-btn:hover{background:rgba(0,120,255,.22);transform:scale(1.1);}
.p-btn:active{transform:scale(.9);}
.p-btn svg{width:20px;height:20px;fill:#fff;pointer-events:none;}
#p-time{color:rgba(255,255,255,.82);font-size:12px;font-weight:600;margin-left:4px;flex-shrink:0;min-width:90px;}
#p-spacer{flex:1;}
#p-vol-wrap{display:flex;align-items:center;gap:6px;}
#p-vol-slider{-webkit-appearance:none;width:60px;height:4px;border-radius:999px;background:rgba(60,130,255,.28);outline:none;cursor:pointer;}
#p-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#7ab0ff;}
#p-vol-slider::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#7ab0ff;}
#p-qual{background:rgba(0,80,255,.18);border:1px solid rgba(0,140,255,.4);color:#88bbff;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 7px;border-radius:4px;flex-shrink:0;}

#p-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;}
#p-loader.on{opacity:1;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.07);border-top-color:#0088ff;border-right-color:#0044cc;border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 18px #0066ff55;}
@keyframes spin{to{transform:rotate(360deg);}}

.ripple{position:absolute;border-radius:50%;background:rgba(0,130,255,.2);width:80px;height:80px;margin-left:-40px;margin-top:-40px;animation:ripOut .55s ease-out forwards;pointer-events:none;z-index:14;}
@keyframes ripOut{0%{transform:scale(0);opacity:1;}100%{transform:scale(3.5);opacity:0;}}
.seek-flash{position:absolute;top:0;bottom:0;width:35%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,100,255,.15) 0%,transparent 70%);pointer-events:none;animation:sfOut .45s ease-out forwards;z-index:16;}
.seek-flash.left{left:0;}.seek-flash.right{right:0;}
@keyframes sfOut{0%{opacity:1;}100%{opacity:0;}}
.seek-flash-inner{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 0 12px #0088ff;}
.seek-flash-inner svg{fill:#fff;width:22px;height:22px;}

#p-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);background:rgba(0,0,0,.72);border:1px solid rgba(0,140,255,.45);color:#fff;font-size:13px;font-weight:700;padding:9px 20px;border-radius:40px;opacity:0;pointer-events:none;z-index:40;backdrop-filter:blur(8px);transition:opacity .2s,transform .2s;}
#p-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

#p-swipe-bar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(0,150,255,.7);transform:scaleX(0);transform-origin:left;pointer-events:none;z-index:50;transition:transform .08s;}

/* ── NEXT EPISODE OVERLAY ── */
#next-ep-overlay{
  position:absolute;inset:0;z-index:60;
  background:rgba(0,0,0,.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  animation:fadeInNE .4s ease both;
  backdrop-filter:blur(6px);
}
#next-ep-overlay.show{display:flex;}
@keyframes fadeInNE{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.ne-badge{background:rgba(30,144,255,.2);border:1px solid rgba(30,144,255,.5);color:#1e90ff;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;}
.ne-series-title{font-family:'Montserrat',sans-serif;font-size:clamp(13px,3vw,18px);font-weight:800;color:rgba(255,255,255,.55);text-align:center;max-width:80vw;}
.ne-ep-title{font-family:'Montserrat',sans-serif;font-size:clamp(16px,4vw,24px);font-weight:900;color:#fff;text-align:center;max-width:82vw;line-height:1.2;}
/* Círculo countdown */
.ne-countdown-ring{position:relative;width:80px;height:80px;cursor:pointer;}
.ne-ring-svg{width:80px;height:80px;transform:rotate(-90deg);}
.ne-ring-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4;}
.ne-ring-fill{fill:none;stroke:#1e90ff;stroke-width:4;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px #1e90ffaa);}
.ne-countdown-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900;color:#fff;}
.ne-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.ne-btn-play{background:#fff;color:#000;border:none;padding:13px 32px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Netflix Sans',sans-serif;display:flex;align-items:center;gap:8px;transition:transform .15s,opacity .15s;}
.ne-btn-play:active{transform:scale(.96);}
.ne-btn-cancel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:13px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Netflix Sans',sans-serif;transition:background .2s;}
.ne-btn-cancel:hover{background:rgba(255,255,255,.18);}

/* Rotate hint */
#p-rotate{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .35s;}
#p-rotate.show{opacity:1;pointer-events:auto;}
#rotate-phone-wrap{width:72px;height:72px;display:flex;align-items:center;justify-content:center;animation:phoneTilt 2s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes phoneTilt{0%,15%{transform:rotate(0deg);}45%,75%{transform:rotate(-90deg) scale(1.08);}100%{transform:rotate(0deg);}}
#rotate-phone-wrap svg{width:56px;height:56px;}
#p-rotate h3{color:#fff;font-size:1.05rem;font-weight:700;text-align:center;max-width:240px;line-height:1.4;margin:0;}
#p-rotate p{color:rgba(255,255,255,.4);font-size:.82rem;margin:0;text-align:center;}
.rh-dots{display:flex;gap:9px;}
.rh-dots span{width:8px;height:8px;border-radius:50%;background:#1e90ff;opacity:.3;animation:dotPop 1.3s ease-in-out infinite;}
.rh-dots span:nth-child(2){animation-delay:.22s;}.rh-dots span:nth-child(3){animation-delay:.44s;}
@keyframes dotPop{0%,100%{opacity:.25;transform:scale(1);}50%{opacity:1;transform:scale(1.35);}}
#rotate-back-btn{padding:10px 24px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.55);font-size:.85rem;font-weight:600;cursor:pointer;}
#rotate-back-btn:hover{background:rgba(255,255,255,.12);}

#p-error{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;color:#fff;text-align:center;padding:30px;}
#p-error.on{display:flex;}
#p-error .err-icon{font-size:46px;}
#p-error h2{font-size:1.3rem;font-weight:700;}
#p-error p{color:rgba(255,255,255,.55);font-size:.9rem;max-width:300px;line-height:1.5;}
#p-error button{padding:11px 26px;border-radius:30px;background:rgba(0,80,255,.25);border:1.5px solid rgba(0,140,255,.5);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;}

@media(max-width:600px){
  .episodes-grid{grid-template-columns:1fr 1fr;}
  .movie-title-main{font-size:1.6rem;}
  .movie-info-line{font-size:.85rem;}
}
</style>
</head>
<body>

<!-- ══ VISTA INFO ══ -->
<div id="view-info" style="display:flex;flex-direction:column;min-height:100vh;">

  <header>
    <div class="header-left">
      <i class="fas fa-arrow-left header-back" onclick="history.back()"></i>

<script type="module">
import { initializeApp }             from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const fbConfig={
  apiKey:"AIzaSyAKhAbmWzOH5CXn0QDbwnOlbG49Nr9q8kU",
  authDomain:"peliculas-88668.firebaseapp.com",
  projectId:"peliculas-88668",
  storageBucket:"peliculas-88668.firebasestorage.app",
  messagingSenderId:"475189564333",
  appId:"1:475189564333:web:7fe74613ca5082d3890724"
};
const app=initializeApp(fbConfig);
const db=getFirestore(app);

const seriesId=new URLSearchParams(location.search).get('id');
const $=id=>document.getElementById(id);

// Progreso: guarda por {seriesId}_{si}_{ei}
function progKey(si,ei){return`seriesProgress_${seriesId}_s${si}_e${ei}`;}
function saveProgress(si,ei,seconds){if(seconds>5)localStorage.setItem(progKey(si,ei),seconds.toFixed(1));}
function loadProgress(si,ei){return parseFloat(localStorage.getItem(progKey(si,ei))||'0');}
function getLastWatched(){
  const k=`seriesLastWatched_${seriesId}`;
  try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}
}
function saveLastWatched(si,ei){localStorage.setItem(`seriesLastWatched_${seriesId}`,JSON.stringify({si,ei}));}

let seriesData=null;
let vimeoPlayer=null,nativeTrailerVid=null,heroMuted=false;
let currentSi=0;  // temporada activa en la UI de info
let playerSi=0,playerEi=0;  // episodio actualmente en el player
let rotateHintShown=false,playerStarted=false;

function fmtTime(s){if(!s||isNaN(s)||!isFinite(s))return'0:00';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60).toString().padStart(2,'0');return h?`${h}:${m.toString().padStart(2,'0')}:${sec}`:`${m}:${sec}`;}
function isVimeo(u){return u&&u.includes('vimeo.com');}
function isYouTube(u){return u&&(u.includes('youtube.com')||u.includes('youtu.be'));}
function extractVimeoId(url){const m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:null;}
function toDirectUrl(url){
  if(!url)return'';
  if(url.includes('archive.org/details/')){const id=url.split('/details/')[1].split('/')[0].split('?')[0];return`https://archive.org/download/${id}/${id}.mp4`;}
  if(url.includes('drive.google.com/file/d/')){const m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;}
  return url;
}

// ── LOAD SERIES ──
async function loadSeries(){
  if(!seriesId){showInfoError('No se especificó una serie.');return;}
  try{
    const snap=await getDoc(doc(db,'series',seriesId));
    if(!snap.exists()){showInfoError('Serie no encontrada.');return;}
    seriesData={id:snap.id,...snap.data()};
    renderInfo(seriesData);
  }catch(e){console.error(e);showInfoError('Error al cargar. Verifica tu conexión.');}
}

function renderInfo(s){
  document.title=`LLUTID+ | ${s.title||'Serie'}`;
  $('seriesTitle').textContent=s.title||'Sin título';
  if(s.year)$('metaYear').textContent=s.year;
  if(s.rating){$('metaRating').textContent=s.rating;$('metaRating').style.display='';}
  if(s.genre)$('metaGenre').textContent=s.genre;
  if(s.lang)$('metaLang').textContent=s.lang;
  $('seriesDesc').textContent=s.description||'Sin descripción disponible.';

  const rows=[
    s.genre?`<strong>Género:</strong> ${s.genre}`:null,
    s.lang?`<strong>Idioma:</strong> ${s.lang}`:null,
    s.rating?`<strong>Clasificación:</strong> ${s.rating}`:null,
    (s.seasons||[]).length?`<strong>Temporadas:</strong> ${s.seasons.length}`:null,
  ].filter(Boolean);
  $('seriesDetails').innerHTML=rows.join('<br>');

  const seasons=s.seasons||[];
  if(seasons.length){
    $('totalSeasBadge').textContent=`${seasons.length} TEMP.`;
    $('totalSeasBadge').style.display='';
  }

  setupTrailer(s);
  buildSeasonTabs(seasons);
  renderEpisodes(0);
  setupPlayButton(seasons);
  refreshInfoProgress(seasons);

  $('shareButton').addEventListener('click',()=>shareSeries(s));
}

function buildSeasonTabs(seasons){
  const wrap=$('seasonTabs');wrap.innerHTML='';
  seasons.forEach((sea,i)=>{
    const btn=document.createElement('button');
    btn.className='season-tab'+(i===0?' active':'');
    btn.textContent=sea.title||`Temporada ${i+1}`;
    btn.onclick=()=>{currentSi=i;document.querySelectorAll('.season-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderEpisodes(i);updateNextSeasonBtn(i,seasons);};
    wrap.appendChild(btn);
  });
  updateNextSeasonBtn(0,seasons);
}

function renderEpisodes(si){
  const seasons=seriesData?.seasons||[];
  const eps=(seasons[si]||{}).episodes||[];
  const grid=$('episodesGrid');
  if(!eps.length){grid.innerHTML='<p style="color:#666;font-size:13px">Sin episodios en esta temporada.</p>';return;}
  grid.innerHTML=eps.map((ep,ei)=>{
    const saved=loadProgress(si,ei);
    const hasProg=saved>5;
    return`<div class="episode-card" onclick="openEpisode(${si},${ei})">
      <div class="number-bg">
        <span class="big-number">${ep.n||ei+1}</span>
        <i class="fas fa-play play-overlay"></i>
        <div class="ep-progress-bar"><div class="ep-progress-fill" style="width:${hasProg?Math.min(100,(saved/3600)*100):0}%"></div></div>
      </div>
      <div class="episode-info">
        <span class="ep-label">CAP. ${ep.n||ei+1}</span>
        <div class="ep-name">${ep.title||`Capítulo ${ep.n||ei+1}`}</div>
      </div>
    </div>`;
  }).join('');
}

function updateNextSeasonBtn(si,seasons){
  const wrap=$('nextSeasonWrap');
  if(si<seasons.length-1){
    wrap.style.display='block';
    $('nextSeasonTxt').textContent=`Continuar con ${seasons[si+1].title||'Temporada '+(si+2)}`;
    $('nextSeasonBtn').onclick=()=>{
      currentSi=si+1;
      document.querySelectorAll('.season-tab').forEach((b,i)=>b.classList.toggle('active',i===currentSi));
      renderEpisodes(currentSi);updateNextSeasonBtn(currentSi,seasons);
      document.querySelector('.seasons-section')?.scrollIntoView({behavior:'smooth'});
    };
  }else{wrap.style.display='none';}
}

function setupPlayButton(seasons){
  const last=getLastWatched();
  if(last){
    const sea=seasons[last.si];const ep=(sea?.episodes||[])[last.ei];
    if(ep){$('playBtnText').textContent=`Continuar: ${sea.title||'T'+(last.si+1)} – Cap. ${ep.n||last.ei+1}`;$('playFirstBtn').onclick=()=>openEpisode(last.si,last.ei);return;}
  }
  $('playBtnText').textContent='Reproducir desde el inicio';
  $('playFirstBtn').onclick=()=>{const eps=(seasons[0]||{}).episodes||[];if(eps.length)openEpisode(0,0);};
}

function refreshInfoProgress(seasons){
  const last=getLastWatched();if(!last)return;
  const sea=seasons[last.si];const ep=(sea?.episodes||[])[last.ei];if(!ep)return;
  const saved=loadProgress(last.si,last.ei);if(saved<5)return;
  $('info-progress-section').style.display='block';
  const pct=Math.min(100,(saved/3600)*100);
  $('info-progress-fill').style.width=pct+'%';
  $('info-progress-fill').classList.add('has-progress');
  $('info-resume-time').textContent=fmtTime(saved);
}

function setupTrailer(s){
  const rawUrl=s.trailerUrl||'';
  const bg=$('videoBackground');const skel=$('heroSkeleton');
  const muteBtn=$('heroMuteBtn');
  const hideSkel=()=>skel.classList.add('hidden');

  if(!rawUrl){if(s.image)bg.innerHTML=`<img src="${s.image}" alt="${s.title}">`;hideSkel();return;}

  if(isVimeo(rawUrl)){
    const vid=extractVimeoId(rawUrl);if(!vid){hideSkel();return;}
    const iframeSrc=`https://player.vimeo.com/video/${vid}?badge=0&autopause=0&autoplay=1&loop=1&controls=0&muted=1&background=0`;
    const iframe=document.createElement('iframe');
    iframe.src=iframeSrc;iframe.frameBorder='0';iframe.allow='autoplay; fullscreen; picture-in-picture';
    iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;';
    bg.appendChild(iframe);
    heroMuted=true;updateHeroMuteIcon(true);muteBtn.style.display='flex';
    const initVP=()=>{
      if(typeof Vimeo==='undefined'){setTimeout(initVP,200);return;}
      vimeoPlayer=new Vimeo.Player(iframe);
      vimeoPlayer.on('loaded',()=>{hideSkel();vimeoPlayer.play().catch(()=>{});});
      vimeoPlayer.on('play',()=>{
        hideSkel();
        vimeoPlayer.setMuted(false).then(()=>vimeoPlayer.setVolume(1)).then(()=>{heroMuted=false;updateHeroMuteIcon(false);}).catch(()=>{heroMuted=true;updateHeroMuteIcon(true);});
      });
      muteBtn.addEventListener('click',()=>{heroMuted=!heroMuted;if(heroMuted)vimeoPlayer.setMuted(true).catch(()=>{});else vimeoPlayer.setMuted(false).then(()=>vimeoPlayer.setVolume(1)).catch(()=>{});updateHeroMuteIcon(heroMuted);});
    };
    initVP();return;
  }

  if(isYouTube(rawUrl)){
    const m=rawUrl.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);const ytId=m?m[1]:'';
    bg.innerHTML=`<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&controls=0&playlist=${ytId}" frameborder="0" allow="autoplay; fullscreen"></iframe>`;
    hideSkel();return;
  }

  const v=document.createElement('video');v.autoplay=true;v.muted=false;v.loop=true;v.playsInline=true;v.src=toDirectUrl(rawUrl);
  v.onloadeddata=hideSkel;v.onerror=()=>{hideSkel();if(s.image)bg.innerHTML=`<img src="${s.image}" alt="${s.title}">`;};
  bg.appendChild(v);nativeTrailerVid=v;
  v.play().catch(()=>{v.muted=true;heroMuted=true;v.play().catch(()=>{});updateHeroMuteIcon(true);});
  muteBtn.style.display='flex';updateHeroMuteIcon(false);
  muteBtn.addEventListener('click',()=>{heroMuted=!heroMuted;v.muted=heroMuted;updateHeroMuteIcon(heroMuted);});
}

function updateHeroMuteIcon(muted){
  $('muteIconHero').style.display=muted?'':'none';
  $('unmuteIconHero').style.display=muted?'none':'';
}
function pauseTrailer(){if(vimeoPlayer)vimeoPlayer.pause().catch(()=>{});if(nativeTrailerVid)nativeTrailerVid.pause();}
function resumeTrailer(){if(vimeoPlayer)vimeoPlayer.play().catch(()=>{});if(nativeTrailerVid)nativeTrailerVid.play().catch(()=>{});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')resumeTrailer();});

function shareSeries(s){
  const title=s.title||'esta serie';
  const desc=s.description?s.description.substring(0,120)+'…':'';
  const msg=`📺 ¡Estoy viendo *${title}* en *LLUTID+*! 🔥\n\n${desc}\n\n📲 *Descarga LLUTID+:*\nhttps://apk.e-droid.net/apk/app3603927-me107o.apk?v=3\n\n🤖 *Chatbot:* https://llutid.github.io/chat-bot-llutid-/\n\n¡No te la pierdas!`;
  const url=`https://wa.me/?text=${encodeURIComponent(msg)}`;
  if(navigator.share)navigator.share({title:`LLUTID+ | ${title}`,text:msg}).catch(()=>window.open(url,'_blank'));
  else window.open(url,'_blank');
}
function showInfoError(msg){$('seriesTitle').textContent=msg;$('seriesDesc').textContent='Vuelve al inicio.';$('heroSkeleton').classList.add('hidden');}

// ── NAVEGACIÓN INFO ↔ PLAYER ──
window.openEpisode=(si,ei)=>{
  pauseTrailer();playerSi=si;playerEi=ei;
  $('view-info').style.display='none';
  $('view-player').style.display='block';
  document.body.style.overflow='hidden';
  initPlayer(si,ei);
};
function closePlayer(){
  pvid.pause();
  saveProgress(playerSi,playerEi,pvid.currentTime);
  saveLastWatched(playerSi,playerEi);
  hideNextEpOverlay();exitFS();
  playerStarted=false;rotateHintShown=false;
  $('p-rotate').classList.remove('show');
  $('view-player').style.display='none';
  $('view-info').style.display='flex';
  document.body.style.overflow='';
  // Refrescar episodios y progreso
  if(seriesData){renderEpisodes(currentSi);refreshInfoProgress(seriesData.seasons||[]);setupPlayButton(seriesData.seasons||[]);}
  setTimeout(()=>resumeTrailer(),80);
}

const pPlayIcon=$('p-play-icon');const pCenterIcon=$('p-center-icon');

const pBtnMute=$('p-btn-mute');const pBtnFs=$('p-btn-fs');

const pFsIcon=$('p-fs-icon');const pToast=$('p-toast');const pTopTitle=$('p-top-title');
const pSwipeBar=$('p-swipe-bar');const pRotate=$('p-rotate');
const pError=$('p-error');

const PP_PLAY="M8 5v14l11-7z";const PP_PAUSE="M6 19h4V5H6v14zm8-14v14h4V5h-4z";
const PP_VOL="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z";
const PP_MUTE="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";
const FS_ENTER="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z";
const FS_EXIT="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z";
const CIRC=2*Math.PI*34; // circumferencia del anillo svg r=34

['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

function showToast(msg,dur=1300){pToast.textContent=msg;pToast.classList.add('show');clearTimeout(pToast._t);pToast._t=setTimeout(()=>pToast.classList.remove('show'),dur);}
function showPlayerError(title,msg){$('p-err-title').textContent=title;$('p-err-msg').textContent=msg;pError.classList.add('on');}

// ── ORIENTATION ──
function isPortrait(){return window.innerHeight>window.innerWidth;}
function onOrientationChange(){if(!playerStarted)return;if(isPortrait())closePlayer();}
window.addEventListener('resize',onOrientationChange,{passive:true});
try{screen.orientation?.addEventListener('change',onOrientationChange);}catch{}

// ── FULLSCREEN ──
function lockLandscape(){try{if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}catch{}}
function isFS(){return!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
function enterFS(){const el=document.documentElement;const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;if(req)return req.call(el).then(lockLandscape).catch(lockLandscape);lockLandscape();return Promise.resolve();}
function exitFS(){const ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;if(ex)ex.call(document).catch(()=>{});}
function onFSChange(){pFsIcon.setAttribute('d',isFS()?FS_EXIT:FS_ENTER);}
document.addEventListener('fullscreenchange',onFSChange);document.addEventListener('webkitfullscreenchange',onFSChange);document.addEventListener('mozfullscreenchange',onFSChange);

// ── UI ──
let uiTimer=null,uiVisible=false;
function showUI(ms=3500){pwrap.classList.add('show-ui');uiVisible=true;clearTimeout(uiTimer);if(!pvid.paused)uiTimer=setTimeout(()=>{pwrap.classList.remove('show-ui');uiVisible=false;},ms);}
function hideUI(){pwrap.classList.remove('show-ui');uiVisible=false;clearTimeout(uiTimer);}
pvid.addEventListener('pause',()=>{clearTimeout(uiTimer);pwrap.classList.add('show-ui');uiVisible=true;});
pvid.addEventListener('play',()=>showUI());

pwrap.addEventListener('pointerup',e=>{
  const controlled=[$('skip-left'),$('skip-right'),$('p-controls'),$('p-top'),$('p-center'),pRotate,$('next-ep-overlay')];
  if(controlled.some(el=>el&&el.contains(e.target)))return;
  if(!uiVisible)showUI(3500);else hideUI();
},{passive:true});

// ── PLAY/PAUSE ──
let playBusy=false;
function syncPIcons(){const d=pvid.paused?PP_PLAY:PP_PAUSE;pPlayIcon.setAttribute('d',d);pCenterIcon.setAttribute('d',d);}
async function togglePlay(){if(playBusy)return;playBusy=true;try{pvid.paused?await pvid.play():pvid.pause();}catch{}finally{playBusy=false;}}
pvid.addEventListener('play',syncPIcons);pvid.addEventListener('pause',syncPIcons);
pCenter.addEventListener('pointerup',e=>{e.stopPropagation();togglePlay();showUI();});
pBtnPlay.addEventListener('pointerup',e=>{e.stopPropagation();togglePlay();showUI();});

// ── PROGRESS ──
let isDragging=false;
function getPct(cx){const r=pprogWrap.getBoundingClientRect();return Math.max(0,Math.min(1,(cx-r.left)/r.width));}
function applySeek(pct){if(pvid.duration&&isFinite(pvid.duration))pvid.currentTime=pct*pvid.duration;}
pprogWrap.addEventListener('pointerdown',e=>{e.preventDefault();isDragging=true;pprogWrap.classList.add('drag');pprogWrap.setPointerCapture(e.pointerId);applySeek(getPct(e.clientX));showUI(6000);});
pprogWrap.addEventListener('pointermove',e=>{if(!pvid.duration)return;const pct=getPct(e.clientX);if(isDragging)applySeek(pct);const r=pprogWrap.getBoundingClientRect();pTip.style.left=(e.clientX-r.left)+'px';pTip.textContent=fmtTime(pct*pvid.duration);pTip.style.opacity='1';});
pprogWrap.addEventListener('pointerup',e=>{isDragging=false;pprogWrap.classList.remove('drag');applySeek(getPct(e.clientX));});
pprogWrap.addEventListener('pointerleave',()=>{if(!isDragging)pTip.style.opacity='0';});

let lastSave=0;
pvid.addEventListener('timeupdate',()=>{
  if(!pvid.duration||isDragging)return;
  const pct=pvid.currentTime/pvid.duration;
  pprogFill.style.width=(pct*100)+'%';pTime.textContent=fmtTime(pvid.currentTime)+' / '+fmtTime(pvid.duration);
  if(pvid.currentTime-lastSave>5){saveProgress(playerSi,playerEi,pvid.currentTime);lastSave=pvid.currentTime;}
  // Mostrar overlay de siguiente cuando queden ~15s y quede contenido
  if(pvid.duration-pvid.currentTime<=15&&pvid.duration>30){maybeShowNextEp();}
});
pvid.addEventListener('progress',()=>{if(!pvid.duration||!pvid.buffered.length)return;pprogBuf.style.width=((pvid.buffered.end(pvid.buffered.length-1)/pvid.duration)*100)+'%';});

// ── SEEK ──
pBtnRew.addEventListener('pointerup',e=>{e.stopPropagation();pvid.currentTime=Math.max(0,pvid.currentTime-10);showToast('⏪ -10s');showUI();});
pBtnFwd.addEventListener('pointerup',e=>{e.stopPropagation();pvid.currentTime=Math.min(pvid.duration||0,pvid.currentTime+10);showToast('⏩ +10s');showUI();});

// ── VOLUMEN ──
function syncVolIcon(){pVolIcon.setAttribute('d',(pvid.muted||pvid.volume===0)?PP_MUTE:PP_VOL);}
pVolSlider.addEventListener('input',()=>{pvid.volume=parseFloat(pVolSlider.value);pvid.muted=pvid.volume===0;syncVolIcon();});
pBtnMute.addEventListener('pointerup',e=>{e.stopPropagation();pvid.muted=!pvid.muted;syncVolIcon();});

// ── SKIP ZONES ──
const tapTimers={left:null,right:null};
function zoneTap(side,e){
  e.preventDefault();e.stopPropagation();
  if(!uiVisible){showUI(3500);return;}
  const cx=e.clientX??e.changedTouches?.[0]?.clientX??0;const cy=e.clientY??e.changedTouches?.[0]?.clientY??0;
  addRipple(cx,cy,e.currentTarget);
  if(tapTimers[side]){clearTimeout(tapTimers[side]);tapTimers[side]=null;if(side==='left'){pvid.currentTime=Math.max(0,pvid.currentTime-10);flashSeek('left');}else{pvid.currentTime=Math.min(pvid.duration||0,pvid.currentTime+10);flashSeek('right');}}
  else{tapTimers[side]=setTimeout(()=>{tapTimers[side]=null;togglePlay();},240);}
  showUI();
}
$('skip-left').addEventListener('pointerup',e=>zoneTap('left',e));
$('skip-right').addEventListener('pointerup',e=>zoneTap('right',e));
function flashSeek(side){const el=document.createElement('div');el.className=`seek-flash ${side}`;const arrow=side==='left'?'<path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>':'<path d="M18 6h-2v12h2zm-3.5 6L6 6v12z"/>';el.innerHTML=`<div class="seek-flash-inner"><svg viewBox="0 0 24 24">${arrow}</svg>${side==='left'?'-10s':'+10s'}</div>`;pwrap.appendChild(el);setTimeout(()=>el.remove(),500);}
function addRipple(x,y,parent){const r=document.createElement('div');r.className='ripple';const rect=parent.getBoundingClientRect();r.style.left=(x-rect.left)+'px';r.style.top=(y-rect.top)+'px';parent.appendChild(r);setTimeout(()=>r.remove(),650);}

// ── SWIPE ──
let swY=null,swX=null;
pwrap.addEventListener('touchstart',e=>{if(isPortrait())return;if(e.touches.length!==1)return;swY=e.touches[0].clientY;swX=e.touches[0].clientX;},{passive:true});
pwrap.addEventListener('touchmove',e=>{if(swY===null)return;const dy=e.touches[0].clientY-swY;const dx=Math.abs(e.touches[0].clientX-swX);if(dx>55||dy<0){swY=null;pSwipeBar.style.transform='scaleX(0)';return;}pSwipeBar.style.transform=`scaleX(${Math.min(dy/80,1)})`;},{passive:true});
pwrap.addEventListener('touchend',e=>{if(swY===null)return;const dy=e.changedTouches[0].clientY-swY;pSwipeBar.style.transform='scaleX(0)';swY=null;if(dy>=80)closePlayer();},{passive:true});

// ── LOADER ──
pvid.addEventListener('waiting',()=>ploader.classList.add('on'));
pvid.addEventListener('playing',()=>ploader.classList.remove('on'));
pvid.addEventListener('canplay',()=>ploader.classList.remove('on'));

// ── TECLADO ──
document.addEventListener('keydown',e=>{
  if($('view-player').style.display==='none')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft'){e.preventDefault();pvid.currentTime=Math.max(0,pvid.currentTime-10);showToast('⏪ -10s');showUI();}
  if(e.code==='ArrowRight'){e.preventDefault();pvid.currentTime=Math.min(pvid.duration||0,pvid.currentTime+10);showToast('⏩ +10s');showUI();}
  if(e.code==='KeyM'){pvid.muted=!pvid.muted;syncVolIcon();}
  if(e.code==='KeyF'){isFS()?exitFS():enterFS();}
  if(e.code==='Escape')closePlayer();
});
pBtnFs.addEventListener('pointerup',e=>{e.stopPropagation();isFS()?exitFS():enterFS();});
pLogo.addEventListener('pointerup',e=>{e.stopPropagation();closePlayer();});
$('p-err-back').addEventListener('click',()=>closePlayer());
$('rotate-back-btn').addEventListener('click',()=>{pRotate.classList.remove('show');closePlayer();});

// ── ENDED ──
pvid.addEventListener('ended',()=>{
  saveProgress(playerSi,playerEi,pvid.duration||0);
  saveLastWatched(playerSi,playerEi);
  showNextEpOverlay();
});

// ══════════════════
// SIGUIENTE CAPÍTULO
// ══════════════════
let nextEpShown=false;
let countdownTimer=null;
const NEXT_COUNTDOWN=10;

function getNextEpisode(){
  const seasons=seriesData?.seasons||[];
  let si=playerSi,ei=playerEi+1;
  if(ei>=(seasons[si]?.episodes||[]).length){si++;ei=0;}
  if(si>=seasons.length)return null;
  const ep=(seasons[si]?.episodes||[])[ei];
  if(!ep)return null;
  return{si,ei,ep,season:seasons[si]};
}

function maybeShowNextEp(){
  if(nextEpShown)return;
  const next=getNextEpisode();
  if(!next)return;
  nextEpShown=true;
  showNextEpOverlay();
}

function showNextEpOverlay(){
  const next=getNextEpisode();
  const overlay=$('next-ep-overlay');
  if(!next){
    // Fin de la serie — volver
    showToast('✅ ¡Serie terminada!',2500);setTimeout(()=>closePlayer(),2800);return;
  }
  pvid.pause();
  $('ne-series-name').textContent=seriesData?.title||'';
  const seaTitle=next.season?.title||`Temporada ${next.si+1}`;
  $('ne-ep-name').textContent=`${seaTitle} · Cap. ${next.ep.n||next.ei+1}: ${next.ep.title||''}`;
  overlay.classList.add('show');
  startCountdown(next);
}

function hideNextEpOverlay(){
  $('next-ep-overlay').classList.remove('show');
  clearTimeout(countdownTimer);nextEpShown=false;
}

function startCountdown(next){
  let remaining=NEXT_COUNTDOWN;
  const numEl=$('ne-countdown');
  const fillEl=$('ne-ring-fill');
  fillEl.style.strokeDashoffset='0';
  numEl.textContent=remaining;

  function tick(){
    remaining--;numEl.textContent=remaining;
    const offset=CIRC*(1-remaining/NEXT_COUNTDOWN);
    fillEl.style.strokeDashoffset=offset;
    if(remaining<=0){playNext(next);return;}
    countdownTimer=setTimeout(tick,1000);
  }
  countdownTimer=setTimeout(tick,1000);

  // Anillo progreso visual usando dashoffset
  fillEl.style.strokeDasharray=CIRC;
  fillEl.style.strokeDashoffset='0';

  $('ne-play-btn').onclick=()=>{clearTimeout(countdownTimer);playNext(next);};
  $('ne-cancel-btn').onclick=()=>{clearTimeout(countdownTimer);hideNextEpOverlay();closePlayer();};
  $('ne-ring').onclick=()=>{clearTimeout(countdownTimer);playNext(next);};
}

function playNext(next){
  hideNextEpOverlay();
  playerSi=next.si;playerEi=next.ei;
  saveLastWatched(playerSi,playerEi);
  loadEpisode(playerSi,playerEi);
  // Actualizar tab de temporada en info por si regresa
  currentSi=playerSi;
}

function loadEpisode(si,ei){
  const seasons=seriesData?.seasons||[];
  const ep=(seasons[si]?.episodes||[])[ei];
  if(!ep){showPlayerError('Episodio no encontrado','No se pudo cargar este capítulo.');return;}
  const seaTitle=seasons[si]?.title||`Temporada ${si+1}`;
  pTopTitle.textContent=`${seriesData?.title||''} · ${seaTitle} – Cap. ${ep.n||ei+1}`;
  pError.classList.remove('on');
  nextEpShown=false;

  const rawUrl=ep.url||'';
  if(!rawUrl){showPlayerError('Sin URL','Este episodio no tiene URL configurada.');return;}

  // Google Drive: usar iframe
  if(rawUrl.includes('drive.google.com')){
    const m=rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(m){
      pvid.style.display='none';
      let iframe=document.getElementById('driveFrame');
      if(!iframe){iframe=document.createElement('iframe');iframe.id='driveFrame';iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;z-index:1;';iframe.allow='autoplay; fullscreen';iframe.setAttribute('allowfullscreen','');pwrap.insertBefore(iframe,pvid.nextSibling);}
      iframe.src=`https://drive.google.com/file/d/${m[1]}/preview`;
      ploader.classList.remove('on');
      return;
    }
  }

  // Ocultar iframe de drive si existía
  const driveFrame=document.getElementById('driveFrame');if(driveFrame){driveFrame.src='';driveFrame.style.display='none';}
  pvid.style.display='block';

  const videoUrl=toDirectUrl(rawUrl);
  pvid.src=videoUrl;pvid.load();
  const saved=loadProgress(si,ei);
  pvid.addEventListener('canplay',function onCanPlay(){pvid.removeEventListener('canplay',onCanPlay);if(saved>5)pvid.currentTime=saved;pvid.play().catch(()=>{});},{once:true});
  showUI(3500);
}

function initPlayer(si,ei){
  if(!seriesData){showPlayerError('Sin datos','No se cargaron los datos de la serie.');return;}
  const seasons=seriesData.seasons||[];
  const ep=(seasons[si]?.episodes||[])[ei];
  if(!ep){showPlayerError('Episodio no encontrado','Verifica los datos de la serie.');return;}
  const seaTitle=seasons[si]?.title||`Temporada ${si+1}`;
  pTopTitle.textContent=`${seriesData.title||''} · ${seaTitle} – Cap. ${ep.n||ei+1}`;
  pError.classList.remove('on');
  nextEpShown=false;

  const rawUrl=ep.url||'';
  if(!rawUrl){showPlayerError('Sin URL','Este episodio no tiene URL configurada.');return;}

  // Google Drive
  if(rawUrl.includes('drive.google.com')){
    const m=rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(m){
      pvid.style.display='none';
      let iframe=document.getElementById('driveFrame');
      if(!iframe){iframe=document.createElement('iframe');iframe.id='driveFrame';iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;z-index:1;';iframe.allow='autoplay; fullscreen';iframe.setAttribute('allowfullscreen','');pwrap.insertBefore(iframe,pvid.nextSibling);}
      iframe.src=`https://drive.google.com/file/d/${m[1]}/preview`;
      ploader.classList.remove('on');
      _startPlayback(si,ei,null);
      return;
    }
  }

  const videoUrl=toDirectUrl(rawUrl);
  pvid.style.display='block';pvid.src=videoUrl;pvid.load();
  const saved=loadProgress(si,ei);
  if(isPortrait()&&!rotateHintShown){
    rotateHintShown=true;pRotate.classList.add('show');
    const onLandscape=()=>{if(!isPortrait()){pRotate.classList.remove('show');_startPlayback(si,ei,saved);window.removeEventListener('resize',onLandscape);try{screen.orientation?.removeEventListener('change',onLandscape);}catch{}}};
    window.addEventListener('resize',onLandscape,{passive:true});
    try{screen.orientation?.addEventListener('change',onLandscape);}catch{}
  }else{_startPlayback(si,ei,saved);}
}

function _startPlayback(si,ei,savedTime){
  playerStarted=true;
  enterFS().finally(()=>{
    if(pvid.src){
      if(savedTime&&savedTime>5)pvid.currentTime=savedTime;
      pvid.play().catch(()=>{});
    }
    showUI(3500);
  });
  saveLastWatched(si,ei);
}

// ── BOOT ──
loadSeries();
</script>
