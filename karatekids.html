<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LLUTID+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- ✅ Vimeo Player API eliminado: ya no se usa new Vimeo.Player()
         porque envolvía el iframe en un <div> y rompía el layout.
         El control pause/play ahora va por postMessage. -->

    <style>
        @font-face { font-family:'Netflix Sans'; src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Rg.woff2') format('woff2'); font-weight:400; font-display:swap; }
        @font-face { font-family:'Netflix Sans'; src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff2') format('woff2'); font-weight:700; font-display:swap; }
        @font-face { font-family:'Netflix Sans'; src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bd.woff2') format('woff2'); font-weight:800; font-display:swap; }
        @font-face { font-family:'Netflix Sans'; src:url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bl.woff2') format('woff2'); font-weight:900; font-display:swap; }

        body {
            font-family:'Netflix Sans','Roboto',sans-serif;
            background-color:#000; color:#fff;
            margin:0; padding:0;
            display:flex; flex-direction:column;
            min-height:100vh; overflow-x:hidden;
        }

        /* ── INTRO ── */
        .intro-screen {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:linear-gradient(135deg,#000,#0a0a0a);
            display:flex; justify-content:center; align-items:center; z-index:1000;
            pointer-events:none;
        }
        .intro-screen.done { display:none; }
        .logo-container-intro {
            font-size:4rem; font-weight:800; color:white; opacity:0; letter-spacing:4px;
            animation:fadeInZoom 2s ease-out forwards, fadeOut 1s ease-in forwards 3.8s;
            text-shadow:0 0 10px #00bfff88,0 0 20px #00bfff44;
            font-family:'Montserrat',sans-serif;
        }
        @keyframes fadeInZoom { 0%{opacity:0;transform:scale(0.5);} 100%{opacity:1;transform:scale(1);} }
        @keyframes fadeOut    { to{opacity:0;transform:scale(1.05);} }

        .main-content { display:none; flex-grow:1; }

        /* ── HEADER ── */
        header {
            background-color:rgba(0,0,0,0.7); padding:15px 20px;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:10;
        }
        .header-left  { display:flex; align-items:center; }
        .header-back  { color:#fff; font-size:28px; margin-right:15px; cursor:pointer; }
        .header-logo  { font-size:1.8rem; font-weight:800; color:#1e90ff; text-shadow:0 0 8px rgba(30,144,255,0.4); text-decoration:none; }
        .header-logo:hover { opacity:0.8; }
        .header-logo span { color:white; }
        .header-title { font-size:1.2rem; font-weight:700; margin-left:20px; }
        .header-right { display:flex; align-items:center; }
        .header-right i { color:#fff; font-size:24px; margin-left:20px; cursor:pointer; }

        /* ── HERO ── */
        .movie-hero {
            position:relative; width:100%; padding-top:65%;
            background-color:#000; margin-bottom:10px;
            box-shadow:0 8px 20px rgba(0,0,0,0.5); overflow:hidden;
        }
        .hero-skeleton {
            position:absolute; inset:0;
            background:linear-gradient(110deg,#0a0a0a 30%,#1c1c1c 50%,#0a0a0a 70%);
            background-size:300% 100%; animation:skAnim 1.6s linear infinite;
            transition:opacity 0.4s;
        }
        .hero-skeleton.hidden { opacity:0; pointer-events:none; }
        @keyframes skAnim { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

        /* ── VIDEO BACKGROUND ──
           overflow:hidden es clave para que el cover de Vimeo
           (background=1) recorte bien los bordes                */
        .video-background {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            z-index:1; overflow:hidden;
        }

        /* ✅ MP4 / <video>: object-fit:cover para llenado perfecto */
        .video-background video {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            border:none; display:block;
            object-fit:cover;
        }

        /* ✅ VIMEO con background=1: el player ya maneja el cover
           internamente; solo necesitamos que el iframe llene el div */
        .video-background iframe {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            border:none; display:block;
        }

        .video-background img {
            position:absolute; top:0; left:0;
            width:100%; height:100%; object-fit:cover;
        }

        .movie-hero::before {
            content:''; position:absolute; inset:0;
            background:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,0.5) 40%,rgba(0,0,0,0) 100%);
            z-index:2;
        }
        .movie-overlay-content {
            position:absolute; bottom:0; left:20px; right:20px; z-index:3; color:#fff;
        }
        .movie-badge {
            background-color:#1e90ff; color:#fff; padding:4px 8px;
            border-radius:4px; font-size:0.8rem; font-weight:700;
            display:inline-block; margin-bottom:10px;
        }
        .movie-title-main { font-size:2rem; font-weight:900; margin-top:20px; margin-bottom:5px; line-height:1.1; }
        .movie-info-line { display:flex; align-items:center; font-size:1rem; color:#a3a3a3; margin-bottom:15px; }
        .movie-info-line span { margin-right:15px; }
        .movie-info-line .rating { border:1px solid #a3a3a3; padding:2px 6px; border-radius:3px; font-size:0.9rem; }

        /* Mute button — solo para vídeo nativo MP4 */
        .hero-mute-btn {
            position:absolute; bottom:70px; right:15px; z-index:4;
            width:36px; height:36px; border-radius:50%;
            background:rgba(0,0,0,0.65); border:1.5px solid rgba(255,255,255,0.3);
            color:#fff; display:none; align-items:center; justify-content:center;
            cursor:pointer; transition:background 0.2s;
        }
        .hero-mute-btn:hover { background:rgba(255,255,255,0.2); }
        .hero-mute-btn svg { width:16px; height:16px; }

        /* ── ACTIONS ── */
        .actions { display:flex; flex-direction:column; gap:15px; padding:0 20px; margin-bottom:30px; }
        .btn {
            display:flex; align-items:center; justify-content:center;
            padding:15px 20px; border-radius:8px;
            font-size:1.1rem; font-weight:700; cursor:pointer;
            text-decoration:none; border:none;
            transition:background-color 0.3s; position:relative; overflow:hidden;
        }
        .btn i { margin-right:10px; font-size:20px; position:relative; z-index:1; }
        .btn-text { position:relative; z-index:1; }

        .btn-play { background-color:#fff; color:#000; }
        .btn-play:hover  { background-color:#e8e8e8; }
        .btn-play:active { transform:scale(0.98); background-color:#d0d0d0; }

        /* Watched progress */
        .watched-progress-container {
            width:100%; height:6px; background-color:#404040;
            border-radius:3px; overflow:hidden; margin-top:5px; display:none;
        }
        .watched-progress-bar {
            height:100%; width:0%; background-color:#1e90ff;
            border-radius:3px; transition:width 0.5s ease-out;
        }

        /* Resume badge */
        #resume-badge {
            display:none; position:absolute; top:-8px; right:12px;
            background:#1e90ff; color:#fff;
            font-size:10px; font-weight:700; letter-spacing:1px;
            padding:2px 8px; border-radius:10px;
        }

        .btn-share { background-color:#282828; color:#fff; }
        .btn-share:hover { background-color:#404040; }

        /* ── DETAILS ── */
        .details-section { padding:0 20px; margin-bottom:30px; }
        .summary    { font-size:1rem; line-height:1.5; color:#ccc; margin-bottom:20px; }
        .info-details { font-size:0.95rem; line-height:1.6; color:#a3a3a3; }
        .info-details strong { color:#fff; }

        @media (max-width:768px) {
            .header-title { display:none; }
            .movie-hero { padding-top:85%; }
            .movie-title-main { font-size:1.8rem; margin-top:15px; }
            .movie-info-line  { font-size:0.9rem; }
            .summary,.info-details { font-size:0.9rem; }
            .btn { font-size:1rem; padding:12px 15px; }
        }
    </style>
</head>
<body>

<!-- INTRO -->
<div class="intro-screen" id="introScreen">
    <div class="logo-container-intro">LLUTID</div>
</div>

<!-- MAIN -->
<div class="main-content" id="mainContent">
    <header>
        <div class="header-left">
            <i class="fas fa-arrow-left header-back" onclick="history.back()"></i>
            <a href="home.html" class="header-logo">Llutid<span>+</span></a>
            <div class="header-title" id="headerTitle"></div>
        </div>
        <div class="header-right">
            <i class="fas fa-cast"></i>
            <i class="fas fa-user-circle"></i>
        </div>
    </header>

    <section class="movie-hero">
        <div class="hero-skeleton" id="heroSkeleton"></div>
        <div class="video-background" id="videoBackground"></div>
        <div class="movie-overlay-content">
            <div class="movie-badge" id="typeBadge">PELÍCULA</div>
            <h1 class="movie-title-main" id="movieTitle">Cargando…</h1>
            <div class="movie-info-line">
                <span id="metaYear"></span>
                <span class="rating" id="metaRating" style="display:none"></span>
                <span id="metaDuration"></span>
                <span id="metaLang"></span>
            </div>
        </div>
        <!-- Mute solo para vídeo nativo MP4 -->
        <button class="hero-mute-btn" id="heroMuteBtn">
            <svg id="muteIconHero"   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <svg id="unmuteIconHero" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
    </section>

    <section class="actions">
        <button class="btn btn-play" id="playButton">
            <span id="resume-badge">CONTINUAR</span>
            <i class="fas fa-play"></i>
            <span class="btn-text" id="playBtnText">Ver</span>
        </button>
        <button class="btn btn-share" id="shareButton">
            <i class="fas fa-share-alt"></i> Compartir
        </button>
        <div class="watched-progress-container" id="watchedProgressBarContainer">
            <div class="watched-progress-bar" id="watchedProgressBar"></div>
        </div>
    </section>

    <section class="details-section">
        <p class="summary" id="movieDesc">Cargando descripción…</p>
        <div class="info-details" id="movieDetails"></div>
    </section>
</div>

<script type="module">
import { initializeApp }                       from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc,
         updateDoc, increment,
         collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }         from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const fbConfig = {
    apiKey:"AIzaSyAKhAbmWzOH5CXn0QDbwnOlbG49Nr9q8kU",
    authDomain:"peliculas-88668.firebaseapp.com",
    projectId:"peliculas-88668",
    storageBucket:"peliculas-88668.firebasestorage.app",
    messagingSenderId:"475189564333",
    appId:"1:475189564333:web:7fe74613ca5082d3890724"
};
const fbConfigU = {
    apiKey:"AIzaSyBUaTunBig1_8LQgQmCND4Sm6m_s6E0FSs",
    authDomain:"llutid-18d26.firebaseapp.com",
    projectId:"llutid-18d26",
    storageBucket:"llutid-18d26.firebasestorage.app",
    messagingSenderId:"900505351564",
    appId:"1:900505351564:web:e71805939e3488170652a9"
};
const app  = initializeApp(fbConfig);
const db   = getFirestore(app);
const appU = initializeApp(fbConfigU,"usersM");
const auth = getAuth(appU);

const movieId = new URLSearchParams(location.search).get('id');
const $ = id => document.getElementById(id);

let movieData = null;

// ✅ vimeoIframe: referencia directa al iframe de Vimeo (sin Vimeo.Player wrapper)
// ✅ nativeTrailerVid: elemento <video> para MP4
let vimeoIframe      = null;
let nativeTrailerVid = null;
let heroMuted        = false;
let MOVIE_DURATION_MINUTES = 120;

const MOVIE_PROGRESS_KEY = movieId ? `movieProgress_${movieId}` : 'movieProgress';

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function toDirectMp4(url) {
    if (!url) return '';
    if (url.includes('archive.org/details/')) {
        const id = url.split('/details/')[1].split('/')[0].split('?')[0];
        return `https://archive.org/download/${id}/${id}.mp4`;
    }
    return url;
}
function extractVimeoId(url) {
    const m = url.match(/vimeo\.com\/(\d+)/);
    return m ? m[1] : null;
}
function isVimeo(u)   { return u && u.includes('vimeo.com'); }
function isYouTube(u) { return u && (u.includes('youtube.com') || u.includes('youtu.be')); }
function parseDurationMin(dur) { if(!dur)return 120; const m=dur.match(/(\d+)/); return m?parseInt(m[1]):120; }

/* ══════════════════════════════════════
   VIMEO — control por postMessage
   (evita el wrapping de new Vimeo.Player)
══════════════════════════════════════ */
function vimeoCmd(method, value) {
    if (!vimeoIframe) return;
    try {
        const msg = value !== undefined
            ? JSON.stringify({ method, value })
            : JSON.stringify({ method });
        vimeoIframe.contentWindow.postMessage(msg, '*');
    } catch(e) {}
}

/* ══════════════════════════════════════
   TRAILER — pausa / reanuda
══════════════════════════════════════ */
function pauseTrailer() {
    vimeoCmd('pause');
    if (nativeTrailerVid) nativeTrailerVid.pause();
}
function resumeTrailer() {
    vimeoCmd('play');
    if (nativeTrailerVid) nativeTrailerVid.play().catch(()=>{});
}

/* Al volver del player, reanudar trailer */
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') resumeTrailer();
});

/* ══════════════════════════════════════
   LOAD MOVIE
══════════════════════════════════════ */
async function loadMovie() {
    if (!movieId) { showError('No se especificó una película.'); return; }
    try {
        const snap = await getDoc(doc(db,'movies',movieId));
        if (!snap.exists()) { showError('Película no encontrada.'); return; }
        movieData = { id:snap.id, ...snap.data() };
        renderMovie(movieData);
        registerView(movieData);
    } catch(e) {
        console.error(e);
        showError('Error al cargar. Verifica tu conexión.');
    }
}
loadMovie();

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function renderMovie(m) {
    document.title = `LLUTID+ | ${m.title||'Película'}`;
    MOVIE_DURATION_MINUTES = parseDurationMin(m.duration);

    $('headerTitle').textContent = m.title||'';
    $('typeBadge').textContent   = (m.type||'').toLowerCase()==='serie' ? 'SERIE' : 'PELÍCULA';
    $('movieTitle').textContent  = m.title||'Sin título';

    if (m.year)   $('metaYear').textContent = m.year;
    if (m.rating){ $('metaRating').textContent=m.rating; $('metaRating').style.display=''; }
    if (m.duration) $('metaDuration').textContent = m.duration;
    if (m.lang)     $('metaLang').textContent = m.lang;

    $('movieDesc').textContent = m.description||m.desc||'Sin descripción disponible.';

    const rows = [
        m.duration ? `<strong>Duración:</strong> ${m.duration}` : null,
        m.genre    ? `<strong>Género:</strong> ${m.genre}`      : null,
        m.lang     ? `<strong>Idioma:</strong> ${m.lang}`       : null,
        m.rating   ? `<strong>Clasificación:</strong> ${m.rating}` : null,
    ].filter(Boolean);
    $('movieDetails').innerHTML = rows.join('<br>');

    setupTrailer(m);
    updateWatchedProgressBar();
    checkResumeBadge();

    $('playButton').addEventListener('click', () => {
        if (!movieId) return;
        pauseTrailer();
        window.location.href = `player.html?id=${encodeURIComponent(movieId)}&autoplay=1`;
    });
    $('shareButton').addEventListener('click', () => shareMovie(m));
}

/* ══════════════════════════════════════
   SETUP TRAILER
══════════════════════════════════════ */
function setupTrailer(m) {
    const rawUrl = m.trailerUrl || m.trailer || '';
    const bg     = $('videoBackground');
    const skel   = $('heroSkeleton');
    const hideSkel = () => skel.classList.add('hidden');

    if (!rawUrl) {
        if (m.image) bg.innerHTML = `<img src="${m.image}" alt="${m.title}" onerror="this.style.display='none'">`;
        hideSkel(); return;
    }

    /* ────────────────────────────────
       ✅ VIMEO — background=1 garantiza
       que el video llene el contenedor
       (igual que object-fit:cover en MP4)
       sin barras negras ni tamaño reducido.

       El control pause/play va por
       postMessage → sin new Vimeo.Player()
       → sin el <div> wrapper que arruinaba
       el layout anterior.
    ──────────────────────────────── */
    if (isVimeo(rawUrl)) {
        const vid = extractVimeoId(rawUrl);
        if (!vid) { hideSkel(); return; }

        const iframe = document.createElement('iframe');
        iframe.id    = 'vimeoTrailer';
        // background=1 → Vimeo maneja el cover internamente (recorta y llena)
        iframe.src   = `https://player.vimeo.com/video/${vid}?badge=0&autopause=0&player_id=vimeoTrailer&app_id=58479&autoplay=1&loop=1&controls=0&background=1`;
        iframe.frameBorder    = '0';
        iframe.allow          = 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        // El CSS del iframe ya está en la hoja de estilos (.video-background iframe)
        bg.appendChild(iframe);

        vimeoIframe = iframe;

        // Ocultar skeleton cuando el iframe cargue
        iframe.addEventListener('load', () => {
            hideSkel();
            // Aseguramos que empiece a reproducir
            vimeoCmd('play');
        });

        return;
    }

    /* ────────────────────────────────
       ✅ YOUTUBE
    ──────────────────────────────── */
    if (isYouTube(rawUrl)) {
        const ytm  = rawUrl.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
        const ytId = ytm ? ytm[1] : '';
        bg.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&controls=0&playlist=${ytId}" frameborder="0" allow="autoplay; fullscreen"></iframe>`;
        hideSkel();
        return;
    }

    /* ────────────────────────────────
       ✅ MP4 / archive.org directo
       (object-fit:cover vía CSS)
    ──────────────────────────────── */
    const directUrl = toDirectMp4(rawUrl);
    const v = document.createElement('video');
    v.autoplay    = true;
    v.muted       = false;
    v.loop        = true;
    v.playsInline = true;
    v.src         = directUrl;
    v.onloadeddata = hideSkel;
    v.onerror = () => {
        hideSkel();
        if (m.image) bg.innerHTML = `<img src="${m.image}" alt="${m.title}">`;
    };
    bg.appendChild(v);
    nativeTrailerVid = v;

    v.play().catch(() => {
        // Autoplay con sonido bloqueado → intentar silenciado
        v.muted = true;
        heroMuted = true;
        v.play().catch(()=>{});
        updateMuteIcon();
    });

    // Botón mute — solo para video nativo MP4
    const muteBtn = $('heroMuteBtn');
    muteBtn.style.display = 'flex';
    muteBtn.addEventListener('click', () => {
        heroMuted = !heroMuted;
        v.muted = heroMuted;
        updateMuteIcon();
    });
    function updateMuteIcon() {
        $('muteIconHero').style.display   = heroMuted ? '' : 'none';
        $('unmuteIconHero').style.display = heroMuted ? 'none' : '';
    }
}

/* ══════════════════════════════════════
   PROGRESS BAR / RESUME BADGE
══════════════════════════════════════ */
function updateWatchedProgressBar() {
    const prog = parseFloat(localStorage.getItem(MOVIE_PROGRESS_KEY)||'0');
    const pct  = Math.min(100, Math.max(0, (prog/MOVIE_DURATION_MINUTES)*100));
    if (pct > 0) {
        $('watchedProgressBarContainer').style.display = 'block';
        $('watchedProgressBar').style.width = pct+'%';
    }
}
function checkResumeBadge() {
    const prog = parseFloat(localStorage.getItem(MOVIE_PROGRESS_KEY)||'0');
    if (prog > 1) {
        $('resume-badge').style.display = 'block';
        $('playBtnText').textContent    = 'Continuar';
    }
}

/* ══════════════════════════════════════
   SHARE
══════════════════════════════════════ */
function shareMovie(m) {
    const title = m.title||'esta película';
    const desc  = m.description ? m.description.substring(0,120)+'…' : '';
    const msg   = `🎬 ¡Acabo de ver *${title}* en *LLUTID+* y me impactó! 😱\n\n${desc}\n\n📲 *Descarga LLUTID+:*\nhttps://apk.e-droid.net/apk/app3603927-me107o.apk?v=3\n\n🤖 *Chatbot:* https://llutid.github.io/chat-bot-llutid-/\n📞 +57 3181087834\n\n¡No te pierdas LLUTID+! 🔥`;
    const url   = `https://wa.me/?text=${encodeURIComponent(msg)}`;
    if (navigator.share) navigator.share({title:`LLUTID+ - ${title}`,text:msg}).catch(()=>window.open(url,'_blank'));
    else window.open(url,'_blank');
}

/* ══════════════════════════════════════
   REGISTER VIEW
══════════════════════════════════════ */
async function registerView(m) {
    try {
        await updateDoc(doc(db,'movies',movieId),{views:increment(1)});
        const today = new Date().toISOString().split('T')[0];
        onAuthStateChanged(auth, async user => {
            const ui = user ? {uid:user.uid,email:user.email} : {uid:'anon',email:'anónimo'};
            try { await addDoc(collection(db,'views'),{movieId,movieTitle:m.title,date:today,timestamp:serverTimestamp(),...ui}); } catch(e){}
        });
    } catch(e){}
}

function showError(msg) {
    $('movieTitle').textContent = msg;
    $('movieDesc').textContent  = 'Vuelve al inicio e intenta de nuevo.';
    $('heroSkeleton').classList.add('hidden');
}

setTimeout(() => {
    $('introScreen').classList.add('done');
    $('mainContent').style.display = 'block';
}, 4800);
</script>
